<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable</title>
<style>
  :root { --bg: #fafaf9; --fg: #1c1917; --link: #2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1917; --fg: #f5f5f4; --link: #93c5fd; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 56px 16px; }
  a { color: var(--link); }
</style>
</head>
<body>
<main>
  <p>Page introuvable. <a href="/">Retour à l'accueil</a></p>
</main>
<script>
  // The app moved to /typeinanki/ (#226): its old addresses (/app.html…) follow it.
  var p = location.pathname;
  if (p.indexOf("/typeinanki/") !== 0) location.replace("/typeinanki" + p + location.search + location.hash);
</script>
</body>
</html>
