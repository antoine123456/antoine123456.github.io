                var rows = renderDeckRows(tree, si, src.decks, cardsByDeck, srs, remainingNewToday(src.id));

                return '<div class="h-source">'
                    + '<div class="h-source-header" onclick="toggleSource(this)">'
                    + '<div class="h-source-name">' + esc(src.name) + '</div>'
                    + '<div class="h-source-meta">' + total + ' cartes · ' + src.decks.length + ' deck(s)</div>'
                    + '<button class="h-source-export" onclick="showFlaggedList(event,' + si + ')" title="Cartes marquées à corriger">🚩</button>'
                    + '<button class="h-source-export" onclick="exportStats(event,' + si + ')" title="Exporter les stats">📤</button>'
                    + '<button class="h-source-del" onclick="deleteSource(event,' + si + ')">✕</button>'
                    + '<span class="h-source-arrow open">›</span>'
                    + '</div>'
                    + '<div class="h-decktree open">' + rows + '</div>'
                    + '</div>';
            }).join("");
        }

        function toggleSource(header) {
            var arrow = header.querySelector(".h-source-arrow");
            var tree = header.nextElementSibling;
            var open = tree.classList.toggle("open");
            arrow.classList.toggle("open", open);
        }

        function deleteSource(e, si) {
            e.stopPropagation();
            if (!confirm("Supprimer cette source et toute la progression ?")) return;
            var sources = loadSources();
            var id = sources[si].id;
            sources.splice(si, 1);
            saveSources(sources);
            try { localStorage.removeItem(LS_CARDS + id); } catch (e2) { }
            try { localStorage.removeItem(LS_SRS + id); } catch (e2) { }
            try { localStorage.removeItem(LS_NEWCOUNT + id); } catch (e2) { }
            try { localStorage.removeItem(LS_FLAGGED + id); } catch (e2) { }
            try { localStorage.removeItem(LS_STYLES + id); } catch (e2) { }
            if (fbUser) deleteSourceFromFirestore(id);
            renderHome();
        }

        // ═══════════════════════════════════════════════
        // SESSION STATE
        // ═══════════════════════════════════════════════
        var sess = { sourceIdx: 0, sourceId: null, deckLabel: "", cards: [], queue: [], qIdx: 0, srs: {}, done: 0 };
        var wordRows = [];
        var cardErrors = 0;
        var advancing = false;
        var revealed = false;

        function startStudy(si, deckName, customNewLimit) {
            var sources = loadSources();
            var src = sources[si];
            var cardsByDeck = loadCards(src.id);
            var srs = loadSRS(src.id);

            // Collect all cards from deckName and its children
            var childIds = childDeckIds(src.decks, deckName);
            var allCards = [];
            childIds.forEach(function (did) {
                (cardsByDeck[did] || []).forEach(function (c) { allCards.push(c); });
            });

            var newLimit = customNewLimit != null ? customNewLimit : remainingNewToday(src.id);
            var queue, lyricsInfo = null;
            // Songs: the lyrics view, cards in song order (see buildLyricsQueue).
            var studied = src.decks.filter(function (d) { return childIds.indexOf(d.id) !== -1; });
            if (studied.length && studied.every(function (d) { return d.lyrics; })) {
                var lq = buildLyricsQueue(studied, cardsByDeck, srs, newLimit);
                queue = lq.queue; lyricsInfo = lq.info;
            } else {
                // Split new vs due (learning/relearning cards are always "due" —
                // they're mid-way through short-term steps, not day-scheduled yet)
                var newCards = [], dueCards = [];
                allCards.forEach(function (c) {
                    var s = srs[c.id];
                    if (!s || s.state === "new") newCards.push(c);
                    else if (s.state === "learning" || s.state === "relearning" || s.due <= TODAY) dueCards.push(c);
                });
                shuffle(newCards); shuffle(dueCards);
                newCards = newCards.slice(0, newLimit);
                queue = dueCards.concat(newCards);
            }

            if (!queue.length) { toast("Aucune carte à réviser aujourd'hui 🎉"); return; }

            sess.sourceIdx = si;
            sess.sourceId = src.id;
            sess.deckLabel = deckName.split("::").join(" › ");
            sess.cards = allCards;
            sess.queue = queue;
            sess.qIdx = 0;
            sess.srs = srs;
            sess.done = 0;
            sess.lyrics = lyricsInfo;
            sess.lyricsSeen = {};
            document.getElementById("s-lyrics-opts").style.display = lyricsInfo ? "" : "none";
            document.getElementById("ly-menu").hidden = true;

            document.getElementById("home").style.display = "none";
            document.getElementById("study").style.display = "flex";
            keepKeyboard();
            showCard();
        }

        function goHome() {
            pendingNext = null;
            setBarState("");
            document.body.classList.remove("compact");
            saveSRS(sess.sourceId, sess.srs);
            document.getElementById("study").style.display = "none";
            document.getElementById("home").style.display = "block";
            renderHome();
        }

        // ═══════════════════════════════════════════════
        // CARD HTML — rendered in a Shadow DOM so a note type's own CSS
        // (e.g. Refold Mandarin's global div{} / hr{} rules, its Kai font)
        // applies like in Anki without leaking into the app. Our rules come
        // after the card's <style> so they win: colors/background follow
        // the app theme, base font/size stay the app's, per-class styles
        // (.hanzi, .pinyin…) are kept.
        // ═══════════════════════════════════════════════
        var CARD_SHADOW_CSS = ".card{background:transparent!important;color:inherit!important;font-family:inherit;font-size:inherit;text-align:center;padding:0}"
            + "img{max-width:100%;max-height:50vh;border-radius:8px;margin:8px 0}"
            // Compact layout: a picture fits its half of the card (--card-img-max, see updateZoneHeight)
            + "img{max-height:var(--card-img-max,50vh)}"
            + "[lang|=zh]{font-family:Kai,'Kaiti SC',STKaiti,'PingFang SC','Noto Serif SC',serif}";
        function mountCardHtml(el, html, css) {
            if (!el) return;
            var root = el.shadowRoot || el.attachShadow({ mode: "open" });
            root.innerHTML = (css || "") + '<div class="card">' + html + '</div><style>' + CARD_SHADOW_CSS + '</style>';
            root.querySelectorAll("img").forEach(function (img) {
                if (!img.complete) img.addEventListener("load", scheduleCompactCheck, { once: true });
            });
        }

        // Spanish cards start with a translation-direction header
        // ("🇫🇷 ➡️ 🇪🇸" + blank lines) — not shown (#30). Done at display
        // time so decks already stored in a browser get it too.
        var DIRECTION_HEADER_RE = /(^|<\/style>)\s*(?:🇫🇷|🇪🇸)\s*➡️\s*(?:🇫🇷|🇪🇸)\s*(?:<br\s*\/?>\s*)*/u;
        function displayQuestion(html) {
            return String(html || "").replace(DIRECTION_HEADER_RE, "$1");
        }

        // True when the back holds more than the typed words (an image, a
        // meaning, an example sentence…) — worth showing before moving on.
        function hasRichAnswer(card) {
            if (!card.answer) return false;
            if (/<img/i.test(card.answer)) return true;
            var squash = function (t) { return noAcc(String(t).toLowerCase()).replace(/[\s.,;:!?¡¿'"()\-]+/g, ""); };
            return squash(plainText(card.answer)) !== squash((card.words || []).join(""));
        }

        // ═══════════════════════════════════════════════
        // BROWSE — carrousel, recto + verso affichés, lecture seule (aucun
        // effet sur le SRS). Verso = card.answer (extract.py récent), sinon
        // les mots à taper pour les JSON plus anciens.
        // ═══════════════════════════════════════════════
        var browse = { all: [], list: [], idx: 0, observer: null };

        function openBrowse(si, deckName) {
            var src = loadSources()[si];
            var cardsByDeck = loadCards(src.id);
            browse.sid = src.id;
            var all = [];
            childDeckIds(src.decks, deckName).forEach(function (did) {
                (cardsByDeck[did] || []).forEach(function (c) { all.push(c); });
            });
            if (!all.length) { toast("Aucune carte dans ce deck"); return; }
            browse.all = all.map(function (c) {
                var back = c.answer != null ? c.answer : esc((c.words || []).join(" "));
                return { card: c, back: back, text: (plainText(displayQuestion(c.question)) + " " + plainText(back) + " " + (c.words || []).join(" ")).toLowerCase() };
            });
            browse.list = browse.all;
            // Pictures need room → carousel; words/sentences read better as
            // a dense two-column list.
            browse.carousel = browse.all.some(function (b) { return /<img/i.test(b.card.question + b.back); });
            document.getElementById("b-search").value = "";
            document.getElementById("b-deck-name").textContent = deckName.split("::").join(" › ");
            document.getElementById("home").style.display = "none";
            document.getElementById("browse").style.display = "flex";
            renderBrowse();
        }

        function closeBrowse() {
            document.getElementById("audio-player").pause();
            if (browse.observer) browse.observer.disconnect();
            document.getElementById("b-content").innerHTML = "";
            document.getElementById("browse").style.display = "none";
            document.getElementById("home").style.display = "block";
        }

        function filterBrowse(q) {
            var terms = noAcc(q.toLowerCase()).split(/\s+/).filter(Boolean);
            browse.list = browse.all.filter(function (b) {
                var t = noAcc(b.text);
                return terms.every(function (term) { return t.indexOf(term) !== -1; });
            });
            renderBrowse();
        }

        // Builds empty slide shells for the whole list; each one is filled
        // (front + back, via the Shadow DOM renderer) only when it gets
        // near the viewport, so 1000+ card decks stay light.
        function renderBrowse() {
            var n = browse.list.length;
            var el = document.getElementById("b-content");
            if (browse.observer) browse.observer.disconnect();
            browse.idx = 0;
            if (!n) {
                el.innerHTML = '<div class="h-empty">Aucune carte ne correspond.</div>';
                updateBrowseCount();
                return;
            }
            if (!browse.carousel) { renderBrowseList(el); return; }
            var slides = browse.list.map(function (b, i) {
                return '<div class="s-question b-slide' + (i === 0 ? ' active' : '') + '" data-i="' + i + '"></div>';
            }).join("");
            el.innerHTML = '<div class="b-track" id="b-track">' + slides + '</div>'
                + '<div class="b-nav">'
                + '<button id="b-prev" onclick="stepBrowse(-1)">‹ Préc.</button>'
                + '<span class="b-hint">← → pour défiler</span>'
                + '<button id="b-next" onclick="stepBrowse(1)">Suiv. ›</button>'
                + '</div>';
            var track = document.getElementById("b-track");
            browse.observer = new IntersectionObserver(function (entries) {
                entries.forEach(function (en) {
                    if (en.isIntersecting) fillSlide(en.target);
                });
            }, { root: track, rootMargin: "0px 150%" });
            track.querySelectorAll(".b-slide").forEach(function (sl) { browse.observer.observe(sl); });
            track.addEventListener("scroll", onBrowseScroll, { passive: true });
            track.addEventListener("wheel", onBrowseWheel, { passive: false });
            updateBrowseCount();
        }

        // Mouse wheel (vertical) → one slide per notch; horizontal trackpad
        // swipes keep the native scroll.
        var wheelLock = 0;
        function onBrowseWheel(e) {
            if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
            e.preventDefault();
            var now = Date.now();
            if (now < wheelLock) return;
            wheelLock = now + 250;
            stepBrowse(e.deltaY > 0 ? 1 : -1);
        }

        // Text of a card side, entities decoded, <style>/media dropped
        // (inert <template>: nothing gets loaded).
        function htmlToText(html) {
            var t = document.createElement("template");
            t.innerHTML = String(html || "");
            t.content.querySelectorAll("style,script").forEach(function (n) { n.remove(); });
            return t.content.textContent.replace(/\s+/g, " ").trim();
        }

        function renderBrowseList(el) {
            el.innerHTML = '<div class="b-list">' + browse.list.map(function (b, i) {
                var c = b.card;
                var hasAudio = (c.audioQuestion && c.audioQuestion.length) || (c.audioAnswer && c.audioAnswer.length);
                return '<div class="b-row">'
                    + '<div class="b-row-front">' + esc(htmlToText(displayQuestion(c.question))) + '</div>'
                    + '<div class="b-row-back">' + esc(htmlToText(b.back)) + '</div>'
                    + (hasAudio ? '<button class="b-row-audio" onclick="playBrowseAudio(' + i + ')" title="Écouter">🔊</button>' : '<span></span>')
                    + '</div>';
            }).join("") + '</div>';
            document.getElementById("b-count").textContent = browse.list.length + " cartes";
        }

        function fillSlide(sl) {
            if (sl.dataset.filled) return;
            sl.dataset.filled = "1";
            var b = browse.list[+sl.dataset.i], c = b.card;
            var hasAudio = (c.audioQuestion && c.audioQuestion.length) || (c.audioAnswer && c.audioAnswer.length);
            sl.innerHTML = '<div class="b-front"></div><div class="b-sep">verso</div><div class="b-back"></div>'
                + (hasAudio ? '<button class="b-slide-audio" onclick="playBrowseAudio(' + sl.dataset.i + ')" title="Écouter">🔊</button>' : '');
            var css = cardStyle(browse.sid, c);
            mountCardHtml(sl.querySelector(".b-front"), displayQuestion(c.question), css);
            mountCardHtml(sl.querySelector(".b-back"), b.back, css);
        }

        // Current slide = the one whose centre is closest to the track's.
        function onBrowseScroll() {
            var track = document.getElementById("b-track");
            if (!track) return;
            var mid = track.scrollLeft + track.clientWidth / 2, best = 0, bestD = Infinity;
            var slides = track.children;
            for (var i = 0; i < slides.length; i++) {
                var d = Math.abs(slides[i].offsetLeft + slides[i].offsetWidth / 2 - mid);
                if (d < bestD) { bestD = d; best = i; }
                else if (d > bestD) break;
            }
            if (best === browse.idx) return;
            slides[browse.idx] && slides[browse.idx].classList.remove("active");
            slides[best].classList.add("active");
            browse.idx = best;
            document.getElementById("audio-player").pause();
            updateBrowseCount();
        }

        function updateBrowseCount() {
            var n = browse.list.length;
            document.getElementById("b-count").textContent = (n ? browse.idx + 1 : 0) + " / " + n;
            var prev = document.getElementById("b-prev"), next = document.getElementById("b-next");
            if (prev) prev.disabled = browse.idx === 0;
            if (next) next.disabled = browse.idx >= n - 1;
        }

        function stepBrowse(d) {
            var track = document.getElementById("b-track");
            var target = track && track.children[browse.idx + d];
            if (!target) return;
            track.scrollTo({ left: target.offsetLeft + target.offsetWidth / 2 - track.clientWidth / 2 });
        }

        function playBrowseAudio(i) {
            var c = browse.list[i].card;
            playAudioList((c.audioQuestion || []).concat(c.audioAnswer || []));
        }

        document.addEventListener("keydown", function (e) {
            if (document.getElementById("browse").style.display !== "flex") return;
            var inSearch = e.target && e.target.id === "b-search";
            if (!browse.carousel && !inSearch && e.key !== "Escape") return;
            if (e.key === "Escape") {
                e.preventDefault();
                if (inSearch) e.target.blur(); else closeBrowse();
            } else if (inSearch) {
                if (e.key === "Enter") { e.preventDefault(); e.target.blur(); }
            } else if (e.key === "ArrowLeft") {
                e.preventDefault();
                stepBrowse(-1);
            } else if (e.key === "ArrowRight") {
                e.preventDefault();
                stepBrowse(1);
            }
        });

        // ═══════════════════════════════════════════════
        // SONGS — lyrics view: the whole song in a vertical column, lines
        // known shown as text, the active line (hint + blanks) centred,
        // the others as greyed blanks. Same typing / rating engine.
        // ═══════════════════════════════════════════════
        var LS_LYRICS = "ankitrain_v1_lyrics"; // {hint: trad|context|initials, intro: strophe|lines|all}
        function lyricsOpts() {
            var o = {};
            try { o = JSON.parse(localStorage.getItem(LS_LYRICS) || "{}") || {}; } catch (e) { }
            return { hint: o.hint || "trad", intro: o.intro || "strophe" };
        }
        function setLyricsOpt(k, v) {
            var o = lyricsOpts(); o[k] = v;
            try { localStorage.setItem(LS_LYRICS, JSON.stringify(o)); } catch (e) { }
        }
        function toggleLyricsMenu(e) {
            if (e) e.stopPropagation();
            var m = document.getElementById("ly-menu"), o = lyricsOpts();
            m.querySelector('[name="hint"]').value = o.hint;
            m.querySelector('[name="intro"]').value = o.intro;
            m.hidden = !m.hidden;
        }
        function onLyricsHintChange(v) {
            setLyricsOpt("hint", v);
            if (sess.lyrics && sess.queue[sess.qIdx] && !advancing) showCard();
        }
        document.addEventListener("click", function (e) {
            var m = document.getElementById("ly-menu");
            if (m && !m.hidden && !m.contains(e.target) && e.target.id !== "s-lyrics-opts") m.hidden = true;
        });

        // Session queue for songs, in song order: per song, the lines due
        // and the new lines picked by the "intro" option (one verse / next
        // 5 lines / all), within the daily new-card limit.
        function buildLyricsQueue(decks, cardsByDeck, srs, newLimit) {
            var opts = lyricsOpts(), info = { songs: {}, cardSong: {} }, queue = [];
            decks.forEach(function (d) {
                var cards = {};
                (cardsByDeck[d.id] || []).forEach(function (c) { cards[c.id] = c; });
                info.songs[d.id] = { name: d.name.split("::").pop(), strophes: d.lyrics.strophes };
                var order = [], firstStrophe = {};
                d.lyrics.strophes.forEach(function (st, si) {
                    st.lines.forEach(function (l) {
                        if (!(l.id in firstStrophe)) { firstStrophe[l.id] = si; order.push(l.id); }
                    });
                });
                order.forEach(function (id) { info.cardSong[id] = d.id; });
                var isNew = function (id) { var x = srs[id]; return !x || x.state === "new"; };
                var isDue = function (id) {
                    var x = srs[id];
                    return !!x && x.state !== "new" && (x.state === "learning" || x.state === "relearning" || x.due <= TODAY);
                };
                var newIds = order.filter(isNew);
                if (opts.intro === "strophe" && newIds.length) {
                    var first = firstStrophe[newIds[0]];
                    newIds = newIds.filter(function (id) { return firstStrophe[id] === first; });
                } else if (opts.intro === "lines") newIds = newIds.slice(0, 5);
                newIds = newIds.slice(0, Math.max(0, newLimit));
                newLimit -= newIds.length;
                order.forEach(function (id) {
                    if (cards[id] && (isDue(id) || newIds.indexOf(id) !== -1)) queue.push(cards[id]);
                });
            });
            return { queue: queue, info: info };
        }

        function lyricBlanks(text) {
            return text.split(/\s+/).filter(Boolean).map(function (w) {
                return '<span class="ly-blank" style="width:' + (Math.max(2, w.length) * 0.55).toFixed(2) + 'em"></span>';
            }).join(" ");
        }

        function showLyricLine(card, flip) {
            var info = sess.lyrics, songId = info.cardSong[card.id], song = info.songs[songId];
            var content = document.getElementById("s-content");
            var prev = content.querySelector(".ly-view");
            var sameSong = !!prev && prev.dataset.song === songId;
            // Where the line just done sits on screen, to keep it there after
            // the redraw (then slide to the next one).
            var prevActive = prev && prev.querySelector(".ly-active");
            var prevPos = prevActive ? prevActive.dataset.pos : null;
            var prevOffset = prevActive ? prevActive.getBoundingClientRect().top - prev.getBoundingClientRect().top : 0;
            var pos = 0;
            var pending = {};
            for (var i = sess.qIdx + 1; i < sess.queue.length; i++) pending[sess.queue[i].id] = true;
            var opts = lyricsOpts(), activeShown = false;

            var html = '<div class="ly-view" data-song="' + esc(songId) + '"><div class="ly-title">' + esc(song.name) + '</div>';
            song.strophes.forEach(function (st) {
                html += '<div class="ly-strophe">' + (st.label ? '<div class="ly-label">' + esc(st.label) + '</div>' : '');
                st.lines.forEach(function (l) {
                    var x = sess.srs[l.id], p = ' data-pos="' + (pos++) + '"';
                    if (!activeShown && l.id === card.id) {
                        activeShown = true;
                        html += '<div class="ly-line ly-active"' + p + '>'
                            + (opts.hint === "trad" && card.question ? '<div class="ly-hint">' + card.question + '</div>' : '')
                            + (flip
                                ? '<div class="s-verso-body ly-flip" id="s-verso-body"></div>'
                                : '<div class="t-words ly-words" id="t-words"></div><div class="s-verso-extra" id="s-verso-extra"></div>')
                            + '</div>';
                    } else if (l.id !== card.id && (sess.lyricsSeen[l.id] || (x && x.state !== "new" && !pending[l.id]))) {
                        // known, or already answered this session (shown until its next turn)
                        html += '<div class="ly-line ly-known"' + p + '>' + esc(l.text) + '</div>';
                    } else {
                        var cls = (pending[l.id] || l.id === card.id) ? "ly-pending" : "ly-locked";
                        html += '<div class="ly-line ' + cls + '"' + p + '>' + lyricBlanks(l.text) + '</div>';
                    }
                });
                html += '</div>';
            });
            html += '</div>';
            content.innerHTML = html;

            var view = content.querySelector(".ly-view");
            var act0 = view.querySelector(".ly-active");
            var anchor = sameSong && prevPos != null && view.querySelector('[data-pos="' + prevPos + '"]');
            if (anchor) {
                // Previous line back where it was: no jump from the redraw.
                view.scrollTop += (anchor.getBoundingClientRect().top - view.getBoundingClientRect().top) - prevOffset;
                if (act0) act0.classList.add("ly-enter");
            }
            setBarState("question");
            if (!flip) {
                buildRows(card.words);
                if (opts.hint === "initials") wordRows.forEach(function (e) { e.inp.placeholder = e.word.charAt(0) + "…"; });
            }
            updateCompact();
            var act = view.querySelector(".ly-active");
            if (!act) return;
            var target = view.scrollTop + (act.getBoundingClientRect().top - view.getBoundingClientRect().top)
                - (view.clientHeight - act.offsetHeight) / 2;
            if (anchor) slideScroll(view, target, 480); else view.scrollTop = target;
        }

        // Eased scroll of the lyrics view (a slide, like a lyrics player).
        function slideScroll(el, target, ms) {
            var from = el.scrollTop, delta = target - from, t0 = null;
            target = Math.max(0, Math.min(target, el.scrollHeight - el.clientHeight));
            delta = target - from;
            if (Math.abs(delta) < 1) return;
            var token = el._slide = {};
            function step(ts) {
                if (el._slide !== token) return; // a newer slide took over
                if (t0 === null) t0 = ts;
                var k = Math.min(1, (ts - t0) / ms);
                var e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; // easeInOutQuad
                el.scrollTop = from + delta * e;
                if (k < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        }

        // ═══════════════════════════════════════════════
        // CARD DISPLAY
        // ═══════════════════════════════════════════════
        function showCard() {
            advancing = false; cardErrors = 0; wordRows = []; revealed = false; pendingNext = null;
            var card = sess.queue[sess.qIdx];
            if (!card) { showDone(); return; }
            updateProgress();
            updateCounts();

            var flip = studyMode() === "flip";
            flipShown = false;
            updateModeToggle();
            if (!flip && (!card.words || !card.words.length)) { sess.qIdx++; showCard(); return; }
            if (sess.lyrics) { showLyricLine(card, flip); return; }

            var hasAudio = (card.audioQuestion && card.audioQuestion.length) || card.lang;
            // One card: recto, a "verso" line, then the blanks to type
            // (type-in mode) or the hidden back (normal mode). The actions
            // (hint / answer, then ratings) live in the bottom bar.
            document.getElementById("s-content").innerHTML =
                '<div class="s-question">'
                + '<div class="s-zone s-zone-recto"><div class="s-zone-in"><div class="s-card-body"></div>'
                + (hasAudio ? '<button class="s-audio-btn" onclick="playCardAudio(\'q\')">🔊 Écouter</button>' : '')
                + '</div></div>'
                + '<div class="b-sep">verso</div>'
                + '<div class="s-zone s-zone-verso"><div class="s-zone-in">'
                + (flip
                    ? '<div class="s-verso-body" id="s-verso-body"></div>'
                    : '<div class="t-words" id="t-words"></div><div class="s-verso-extra" id="s-verso-extra"></div>')
                + '</div></div>'
                + '</div>';
            mountCardHtml(document.querySelector("#s-content .s-card-body"), displayQuestion(card.question), cardStyle(sess.sourceId, card));

            setBarState("question");
            if (!flip) buildRows(card.words);
            updateCompact();
            updateFlagIndicator();
            if (hasAudio) playCardAudio("q");
        }

        // Anki-style answer buttons (Anki's order), shown as pills in the
        // bottom bar once the answer is out. The interval preview sits next
        // to each label. A click/tap passes viaButton=true.
        function ratingButtonsHtml(previews) {
            var flip = studyMode() === "flip";
            var defs = [
                [1, "again", "À revoir", flip ? "1" : "F2"],
                [2, "hard", "Difficile", flip ? "2" : "F4"],
                [3, "good", "Correct", flip ? "3" : "F3"],
                [4, "easy", "Facile", flip ? "4" : "F7"],
            ];
            return '<div class="t-ratings">' + defs.map(function (d) {
                return '<button class="t-rate t-rate-' + d[1] + '" data-q="' + d[0] + '" onclick="rate(' + d[0] + ', true)">'
                    + '<span class="t-rate-label">' + d[2] + '</span>'
                    + '<span class="t-rate-time">' + previews[d[0]] + '</span>'
                    + '<span class="t-key">' + d[3] + '</span>'
                    + '</button>';
            }).join('') + '</div>';
        }

        // Bottom bar: "question" (hint + full answer, or "show answer" in
        // normal mode) → "rating" (the 4 rating pills) → "next" (rich back
        // on screen after an automatic rating) — or "" (empty).
        var barState = "";
        function setBarState(state) {
            barState = state;
            var bottom = document.querySelector("#study .s-bottom");
            if (bottom) bottom.dataset.state = state;
            var el = document.getElementById("s-actions");
            if (!el) return;
            var card = sess.queue[sess.qIdx];
            var html = "";
            if (state === "question") {
                html = studyMode() === "flip"
                    ? '<button class="s-pill" onclick="flipCard()">Afficher la réponse <span class="t-key">Espace</span></button>'
                    : '<button class="s-pill s-pill-hint" onpointerdown="event.preventDefault()" onmousedown="event.preventDefault()" onclick="hintFromPill()">💡 Indice <span class="t-key">F1</span></button>'
                    + '<button class="s-pill" onclick="showFullAnswer()">Voir la réponse <span class="t-key">F8</span></button>';
            } else if (state === "rating" && card) {
                html = ratingButtonsHtml(previewIntervals(sess.srs[card.id]));
            } else if (state === "next") {
                html = '<button class="s-pill" onclick="continueAfterAnswer()">Suivant → <span class="t-key">Entrée</span></button>';
            }
            el.innerHTML = html;
            scheduleCompactCheck();
        }

        // Card border + tint in the rating's color.
        function highlightCard(q) {
            var el = document.querySelector("#s-content .s-question, #s-content .ly-active");
            if (!el) return;
            el.classList.remove("rated-again", "rated-hard", "rated-good", "rated-easy");
            el.classList.add("rated-" + { 1: "again", 2: "hard", 3: "good", 4: "easy" }[q]);
        }

        // Plain-color fade-in/fade-out flash on the button that matches the
        // rating actually applied, instead of a separate popup.
        function flashRateButton(q) {
            var btn = document.querySelector('.t-rate[data-q="' + q + '"]');
            if (!btn) return;
            btn.classList.remove("rate-flash");
            void btn.offsetWidth; // restart the animation if it's still running
            btn.classList.add("rate-flash");
        }

        function rate(q, viaButton) {
            if (advancing) return;
            if (studyMode() === "flip") {
                if (!flipShown) return;
                advancing = true;
                flashForPendingRating(q, viaButton);
                document.getElementById("audio-player").pause();
                setTimeout(function () { advanceCard(q); }, 150);
                return;
            }
            advancing = true;
            keepKeyboard();
            flashForPendingRating(q, viaButton);
            playCardAudio("both", function () { advanceCard(q); });
        }

        // Highlight the button the instant the decision is made (press, or
        // completing the card), not after any audio has finished playing —
        // that's a separate, later step (the card-change transition).
        // Clicked/tapped → only that button lights up; automatic or
        // keyboard rating → the card itself takes the rating's color.
        function flashForPendingRating(q, viaButton) {
            if (!sess.queue[sess.qIdx]) return;
            // Always the rating actually chosen (Facile used to be shown as
            // Correct for a card's first easy answers — #28).
            // Keyboard (incl. Space = Correct in normal mode): the card and,
            // if the rating pills are showing, the matching pill (#29).
            if (viaButton) flashRateButton(q); else { highlightCard(q); flashRateButton(q); }
        }

        // What each rating would do to THIS card right now — shown above the
        // shortcuts, same idea as the time labels above Anki's own answer
        // buttons ("<10m", "1j", "2j"...). Doesn't mutate any real state.
        function formatInterval(days) {
            if (days < 1) return "<1j";
            if (days < 30) return days + "j";
            if (days < 365) return Math.round(days / 30) + "mo";
            return (days / 365).toFixed(1) + "a";
        }
        function formatRequeue(minutes) {
            if (minutes < 60) return "<" + minutes + "m";
            return "<" + Math.round(minutes / 60) + "h";
        }
        function previewIntervals(srs) {
            var base = srs || defaultSRS();
            var out = {};
            [1, 2, 3, 4].forEach(function (q) {
                var ctx = { requeueIn: null };
                var s = applyRating(base, q, ctx);
                out[q] = ctx.requeueIn ? formatRequeue(ctx.requeueIn) : formatInterval(s.interval);
            });
            return out;
        }

        // ═══════════════════════════════════════════════
        // AUDIO
        // ═══════════════════════════════════════════════
        // onDone fires once the whole list has played (or immediately if
        // there's nothing to play, or if playback is blocked/fails) so
        // callers can wait for it before switching to the next card —
        // otherwise the next card's question audio cuts this one off.
        function playAudioList(urls, onDone) {
            var audio = document.getElementById("audio-player");
            if (!urls || !urls.length) { if (onDone) onDone(); return; }
            var i = 0;
            function playNext() {
                if (i >= urls.length) { audio.onended = null; if (onDone) onDone(); return; }
                audio.src = urls[i++];
                var p = audio.play();
                if (p && p.catch) p.catch(playNext);
            }
            audio.onended = playNext;
            playNext();
        }
        function plainText(html) {
            return String(html || "").replace(/<style[\s\S]*?<\/style>/gi, "").replace(/<[^>]*>/g, "").trim();
        }
        // Browser text-to-speech fallback for cards with no recorded audio
        // but a known language — currently words added via cuatroloop/
        // tresloop, which have no real pronunciation clip to fall back on.
        function speakText(text, lang, onDone) {
            if (!text || !window.speechSynthesis) { if (onDone) onDone(); return; }
            window.speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(text);
            u.lang = lang === "fr" ? "fr-FR" : "es-ES";
            if (onDone) { u.onend = onDone; u.onerror = onDone; }
            window.speechSynthesis.speak(u);
        }
        function playCardAudio(which, onDone) {
            var card = sess.queue[sess.qIdx];
            if (!card) { if (onDone) onDone(); return; }
            var urls = which === "both"
                ? (card.audioQuestion || []).concat(card.audioAnswer || [])
                : (which === "a" ? card.audioAnswer : card.audioQuestion);
            if (urls && urls.length) { playAudioList(urls, onDone); return; }
            if (!card.lang) { if (onDone) onDone(); return; }
            var otherLang = card.lang === "es" ? "fr" : "es";
            if (which === "both") {
                speakText(plainText(card.question), card.lang, function () {
                    speakText((card.words || []).join(" "), otherLang, onDone);
                });
            } else if (which === "a") {
                speakText((card.words || []).join(" "), otherLang, onDone);
            } else {
                speakText(plainText(card.question), card.lang, onDone);
            }
        }

        function updateProgress() {
            var total = sess.queue.length;
            var done = Math.min(sess.qIdx, total);
            document.getElementById("prog-label").textContent = done + " / " + total;
            document.getElementById("prog-fill").style.width = Math.round(done / total * 100) + "%";
        }

        // Cards left in the queue (from the current position on), grouped by
        // scheduler state — new (blue) / learning+relearning (red) / review (green).
        function updateCounts() {
            var counts = { new: 0, learning: 0, review: 0 };
            for (var i = sess.qIdx; i < sess.queue.length; i++) {
                var s = sess.srs[sess.queue[i].id];
                var state = s ? s.state : "new";
                if (state === "new") counts.new++;
                else if (state === "learning" || state === "relearning") counts.learning++;
                else counts.review++;
            }
            document.getElementById("cnt-new").textContent = counts.new;
            document.getElementById("cnt-learn").textContent = counts.learning;
            document.getElementById("cnt-review").textContent = counts.review;
        }

        // ═══════════════════════════════════════════════
        // WORD ROWS
        // ═══════════════════════════════════════════════
        function buildRows(words) {
            advancing = false;
            var section = document.getElementById("t-words"); if (!section) return;
            section.innerHTML = ""; wordRows = [];

            words.forEach(function (word, i) {
                var col = document.createElement("div"); col.className = "word-col";
                var box = document.createElement("div"); box.className = "wc-box";
                var inp = document.createElement("input"); inp.className = "wc-inp";
                inp.type = "text"; inp.placeholder = "···";
                inp.autocomplete = "off"; inp.autocorrect = "off"; inp.spellcheck = false;
                inp.style.width = Math.max(word.length * 14, 48) + "px";
                box.append(inp);
                var hint = document.createElement("div"); hint.className = "wc-hint";
                var attempts = document.createElement("div"); attempts.className = "wc-attempts";
                col.append(box, hint, attempts);
                section.appendChild(col);

                var entry = { word: word, expected: [word], inp: inp, box: box, hint: hint, attempts: attempts, solved: false, revealed: false, errors: 0, _errTimer: null };
                wordRows.push(entry);
                inp.addEventListener("input", makeCheck(entry, i));
                inp.addEventListener("keydown", makeKey(i));
            });

            document.getElementById("kb-keeper").value = "";
            if (wordRows.length) wordRows[0].inp.focus({ preventScroll: true });
            setTimeout(function () { if (wordRows.length && document.activeElement !== wordRows[0].inp) wordRows[0].inp.focus({ preventScroll: true }); }, 60);
        }

        function makeCheck(entry, i) { return function () { liveCheck(entry, i); }; }
        function makeKey(i) {
            return function (e) { if (e.key === "Enter") { e.preventDefault(); focusNext(i); } };
        }

        function norm(s) {
            return s.toLowerCase().trim()
                .replace(/^[¿¡!.,;:'"«»()\[\]\-–—]+|[¿¡!.,;:'"«»()\[\]\-–—]+$/g, "").trim();
        }
        function noAcc(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, ""); }
        function isMatch(input, expected) { var ni = norm(input), ne = norm(expected); return ni === ne || noAcc(ni) === noAcc(ne); }
        function check(entry) {
            if (!entry.inp.value.trim()) return null;
            return entry.expected.some(function (t) { return isMatch(entry.inp.value, t); });
        }

        function liveCheck(entry, i) {
            if (/^\s/.test(entry.inp.value)) entry.inp.value = entry.inp.value.replace(/^\s+/, ""); // space typed between words
            // Typed past the word (fast typing: "estoy cansado" in one go):
            // keep the word here and carry the rest into the next blank.
            var m = entry.inp.value.match(/^\s*(\S+)\s+(\S.*)$/);
            if (m && entry.expected.some(function (t) { return isMatch(m[1], t); })) {
                entry.inp.value = m[1];
                var next = wordRows.find(function (e, j) { return j > i && !e.solved && !e.given; });
                if (next) {
                    next.inp.value = m[2] + next.inp.value;
                    markSolved(entry);
                    next.inp.focus();
                    liveCheck(next, wordRows.indexOf(next));
                    return;
                }
            }
            if (entry.given) return;
            var r = check(entry);
            if (r === null) {
                clearTimeout(entry._errTimer);
                entry.inp.className = "wc-inp";
                if (!entry.inp.value.trim()) {
                    entry.solved = false;
                    entry.box.classList.remove("solved");
                    // Wiped a typed attempt to start over: that's a miss too
                    // (unless its ✗ was already counted) — #20.
                    if (entry._typed && !entry._counted) addError(entry, i);
                    entry._typed = entry._counted = false;
                }
                return;
            }
            entry._typed = true;
            if (r) {
                markSolved(entry);
                // Move on right away (was 220 ms: fast typing then spilled
                // into this blank and turned it wrong — issue #3).
                focusNext(i);
            } else {
                entry.inp.className = "wc-inp err";
                entry.solved = false;
                entry.box.classList.remove("solved");
                clearTimeout(entry._errTimer);
                entry._errTimer = setTimeout(function () {
                    if (!entry.inp.isConnected || entry.solved || entry.given) return;
                    entry._counted = true;
                    addError(entry, i);
                }, 1500);
            }
        }

        function markSolved(entry) {
            clearTimeout(entry._errTimer);
            entry.inp.className = "wc-inp ok";
            entry.box.classList.add("solved");
            entry.solved = true;
        }

        function addError(entry, i) {
            entry.errors++;
            cardErrors = Math.max(cardErrors, entry.errors);
            entry.attempts.textContent = "✗".repeat(Math.min(entry.errors, 5));
            if (entry.errors >= 3) giveAnswer(entry, i);
        }

        // 3 misses: the right word replaces what was typed (in red), the
        // card will be rated À revoir, and F1 moves on — #21 (and #2: the
        // auto-hint used to not count as help, so the card got Correct).
        function giveAnswer(entry, i) {
            clearTimeout(entry._errTimer);
            entry.inp.value = entry.word;
            entry.inp.readOnly = true;
            entry.inp.className = "wc-inp given";
            entry.box.classList.add("solved");
            entry.given = entry.revealed = true;
            revealed = true;
            var next = wordRows.find(function (e, j) { return j > i && !e.solved && !e.given; })
                || wordRows.find(function (e) { return !e.solved && !e.given; });
            if (next) next.inp.focus();
            if (!wordRows.some(function (e) { return !e.solved && !e.revealed; })) setBarState("rating");
        }

        function focusNext(i) {
            var open = function (e) { return !e.solved && !e.given; };
            for (var j = i + 1; j < wordRows.length; j++) { if (open(wordRows[j])) { wordRows[j].inp.focus(); return; } }
            for (var j = 0; j < i && j < wordRows.length; j++) { if (open(wordRows[j])) { wordRows[j].inp.focus(); return; } }
            tryComplete();
        }

        function revealHint(entry) {
            entry.hint.textContent = entry.expected[0];
            entry.hint.style.display = "block";
            entry.revealed = true;
        }
        // "💡 Indice": reveals only the word at the cursor (or the first
        // not-yet-shown one if nothing has focus). Once every missing word
        // is shown, the bottom bar switches to the rating pills; typing the
        // words or pressing F1 once more still rates (À revoir) and moves on.
        function revealCurrent() {
            if (advancing) return;
            var entry = wordRows.find(function (e) { return e.inp === document.activeElement && !e.solved && !e.revealed; })
                || wordRows.find(function (e) { return !e.solved && !e.revealed; });
            // Nothing left to reveal: one more F1 = rate (À revoir, since
            // hints were used) and move on.
            if (!entry) { completeCard(); return null; }
            revealed = true;
            showHintFor(entry);
            // Every missing word now shown → time to rate it yourself.
            if (!wordRows.some(function (e) { return !e.solved && !e.revealed; })) {
                setBarState("rating");
                playCardAudio("a"); // like Anki: audio plays as soon as the answer appears
            }
            return entry;
        }
        // Tapping "💡 Indice": the pill doesn't take the focus (so the phone
        // keyboard stays up), and the cursor goes to the hinted word — done
        // inside the tap, so iOS reopens the keyboard if it was down.
        function hintFromPill() {
            var entry = revealCurrent();
            if (entry && !advancing && entry.inp.isConnected) entry.inp.focus();
        }
        function showHintFor(entry) {
            revealHint(entry);
        }

        // "Voir la réponse": the whole answer at once, then rating pills.
        function showFullAnswer() {
            if (advancing || barState === "rating") return;
            if (studyMode() === "flip") { flipCard(); return; }
            var card = sess.queue[sess.qIdx];
            if (!card) return;
            wordRows.forEach(function (e) { if (!e.solved && !e.revealed) { revealed = true; showHintFor(e); } });
            if (hasRichAnswer(card)) {
                var extra = document.getElementById("s-verso-extra");
                extra.innerHTML = '<div class="s-verso-body"></div>';
                mountCardHtml(extra.querySelector(".s-verso-body"), card.answer, cardStyle(sess.sourceId, card));
            }
            if (document.activeElement) document.activeElement.blur();
            setBarState("rating");
            playCardAudio("a");
        }

        // Difficile/Facile are only ever a manual, deliberate call (the
        // rating buttons/F4/F7) — never inferred from mistakes. Automatic
        // completion only ever lands on one of two outcomes: needed a hint
        // at any point this card -> À revoir, got there entirely on your
        // own -> Correct. The attempt counters (✗) are still shown per
        // word as feedback, they just no longer drive the rating.
        function completeCard() {
            if (advancing) return;
            advancing = true;
            var q = revealed ? 1 : 3;
            flashForPendingRating(q);
            var card = sess.queue[sess.qIdx];
            keepKeyboard();
            if (!hasRichAnswer(card)) {
                playCardAudio("a", function () { flash(function () { advanceCard(q); }); });
                return;
            }
            // Rich back (meaning, example sentence, image…): show it under
            // the blanks, in the card, and wait for Entrée / « Suivant → ».
            var extra = document.getElementById("s-verso-extra");
            extra.innerHTML = '<div class="s-verso-body"></div>';
            mountCardHtml(extra.querySelector(".s-verso-body"), card.answer, cardStyle(sess.sourceId, card));
            setBarState("next");
            pendingNext = function () { flash(function () { advanceCard(q); }); };
            playCardAudio("a");
        }

        // ── Normal (Anki-style) mode: show the back, then rate it ──
        var flipShown = false;
        function studyMode() {
            try { return localStorage.getItem(LS_MODE) === "flip" ? "flip" : "type"; } catch (e) { return "type"; }
        }
        function updateModeToggle() {
            var b = document.getElementById("s-mode-toggle");
            if (b) b.textContent = studyMode() === "flip" ? "🃏 Mode normal" : "⌨️ Saisie";
        }
        function toggleStudyMode() {
            try { localStorage.setItem(LS_MODE, studyMode() === "flip" ? "type" : "flip"); } catch (e) { }
            if (document.activeElement) document.activeElement.blur(); // so Space doesn't re-press the toggle
            document.getElementById("audio-player").pause();
            if (sess.queue[sess.qIdx] && !advancing) showCard(); else updateModeToggle();
        }
        function flipCard() {
            if (flipShown || advancing) return;
            var card = sess.queue[sess.qIdx];
            if (!card) return;
            flipShown = true;
            var back = card.answer != null ? card.answer : esc((card.words || []).join(" "));
            mountCardHtml(document.getElementById("s-verso-body"), back, cardStyle(sess.sourceId, card));
            setBarState("rating");
            playCardAudio("a");
        }

        var pendingNext = null;
        function continueAfterAnswer() {
            if (!pendingNext) return;
            var go = pendingNext; pendingNext = null;
            keepKeyboard();
            document.getElementById("audio-player").pause();
            go();
        }

        // Phone layout: keep the study screen sized to what the keyboard
        // leaves visible, and hide the bottom bar while the keyboard is up.
        function updateVisualViewport() {
            var vv = window.visualViewport;
            var h = vv ? vv.height : window.innerHeight;
            var root = document.documentElement.style;
            root.setProperty("--vvh", h + "px");
            root.setProperty("--vvtop", (vv ? vv.offsetTop : 0) + "px");
            document.body.classList.toggle("kb-open", !!vv && vv.height < window.innerHeight * 0.75);
            updateCompact();
        }
        // Compact layout when the screen is narrow, or when the card (as laid
        // out normally) would run under the bottom bar. Measured with the
        // class off, then decided — same task, so nothing flickers.
        function updateCompact() {
            var body = document.body;
            if (document.getElementById("study").style.display !== "flex") { body.classList.remove("compact"); return; }
            var compact = window.innerWidth <= 600;
            if (!compact) {
                body.classList.remove("compact");
                document.documentElement.style.removeProperty("--card-img-max");
                var q = document.querySelector("#s-content .s-question");
                var bar = document.querySelector("#study .s-bottom");
                if (q && bar) compact = q.getBoundingClientRect().bottom > bar.getBoundingClientRect().top - 8;
            }
            body.classList.toggle("compact", compact);
            updateZoneHeight();
        }
        var compactCheckPending = false;
        function scheduleCompactCheck() {
            if (compactCheckPending) return;
            compactCheckPending = true;
            requestAnimationFrame(function () { compactCheckPending = false; updateCompact(); });
        }
        // Height of the recto half of the compact card → max size of card images.
        function updateZoneHeight() {
            var root = document.documentElement.style;
            var z = document.querySelector("#s-content .s-zone-recto");
            if (document.body.classList.contains("compact") && z && z.clientHeight)
                root.setProperty("--card-img-max", Math.max(60, z.clientHeight - 24) + "px");
            else root.removeProperty("--card-img-max");
        }
        if (window.visualViewport) {
            window.visualViewport.addEventListener("resize", updateVisualViewport);
            window.visualViewport.addEventListener("scroll", updateVisualViewport);
        }
        window.addEventListener("resize", updateVisualViewport);
        updateVisualViewport();

        // Phones (iOS especially) only open the keyboard when focus happens
        // during a tap, and the next card's blanks appear later (after the
        // rating pause). So, in type-in mode, focus moves to an invisible
        // field at the moment of the tap / of finishing a card; the keyboard
        // stays up, and buildRows() then hands focus to the first blank.
        function keepKeyboard() {
            if (studyMode() === "flip") return;
            var k = document.getElementById("kb-keeper");
            try { k.focus({ preventScroll: true }); } catch (e) { k.focus(); }
        }

        function tryComplete() {
            if (advancing) return;
            if (wordRows.every(function (e) { return e.solved || e.given; })) completeCard();
        }

        // ═══════════════════════════════════════════════
        // KEYBOARD SHORTCUTS (study screen only)
        // ═══════════════════════════════════════════════
        // F1 = indice (mot au curseur) · F8 = toute la réponse · F2 = À revoir · F3 = Correct
        // · F4 = Difficile · F7 = Facile (not F5/F6: F5 reloads the page in
        // most browsers and preventDefault() can't reliably stop that; F6
        // is already the flag shortcut) — "Facile" is deliberately the
        // farthest from F1 since it schedules the longest interval, so a
        // stray key-repeat or mis-click right after reveal can't trigger it.
        var FKEY_RATING = { F2: 1, F3: 3, F4: 2, F7: 4 };
        document.addEventListener("keydown", function (e) {
            if (document.getElementById("study").style.display !== "flex") return;
            if (pendingNext && e.key === "Enter") {
                e.preventDefault();
                continueAfterAnswer();
            } else if (studyMode() === "flip" && !e.metaKey && !e.ctrlKey && (e.key === " " || e.key === "Enter" || e.key === "F1")) {
                // Like Anki: Space/Entrée shows the answer, then counts as "Correct".
                e.preventDefault();
                if (!flipShown) flipCard(); else rate(3);
            } else if (studyMode() === "flip" && "1234".indexOf(e.key) !== -1 && e.key.length === 1 && !e.metaKey && !e.ctrlKey) {
                e.preventDefault();
                rate({ "1": 1, "2": 2, "3": 3, "4": 4 }[e.key]);
            } else if (e.key === "F1") {
                e.preventDefault();
                revealCurrent();
            } else if (e.key === "F8") {
                e.preventDefault();
                showFullAnswer();
            } else if (e.key === "F6") {
                e.preventDefault();
                toggleFlagCurrent();
            } else if (FKEY_RATING.hasOwnProperty(e.key)) {
                e.preventDefault();
                rate(FKEY_RATING[e.key]);
            }
        });

        function advanceCard(q) {
            var card = sess.queue[sess.qIdx];
            var wasNew = !sess.srs[card.id] || sess.srs[card.id].state === "new";
            var ctx = { requeueIn: null };
            sess.srs[card.id] = applyRating(sess.srs[card.id] || defaultSRS(), q, ctx);
            sess.srs[card.id].lastReview = Date.now(); // for cross-device merge on sign-in
            if (wasNew) recordNewIntroduced(sess.sourceId);
            sess.done++;
            sess.qIdx++;
            if (sess.lyrics) sess.lyricsSeen[card.id] = true;
            if (ctx.requeueIn && sess.lyrics) {
                // Songs: back for another pass, at the end, so the lyrics
                // keep being gone through top to bottom.
                sess.queue.push(card);
            } else if (ctx.requeueIn) {
                // Not a fixed distance — Anki itself doesn't resurface a
                // learning-step card at an exact position either, it's
                // interleaved with whatever else is due around that time.
                var jitter = 0.6 + Math.random() * 1.0; // 0.6x .. 1.6x
                var offset = Math.max(2, Math.round(ctx.requeueIn * jitter));
                var insertAt = Math.min(sess.queue.length, sess.qIdx + offset);
                sess.queue.splice(insertAt, 0, card);
            }
            updateCounts();
            // Songs: only the line changes (no fade), after a short pause so
            // the rating colour on the line is seen.
            if (sess.lyrics) { setTimeout(showCard, 350); return; }
            var content = document.getElementById("s-content");
            content.style.cssText = "opacity:0;transform:translateY(-10px);transition:opacity .4s,transform .4s";
            setTimeout(function () {
                content.style.cssText = "opacity:0;transform:translateY(10px);transition:none";
                content.offsetHeight;
                content.style.cssText = "opacity:1;transform:translateY(0);transition:opacity .4s,transform .4s";
                showCard();
            }, 400);
        }

        // Short pause so the rating color is seen before the card changes.
        function flash(cb) {
            setTimeout(cb, 400);
        }

        function showDone() {
            setBarState("");
            saveSRS(sess.sourceId, sess.srs);
            document.getElementById("s-content").innerHTML =
                '<div class="s-done">'
                + '<div class="s-done-icon">🎉</div>'
                + '<div class="s-done-title">Session terminée !</div>'
                + '<div class="s-done-sub">' + sess.done + ' cartes révisées aujourd\'hui</div>'
                + '<button class="btn-home" onclick="goHome()">← Retour</button>'
                + '</div>';
            document.getElementById("prog-fill").style.width = "100%";
            document.getElementById("prog-label").textContent = sess.done + " / " + sess.done;
        }

        // ═══════════════════════════════════════════════
        // UTILS
        // ═══════════════════════════════════════════════
        function esc(s) { return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/'/g, "&#39;"); }
        function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

        var _toastTimer;
        function toast(msg) {
            var el = document.getElementById("toast");
            el.textContent = msg; el.classList.add("show");
            clearTimeout(_toastTimer);
            _toastTimer = setTimeout(function () { el.classList.remove("show"); }, 3500);
        }

        // ── INIT ──
        updateThemeToggleIcon();
        loadDefaultDeckIfEmpty().then(loadExtraBundledDecks).then(renderHome);
    </script>
</body>

</html>
