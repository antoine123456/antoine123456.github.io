<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anki Trainer</title>
    <!-- Compat SDK (not the modular one) so it plugs into the existing
         ES5-style script block below with no bundler/build step. -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --navy: #1e3a5f;
            --green: #16a34a;
            --red: #dc2626;
            --orange: #ea580c;
            --blue: #2563eb;
            --gold: #c8a84b;

            --bg: #fff;
            --surface: #fff;
            --surface-hover: #f8faff;
            --text: #111;
            --text-2: #999;
            --text-3: #ccc;
            --border: #f0f0f0;
            --border-2: #e5e7eb;
            --input-line: #d0ccc5;

            --tint-blue: #eff6ff;
            --tint-green: #f0fdf4;
            --tint-orange: #fff7ed;
            --tint-red: #fef2f2;
            --border-tint-blue: #cfe0fb;
            --border-tint-green: #cdebd8;
            --border-tint-orange: #fde3c8;
            --border-tint-red: #fde2e2;

            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --navy: #85aee0;
                --bg: #131417;
                --surface: #1b1d21;
                --surface-hover: #24272c;
                --text: #e8e9eb;
                --text-2: #8b8f96;
                --text-3: #52565d;
                --border: #26292e;
                --border-2: #34383f;
                --input-line: #4d4842;

                --tint-blue: rgba(37, 99, 235, .18);
                --tint-green: rgba(22, 163, 74, .18);
                --tint-orange: rgba(234, 88, 12, .18);
                --tint-red: rgba(220, 38, 38, .18);
                --border-tint-blue: #2a3c5c;
                --border-tint-green: #1f4430;
                --border-tint-orange: #593c20;
                --border-tint-red: #59292a;

                color-scheme: dark;
            }
        }

        :root[data-theme="dark"] {
            --navy: #85aee0;
            --bg: #131417;
            --surface: #1b1d21;
            --surface-hover: #24272c;
            --text: #e8e9eb;
            --text-2: #8b8f96;
            --text-3: #52565d;
            --border: #26292e;
            --border-2: #34383f;
            --input-line: #4d4842;

            --tint-blue: rgba(37, 99, 235, .18);
            --tint-green: rgba(22, 163, 74, .18);
            --tint-orange: rgba(234, 88, 12, .18);
            --tint-red: rgba(220, 38, 38, .18);
            --border-tint-blue: #2a3c5c;
            --border-tint-green: #1f4430;
            --border-tint-orange: #593c20;
            --border-tint-red: #59292a;

            color-scheme: dark;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── HOME ── */
        #home {
            position: relative;
            max-width: 560px;
            margin: 0 auto;
            padding: 52px 24px 80px;
        }

        .h-theme-toggle {
            position: absolute;
            top: env(safe-area-inset-top, 0px);
            right: 24px;
            margin-top: 16px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1.5px solid var(--border);
            background: var(--surface);
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color .15s, background .15s;
        }

        .h-theme-toggle:hover {
            border-color: var(--navy);
            background: var(--surface-hover);
        }

        .sync-status {
            font-size: 11px;
            color: var(--text-2);
        }

        .sync-status.sync-error { color: var(--red); }
        .sync-status.sync-offline { color: var(--orange); }
        .sync-status.sync-hidden { display: none; }

        .h-logo {
            font-size: 36px;
            margin-bottom: 6px;
        }

        .h-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 4px;
        }

        .h-sub {
            font-size: 13px;
            color: var(--text-2);
            margin-bottom: 36px;
        }

        /* Source list */
        .h-sources {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
        }

        .h-source {
            border: 1.5px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            transition: border-color .15s;
        }

        .h-source:hover {
            border-color: var(--border-tint-blue);
        }

        .h-source-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 16px;
            cursor: pointer;
            user-select: none;
            background: var(--surface);
            transition: background .12s;
        }

        .h-source-header:hover {
            background: var(--surface-hover);
        }

        .h-source-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            flex: 1;
        }

        .h-source-meta {
            font-size: 11px;
            color: var(--text-2);
        }

        .h-source-del {
            padding: 3px 8px;
            font-size: 12px;
            color: var(--text-3);
            background: none;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            transition: color .15s;
            flex-shrink: 0;
        }

        .h-source-export {
            padding: 3px 8px;
            font-size: 12px;
            color: var(--text-3);
            background: none;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            transition: color .15s;
            flex-shrink: 0;
        }

        .h-source-export:hover {
            color: var(--navy);
        }

        .h-source-del:hover {
            color: var(--red);
        }

        .h-source-arrow {
            font-size: 11px;
            color: var(--text-3);
            transition: transform .2s;
            flex-shrink: 0;
        }

        .h-source-arrow.open {
            transform: rotate(90deg);
        }

        /* Deck tree inside a source */
        .h-decktree {
            display: none;
            border-top: 1px solid var(--border);
            padding: 8px 0;
        }

        .h-decktree.open {
            display: block;
        }

        .h-deckrow {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            cursor: pointer;
            transition: background .12s;
        }

        .h-deckrow:hover {
            background: var(--surface-hover);
        }

        .h-deckrow-name {
            font-size: 13px;
            color: var(--text);
            flex: 1;
        }

        .h-deckrow-name.root-deck {
            font-weight: 600;
        }

        .badge {
            padding: 2px 7px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-new {
            background: var(--tint-blue);
            color: var(--blue);
        }

        .badge-due {
            background: var(--tint-orange);
            color: var(--orange);
        }

        .badge-done {
            background: var(--tint-green);
            color: var(--green);
        }

        .h-custom-btn {
            padding: 2px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            border: 1.5px solid var(--border-2);
            background: var(--surface);
            color: var(--text-2);
            cursor: pointer;
            transition: border-color .15s, background .15s;
        }

        .h-custom-btn:hover {
            border-color: var(--navy);
            color: var(--navy);
        }

        .h-empty {
            font-size: 14px;
            color: var(--text-3);
            text-align: center;
            padding: 28px 0;
        }

        .h-import-btn {
            width: 100%;
            padding: 13px;
            border: 1.5px dashed var(--text-3);
            border-radius: 14px;
            background: none;
            font-size: 14px;
            color: var(--text-2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: border-color .15s, color .15s;
        }

        .h-import-btn:hover {
            border-color: var(--navy);
            color: var(--navy);
        }

        .h-reset {
            margin-top: 14px;
            text-align: center;
            font-size: 11px;
            color: var(--text-3);
            cursor: pointer;
            transition: color .15s;
        }

        .h-reset:hover {
            color: var(--red);
        }

        /* ── STUDY ── */
        #study {
            min-height: 100vh;
            display: none;
            flex-direction: column;
        }

        .s-topbar {
            position: relative;
            padding: 16px 24px 0;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .s-back {
            background: none;
            border: none;
            color: var(--text-2);
            cursor: pointer;
            font-size: 13px;
            transition: color .15s;
        }

        .s-back:hover {
            color: var(--navy);
        }

        .s-prog {
            flex: 1;
        }

        .s-prog-label {
            font-size: 11px;
            color: var(--text-3);
            text-align: right;
            margin-bottom: 5px;
        }

        .s-prog-track {
            height: 2px;
            background: var(--border);
            border-radius: 2px;
        }

        .s-prog-fill {
            height: 100%;
            background: var(--gold);
            border-radius: 2px;
            transition: width .6s cubic-bezier(.4, 0, .2, 1);
        }

        .s-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 36px 24px 150px;
        }

        .s-deck-name {
            font-size: 12px;
            color: var(--text-3);
            margin-bottom: 24px;
            letter-spacing: .3px;
        }

        /* Fixed bottom bar: action pills (hint / answer, then ratings)
           above the counters, à la AnkiDroid: new (blue) / learning (red)
           / review (green) */
        .s-bottom {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
            background: var(--surface);
            border-top: 1px solid var(--border);
            z-index: 20;
        }

        .s-actions {
            display: flex;
            justify-content: center;
            gap: 8px;
            max-width: 720px;
            margin: 0 auto 10px;
        }

        .s-actions:empty {
            display: none;
        }

        .s-pill {
            flex: 1 1 0;
            max-width: 260px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 14px;
            border: 1.5px solid var(--border-2);
            border-radius: 999px;
            background: var(--surface);
            color: var(--text-2);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: border-color .15s, background .15s, color .15s;
        }

        .s-pill:hover {
            border-color: var(--navy);
            color: var(--navy);
        }

        .s-pill-hint:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .s-pill .t-key {
            margin-left: 2px;
        }

        .s-counts {
            display: flex;
            justify-content: center;
            gap: 26px;
        }

        .s-count {
            font-size: 14px;
            font-weight: 700;
        }

        .s-count-new { color: var(--blue); }
        .s-count-learn { color: var(--red); }
        .s-count-review { color: var(--green); }

        /* Question */
        .s-question {
            width: 100%;
            max-width: 720px;
            border: 1.5px solid var(--border);
            border-radius: 18px;
            padding: 28px 32px;
            margin-bottom: 32px;
            font-size: clamp(18px, 2.8vw, 26px);
            line-height: 1.6;
            color: var(--text);
            text-align: center;
        }

        .s-question img {
            max-width: 100%;
            max-height: 50vh;
            border-radius: 8px;
            margin: 8px 0;
        }

        .s-question * {
            font-family: inherit;
        }

        .s-audio-btn {
            display: block;
            margin: 10px auto 0;
            background: none;
            border: 1.5px solid var(--border-2);
            border-radius: 20px;
            padding: 5px 14px;
            font-size: 14px;
            color: var(--navy);
            cursor: pointer;
            transition: border-color .15s, background .15s;
        }

        .s-audio-btn:hover {
            border-color: var(--navy);
            background: var(--surface-hover);
        }

        /* Word inputs */
        .t-words {
            display: flex;
            flex-wrap: wrap;
            gap: 18px 28px;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            max-width: 720px;
        }

        .word-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .wc-inp {
            border: none;
            border-bottom: 2.5px solid var(--input-line);
            background: transparent;
            color: var(--text);
            font-family: Georgia, serif;
            font-size: 17px;
            text-align: center;
            outline: none;
            padding: 2px 4px 7px;
            transition: border-color .2s, color .2s;
            min-width: 48px;
        }

        .wc-inp:focus {
            border-bottom-color: #93aed6;
        }

        .wc-inp.ok {
            border-bottom-color: var(--green);
            color: var(--green);
        }

        /* Filled in after 3 misses: red, not green. */
        .wc-inp.given {
            border-bottom-color: var(--red);
            color: var(--red);
        }

        .wc-inp.err {
            border-bottom-color: var(--red);
            color: var(--red);
        }

        .wc-inp::placeholder {
            color: var(--text-3);
        }

        .wc-box {
            position: relative;
            display: inline-block;
        }

        .wc-box .wc-inp {
            display: block;
        }

        /* Hint: the word in small orange under the blank. (A greyed-out
           version inside the blank was tried — git tag indice-fantome.) */
        .wc-hint {
            display: none;
            font-family: Georgia, serif;
            font-size: 13px;
            color: var(--orange);
        }

        .wc-attempts {
            font-size: 11px;
            color: var(--red);
            letter-spacing: 1px;
            min-height: 14px;
        }

        .t-key {
            display: inline-block;
            font-size: 9px;
            font-weight: 700;
            color: var(--text-2);
            border: 1px solid var(--text-3);
            border-radius: 4px;
            padding: 1px 4px;
            margin-left: 4px;
            vertical-align: middle;
        }

        /* Anki-style answer buttons, à la anki_ui_after.png */
        .t-ratings {
            display: flex;
            gap: 8px;
            justify-content: center;
            width: 100%;
        }

        .t-rate {
            flex: 1 1 0;
            max-width: 170px;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px 10px;
            border: 1.5px solid var(--border-2);
            border-radius: 999px;
            background: var(--surface);
            cursor: pointer;
            white-space: nowrap;
            transition: border-color .15s, background .15s, transform .1s;
        }

        .t-rate:hover {
            transform: translateY(-1px);
        }

        .t-rate:active {
            transform: translateY(0);
        }

        .t-rate .t-key {
            margin-left: 0;
        }

        @media (max-width: 520px) {
            .t-rate { flex-direction: column; gap: 1px; padding: 6px 4px; border-radius: 18px; }
            .t-rate .t-key { display: none; }
            .s-pill { font-size: 13px; padding: 10px 8px; }
        }

        /* ── Compact study layout: phones (≤ 600px wide) and any window
           where the card wouldn't fit above the bottom bar (body.compact,
           set by updateCompact()). The study screen is pinned to the
           *visual* viewport (--vvh / --vvtop, set from JS), the card splits
           it into a scrollable recto half, the fixed "verso" line, and a
           scrollable type-in / verso half; with the phone keyboard up the
           bottom bar keeps only the hint / answer pills. ── */
        body.compact #study {
            position: fixed;
            left: 0;
            right: 0;
            top: var(--vvtop, 0px);
            height: var(--vvh, 100vh);
            min-height: 0;
            overflow: hidden;
        }

        body.compact #study .s-topbar { padding: 8px 14px 0; }

        body.compact #study .s-main {
            flex: 1;
            min-height: 0;
            padding: 8px 12px 10px;
        }

        body.compact #s-content {
            flex: 1;
            min-height: 0;
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
        }

        body.compact #s-content .s-question {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            margin: 0;
            padding: 0 16px;
        }

        body.compact .s-zone {
            flex: 1 1 0;
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            -webkit-overflow-scrolling: touch;
        }

        body.compact .s-zone-in {
            margin: auto 0; /* centered when it fits, scrolls when not */
            padding: 10px 0;
        }

        body.compact #s-content .s-question > .b-sep {
            flex: none;
            margin: 0;
        }

        body.compact #study .s-bottom {
            position: static;
            flex: none;
        }

        /* Same bar height whether it shows the hint/answer pills or the
           rating pills, so the card doesn't resize when the back shows (#32). */
        #study .s-actions {
            height: 46px;
        }

        #study .s-actions .s-pill,
        #study .t-ratings,
        #study .t-rate {
            height: 100%;
            box-sizing: border-box;
        }

        /* Keyboard up: only the hint / answer pills stay (no counters,
           no rating pills — those show once the keyboard is down). */
        body.compact.kb-open #study .s-bottom:not([data-state="question"]),
        body.compact.kb-open #study .s-counts {
            display: none;
        }

        body.compact.kb-open #study .s-actions {
            margin-bottom: 0;
        }

        @media (max-width: 600px) {
            .s-pill .t-key {
                display: none;
            }
        }

        /* Card highlighted in the rating's color (automatic or keyboard
           rating; a click/tap only lights up the button pressed). */
        .s-question { transition: border-color .2s, background .2s; }
        .s-question.rated-again, .ly-active.rated-again { border-color: var(--red); background: var(--tint-red); }
        .s-question.rated-hard, .ly-active.rated-hard { border-color: var(--orange); background: var(--tint-orange); }
        .s-question.rated-good, .ly-active.rated-good { border-color: var(--green); background: var(--tint-green); }
        .s-question.rated-easy, .ly-active.rated-easy { border-color: var(--blue); background: var(--tint-blue); }

        /* ── Songs: lyrics view ── */
        .ly-view {
            width: min(720px, 92vw);
            height: calc(var(--vvh, 100vh) - 230px);
            overflow-y: auto;
            box-sizing: border-box;
            padding: 30vh 8px;
            text-align: center;
        }

        .ly-title {
            font-size: 12px;
            color: var(--text-3);
            letter-spacing: .3px;
            margin-bottom: 20px;
        }

        .ly-strophe {
            margin-bottom: 22px;
        }

        .ly-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: .6px;
            margin-bottom: 4px;
        }

        .ly-line {
            font-size: 18px;
            line-height: 1.5;
            padding: 5px 10px;
            border-radius: 14px;
            color: var(--text);
        }

        .ly-locked {
            opacity: .4;
        }

        .ly-blank {
            display: inline-block;
            height: 1.05em;
            margin: 0 3px;
            vertical-align: bottom;
            border-bottom: 2px solid var(--border-2);
        }

        .ly-active {
            margin: 10px 0;
            padding: 12px 14px 8px;
            border: 1.5px solid var(--border-2);
            background: var(--surface);
            transition: border-color .2s, background .2s;
        }

        .ly-active.ly-enter {
            animation: lyEnter .45s ease;
        }

        @keyframes lyEnter {
            from { opacity: .35; transform: translateY(10px) scale(.98); }
            to { opacity: 1; transform: none; }
        }

        .ly-hint {
            font-size: 13px;
            font-style: italic;
            color: var(--text-2);
            margin-bottom: 6px;
        }

        .ly-active .t-words {
            max-width: none;
            gap: 10px 18px;
        }

        .ly-menu {
            position: absolute;
            top: 46px;
            left: 14px;
            z-index: 40;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 14px;
            font-size: 13px;
            color: var(--text-2);
            background: var(--surface);
            border: 1.5px solid var(--border-2);
            border-radius: 14px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, .12);
        }

        .ly-menu[hidden] {
            display: none;
        }

        .ly-menu label {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
        }

        .ly-menu select {
            font-size: 13px;
            color: var(--text);
            background: var(--bg);
            border: 1px solid var(--border-2);
            border-radius: 8px;
            padding: 3px 6px;
        }

        .ly-menu-note {
            font-size: 11px;
            color: var(--text-3);
        }

        body.compact .ly-view {
            flex: 1;
            min-height: 0;
            height: auto;
            width: 100%;
            padding: 40% 4px;
        }

        .t-rate-time {
            font-size: 11px;
            color: var(--text-2);
        }

        .t-rate-label {
            font-size: 13px;
            font-weight: 600;
        }

        .t-rate-again { border-color: var(--border-tint-red); }
        .t-rate-again:hover { background: var(--tint-red); border-color: var(--red); }
        .t-rate-again .t-rate-label { color: var(--red); }

        .t-rate-hard { border-color: var(--border-tint-orange); }
        .t-rate-hard:hover { background: var(--tint-orange); border-color: var(--orange); }
        .t-rate-hard .t-rate-label { color: var(--orange); }

        .t-rate-good { border-color: var(--border-tint-green); }
        .t-rate-good:hover { background: var(--tint-green); border-color: var(--green); }
        .t-rate-good .t-rate-label { color: var(--green); }

        .t-rate-easy { border-color: var(--border-tint-blue); }
        .t-rate-easy:hover { background: var(--tint-blue); border-color: var(--blue); }
        .t-rate-easy .t-rate-label { color: var(--blue); }

        /* Feedback is the rating button itself flashing its own color,
           fading in then out, instead of a separate popup. */
        .t-rate.rate-flash { animation: rateFlash .7s ease; }
        .t-rate.rate-flash .t-rate-label,
        .t-rate.rate-flash .t-rate-time,
        .t-rate.rate-flash .t-key { color: #fff; }
        .t-rate.rate-flash.t-rate-again { --flash-color: var(--red); }
        .t-rate.rate-flash.t-rate-hard { --flash-color: var(--orange); }
        .t-rate.rate-flash.t-rate-good { --flash-color: var(--green); }
        .t-rate.rate-flash.t-rate-easy { --flash-color: var(--blue); }

        @keyframes rateFlash {
            0%, 100% { background: var(--surface); border-color: var(--border-2); }
            35% { background: var(--flash-color); border-color: var(--flash-color); }
        }

        /* Done */
        .s-done {
            text-align: center;
            padding: 60px 24px;
            width: 100%;
        }

        .s-done-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .s-done-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 8px;
        }

        .s-done-sub {
            font-size: 14px;
            color: var(--text-2);
            margin-bottom: 28px;
        }

        .btn-home {
            padding: 12px 28px;
            border-radius: 12px;
            background: var(--blue);
            color: #fff;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }


        /* Verso shown after a card whose back holds more than the typed words */
        /* Verso, shown inside the question card under a separator line
           once the card is done (same look as the card browser) */
        /* Inside the card, under the "verso" line: the blanks (type-in
           mode) or the back once flipped (normal mode). */
        .s-question .t-words {
            max-width: none;
            margin: 6px 0 4px;
        }

        .s-verso-extra:not(:empty) {
            margin-top: 18px;
        }

        .s-mode-toggle {
            background: none;
            border: 1.5px solid var(--border-2);
            border-radius: 20px;
            padding: 3px 10px;
            font-size: 12px;
            color: var(--text-2);
            cursor: pointer;
            white-space: nowrap;
            transition: border-color .15s, color .15s;
        }

        .s-mode-toggle:hover {
            border-color: var(--navy);
            color: var(--navy);
        }

        /* ── BROWSE (recto → verso, lecture seule) ── */
        #browse {
            min-height: 100vh;
            display: none;
            flex-direction: column;
        }

        .b-count {
            flex: 1;
            font-size: 11px;
            color: var(--text-3);
            text-align: right;
        }

        .b-search {
            width: 100%;
            max-width: 720px;
            margin-bottom: 20px;
            padding: 9px 14px;
            border: 1.5px solid var(--border-2);
            border-radius: 12px;
            background: var(--surface);
            color: var(--text);
            font-size: 14px;
            outline: none;
        }

        .b-search:focus {
            border-color: #93aed6;
        }

        /* Carousel: one slide per card, front + back shown together;
           neighbours peek on both sides, native swipe / trackpad scroll. */
        .b-track {
            width: calc(100% + 48px);
            margin: 0 -24px 18px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            padding: 4px max(24px, calc(50% - 280px)) 12px;
            scrollbar-width: none;
        }

        .b-track::-webkit-scrollbar {
            display: none;
        }

        .b-slide {
            flex: 0 0 min(560px, calc(100% - 48px));
            scroll-snap-align: center;
            margin: 0 !important;
            min-height: 220px;
            opacity: .45;
            transition: opacity .25s;
        }

        .b-slide.active {
            opacity: 1;
        }

        .b-slide-audio {
            display: block;
            margin: 14px auto 0;
            background: none;
            border: 1.5px solid var(--border-2);
            border-radius: 10px;
            padding: 5px 12px;
            font-size: 13px;
            cursor: pointer;
        }

        .b-sep {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 18px 0 12px;
            font-size: 11px;
            color: var(--text-3);
            letter-spacing: .3px;
        }

        .b-sep::before,
        .b-sep::after {
            content: "";
            flex: 1;
            border-top: 1px solid var(--border-2);
        }

        /* Dense list for text decks: front | back, one row per card */
        .b-list {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            border: 1.5px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
        }

        .b-row {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 14px;
            align-items: baseline;
            padding: 7px 14px;
            font-size: 14px;
            line-height: 1.4;
            border-top: 1px solid var(--border);
        }

        .b-row:first-child {
            border-top: none;
        }

        .b-row:nth-child(even) {
            background: var(--surface-hover);
        }

        .b-row-front {
            color: var(--text);
        }

        .b-row-back {
            color: var(--text-2);
            border-left: 1px solid var(--border-2);
            padding-left: 14px;
        }

        .b-row-audio {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 12px;
            padding: 0;
            opacity: .6;
        }

        .b-row-audio:hover {
            opacity: 1;
        }

        .b-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            font-size: 13px;
            color: var(--text-2);
        }

        .b-nav button {
            background: none;
            border: 1.5px solid var(--border-2);
            border-radius: 10px;
            padding: 7px 16px;
            color: var(--text-2);
            font-size: 13px;
            cursor: pointer;
            transition: border-color .15s, color .15s;
        }

        .b-nav button:hover:not(:disabled) {
            border-color: var(--navy);
            color: var(--navy);
        }

        .b-nav button:disabled {
            opacity: .35;
            cursor: default;
        }

        @media (max-width: 520px) {
            .b-nav .b-hint {
                display: none;
            }
        }

        /* Toast */
        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #111;
            color: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            transition: transform .3s;
            z-index: 300;
            pointer-events: none;
            white-space: nowrap;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body>

    <!-- ── HOME ── -->
    <div id="home">
        <button class="h-theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Basculer clair/sombre">🌙</button>
        <div class="h-logo">🃏</div>
        <div class="h-title">Anki Trainer</div>
        <div class="h-sub">Pré-traitez votre .apkg avec <code>extract_apkg.py</code>, puis importez le JSON ici</div>
        <div class="h-sources" id="h-sources"></div>
        <label class="h-import-btn">
            ＋ Importer un fichier .json
            <input type="file" accept=".json" style="display:none" onchange="importJSON(this)">
        </label>
        <div class="h-reset" onclick="resetAppData()">🧹 Effacer les données de cet appareil</div>
    </div>

    <!-- ── STUDY ── -->
    <div id="study">
        <div class="s-topbar">
            <button class="s-back" onclick="goHome()">← Quitter</button>
            <button class="s-mode-toggle" id="s-mode-toggle" onclick="toggleStudyMode()" title="Basculer saisie / mode normal (Anki)"></button>
            <button class="s-mode-toggle" id="s-lyrics-opts" onclick="toggleLyricsMenu(event)" title="Options des chansons" style="display:none">⚙</button>
            <div class="ly-menu" id="ly-menu" hidden>
                <label>Indice
                    <select name="hint" onchange="onLyricsHintChange(this.value)">
                        <option value="trad">Traduction FR</option>
                        <option value="context">Contexte seul</option>
                        <option value="initials">Premières lettres</option>
                    </select>
                </label>
                <label>Nouvelles lignes
                    <select name="intro" onchange="setLyricsOpt('intro', this.value)">
                        <option value="strophe">Strophe par strophe</option>
                        <option value="lines">5 lignes</option>
                        <option value="all">Toute la chanson</option>
                    </select>
                </label>
                <div class="ly-menu-note">« Nouvelles lignes » s'applique à la prochaine session.</div>
            </div>
            <div class="s-prog">
                <div class="s-prog-label" id="prog-label">0 / 0</div>
                <div class="s-prog-track">
                    <div class="s-prog-fill" id="prog-fill" style="width:0%"></div>
                </div>
            </div>
        </div>
        <div class="s-main">
            <div id="s-content"></div>
        </div>
        <div class="s-bottom">
            <div class="s-actions" id="s-actions"></div>
            <div class="s-counts">
                <span class="s-count s-count-new" id="cnt-new">0</span>
                <span class="s-count s-count-learn" id="cnt-learn">0</span>
                <span class="s-count s-count-review" id="cnt-review">0</span>
            </div>
        </div>
    </div>

    <div id="toast"></div>
    <!-- ── BROWSE ── -->
    <div id="browse">
        <div class="s-topbar">
            <button class="s-back" onclick="closeBrowse()">← Retour</button>
            <div class="b-count" id="b-count">0 / 0</div>
        </div>
        <div class="s-main">
            <div class="s-deck-name" id="b-deck-name"></div>
            <input class="b-search" id="b-search" type="search" placeholder="🔎 Rechercher…" oninput="filterBrowse(this.value)">
            <div id="b-content" style="width:100%"></div>
        </div>
    </div>

    <!-- Invisible field that holds the phone keyboard open between cards
         (see keepKeyboard()). 16px so iOS doesn't zoom on focus. -->
    <input id="kb-keeper" type="text" tabindex="-1" aria-hidden="true" autocomplete="off" autocorrect="off" spellcheck="false"
        style="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px;pointer-events:none">

    <audio id="audio-player" preload="none"></audio>

    <script>
        // ═══════════════════════════════════════════════
        // FIREBASE (optional — Google sign-in + cloud sync)
        // ═══════════════════════════════════════════════
        // Paste your own project's values here to enable sync. Not a secret:
        // this is meant to be public in client code.
        //
        // There is currently no way to actually sign in — a name-picking
        // dropdown was tried and dropped (no real auth behind it meant every
        // id needed manual allow-listing in the Firestore rules for each
        // new person, not worth it), and real Google sign-in is intended
        // for later (see the `auth` branch, which already has a working
        // implementation). Everything below stays wired up and dormant in
        // the meantime: fbUser is never set, so scheduleSync()/flushSync()
        // (guarded by `if (!fbUser) return`) never fire, and the app is
        // pure localStorage — but the Firestore database, its users/{uid}
        // schema, and all the push/merge logic are ready to go the moment
        // something sets fbUser again.
        var FIREBASE_CONFIG = {
            apiKey: "AIzaSyDMn9fYdjo3rpo2k1Q89pQ2dsIi12c0kJk",
            authDomain: "type-in-anki.firebaseapp.com",
            projectId: "type-in-anki",
            storageBucket: "type-in-anki.firebasestorage.app",
            messagingSenderId: "295848150298",
            appId: "1:295848150298:web:24c322ba3faa57374158a3"
        };
        var FIREBASE_ENABLED = !!(FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey
            && FIREBASE_CONFIG.apiKey.indexOf("PASTE") === -1
            && window.firebase);

        var fbDb = null, fbUser = null;
        if (FIREBASE_ENABLED) {
            try {
                firebase.initializeApp(FIREBASE_CONFIG);
                fbDb = firebase.firestore();
                try { fbDb.enablePersistence({ synchronizeTabs: true }).catch(function () { }); } catch (e) { }
            } catch (e) {
                FIREBASE_ENABLED = false;
                console.error("Firebase init failed:", e);
            }
        }

        // ═══════════════════════════════════════════════
        // STORAGE
        // ═══════════════════════════════════════════════
        var LS_SOURCES = "ankitrain_v1_sources"; // [{id, name, decks:[{id,name,cardCount}]}]
        var LS_CARDS = "ankitrain_v1_c_";      // + sourceId → {deckId:[cards]}
        var LS_SRS = "ankitrain_v1_s_";      // + sourceId → {cardId: srsMeta}
        var LS_NEWCOUNT = "ankitrain_v1_nc_";     // + sourceId → {day, count}
        var LS_FLAGGED = "ankitrain_v1_fl_";     // + sourceId → {cardId: questionPlainText}
        var LS_STYLES = "ankitrain_v1_css_";    // + sourceId → [css shared by cards, see card.style]
        var LS_MODE = "ankitrain_v1_mode";     // "type" (type the answer, default) | "flip" (Anki-style: show answer, rate)
        var LS_THEME = "ankitrain_v1_theme";    // "light" | "dark" | absent (follow system)
        var NEW_LIMIT = 20;

        // Manual override on top of the CSS @media(prefers-color-scheme)
        // default. Absent = follow the system/browser setting.
        function applyTheme() {
            var saved = null;
            try { saved = localStorage.getItem(LS_THEME); } catch (e) { }
            if (saved === "light" || saved === "dark") {
                document.documentElement.setAttribute("data-theme", saved);
            } else {
                document.documentElement.removeAttribute("data-theme");
            }
        }
        function isDarkNow() {
            var saved = null;
            try { saved = localStorage.getItem(LS_THEME); } catch (e) { }
            if (saved === "light" || saved === "dark") return saved === "dark";
            return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        }
        function toggleTheme() {
            var next = isDarkNow() ? "light" : "dark";
            try { localStorage.setItem(LS_THEME, next); } catch (e) { }
            applyTheme();
            updateThemeToggleIcon();
        }
        function updateThemeToggleIcon() {
            var btn = document.getElementById("theme-toggle");
            if (btn) btn.textContent = isDarkNow() ? "☀️" : "🌙";
        }
        applyTheme();
        var TODAY = dayStamp();

        function dayStamp(d) { d = d || new Date(); return Math.floor(d.getTime() / 86400000); }
        function loadSources() { try { return JSON.parse(localStorage.getItem(LS_SOURCES) || "[]"); } catch (e) { return []; } }
        function saveSources(s) { try { localStorage.setItem(LS_SOURCES, JSON.stringify(s)); } catch (e) { toast("Erreur stockage"); } scheduleSync(); }
        function loadCards(sid) { try { return JSON.parse(localStorage.getItem(LS_CARDS + sid) || "{}"); } catch (e) { return {}; } }
        function saveCards(sid, c) { try { localStorage.setItem(LS_CARDS + sid, JSON.stringify(c)); } catch (e) { throw new Error("Données trop volumineuses pour le stockage local"); } scheduleSync(); }
        function loadSRS(sid) { try { return JSON.parse(localStorage.getItem(LS_SRS + sid) || "{}"); } catch (e) { return {}; } }
        function saveSRS(sid, s) { try { localStorage.setItem(LS_SRS + sid, JSON.stringify(s)); } catch (e) { } scheduleSync(); }

        // How many new cards have actually been INTRODUCED today (first
        // rating of a card that was still "new"), persisted per source so
        // the 20/day limit holds across separate visits/sessions instead of
        // resetting to a fresh 20 every time you open a deck.
        function loadNewCount(sid) {
            try { return JSON.parse(localStorage.getItem(LS_NEWCOUNT + sid) || "null") || { day: TODAY, count: 0 }; }
            catch (e) { return { day: TODAY, count: 0 }; }
        }
        function saveNewCount(sid, nc) { try { localStorage.setItem(LS_NEWCOUNT + sid, JSON.stringify(nc)); } catch (e) { } scheduleSync(); }
        function remainingNewToday(sid) {
            var nc = loadNewCount(sid);
            var introducedToday = nc.day === TODAY ? nc.count : 0;
            return Math.max(0, NEW_LIMIT - introducedToday);
        }
        function recordNewIntroduced(sid) {
            var nc = loadNewCount(sid);
            if (nc.day !== TODAY) { nc.day = TODAY; nc.count = 0; }
            nc.count++;
            saveNewCount(sid, nc);
        }

        // Cards flagged "à corriger" during study, so they can be fixed
        // directly in real Anki afterward (search "cid:<id>" in its Browse
        // screen to jump straight to one).
        function loadStyles(sid) { try { return JSON.parse(localStorage.getItem(LS_STYLES + sid) || "[]"); } catch (e) { return []; } }
        function cardStyle(sid, card) { return card.style != null ? (loadStyles(sid)[card.style] || "") : ""; }
        function loadFlagged(sid) {
            try { return JSON.parse(localStorage.getItem(LS_FLAGGED + sid) || "{}"); } catch (e) { return {}; }
        }
        function saveFlagged(sid, fl) { try { localStorage.setItem(LS_FLAGGED + sid, JSON.stringify(fl)); } catch (e) { } scheduleSync(); }
        function toggleFlagCurrent() {
            if (!sess.sourceId) return;
            var card = sess.queue[sess.qIdx];
            if (!card) return;
            var fl = loadFlagged(sess.sourceId);
            if (fl[card.id]) { delete fl[card.id]; toast("Marque retirée"); }
            else { fl[card.id] = plainText(card.question).slice(0, 200); toast("🚩 Carte marquée à corriger"); }
            saveFlagged(sess.sourceId, fl);
            updateFlagIndicator();
        }
        function updateFlagIndicator() {
            var btn = document.getElementById("s-flag-btn");
            if (!btn || !sess.sourceId) return;
            var card = sess.queue[sess.qIdx];
            var flagged = card && loadFlagged(sess.sourceId)[card.id];
            btn.classList.toggle("flagged", !!flagged);
        }
        function showFlaggedList(e, si) {
            e.stopPropagation();
            var sources = loadSources();
            var src = sources[si];
            var fl = loadFlagged(src.id);
            var ids = Object.keys(fl);
            if (!ids.length) { toast("Aucune carte marquée pour cette source."); return; }
            var lines = ids.map(function (id) { return "cid:" + id + "  —  " + fl[id]; });
            var text = lines.join("\n");
            prompt(ids.length + " carte(s) à corriger dans Anki (Parcourir → coller \"cid:X or cid:Y...\" ou chercher une ligne) :",
                "cid:" + ids.join(" or cid:") + "\n\n" + text);
        }

        // ═══════════════════════════════════════════════
        // SCHEDULER — modeled on Anki's actual default scheduler (new →
        // learning steps → review; lapses → relearning steps), structured
        // after a documented clean-room reference implementation
        // (github.com/vlopezferrando/simple-spaced-repetition), not
        // textbook SM-2. Stock defaults: learning 1m then 10m, relearning
        // 1m then 6m, graduating interval 1d, easy interval 4d, starting
        // ease 2.5, easy bonus 1.5, hard factor 1.2. Within a single
        // browser session there's no real clock wait, so a "due in N
        // minutes" step is approximated by reinserting the card N cards
        // further down the current queue instead.
        // ═══════════════════════════════════════════════
        var GRADUATING_DAYS = 1;
        var EASY_DAYS = 4;
        var EASY_BONUS = 1.5;
        var HARD_FACTOR = 1.2;

        function defaultSRS() {
            return { state: "new", step: 0, interval: 0, ease: 2.5, due: TODAY, reps: 0, lapses: 0, easyCount: 0 };
        }

        // q: 1=Again 2=Hard 3=Good 4=Easy. ctx.requeueIn (minutes, approximated
        // as "cards later") is set when the card should come back THIS session;
        // left null once it graduates out to day-based review scheduling.
        function applyRating(srs, q, ctx) {
            var s = Object.assign({}, srs);
            s.reps++;
            if (q === 4) s.easyCount = (s.easyCount || 0) + 1;
            if (s.state === "new") s.state = "learning";

            if (s.state === "learning") {
                if (q === 1) { s.step = 0; ctx.requeueIn = 1; }
                else if (q === 2) { s.step = 1; ctx.requeueIn = 6; }
                else if (q === 4) {
                    s.ease = Math.min(4.0, s.ease + 0.15);
                    s.state = "review"; s.step = 0;
                    s.interval = EASY_DAYS; s.due = TODAY + s.interval;
                } else if (s.step === 0) { s.step = 1; ctx.requeueIn = 10; }
                else {
                    s.state = "review"; s.step = 0;
                    s.interval = GRADUATING_DAYS; s.due = TODAY + s.interval;
                }
            } else if (s.state === "relearning") {
                if (q === 1) { s.ease = Math.max(1.3, s.ease - 0.2); ctx.requeueIn = 1; }
                else if (q === 2) { ctx.requeueIn = 6; }
                else if (q === 3) {
                    s.state = "review";
                    s.interval = GRADUATING_DAYS; s.due = TODAY + s.interval;
                } else {
                    s.ease = Math.min(4.0, s.ease + 0.15);
                    s.state = "review";
                    s.interval = EASY_DAYS; s.due = TODAY + s.interval;
                }
            } else { // review
                if (q === 1) {
                    s.lapses++;
                    s.ease = Math.max(1.3, s.ease - 0.2);
                    s.state = "relearning";
                    ctx.requeueIn = 1;
                } else if (q === 2) {
                    s.ease = Math.max(1.3, s.ease - 0.15);
                    s.interval = Math.max(s.interval + 1, Math.round(s.interval * HARD_FACTOR));
                    s.due = TODAY + s.interval;
                } else if (q === 3) {
                    s.interval = Math.max(1, Math.round(s.interval * s.ease));
                    s.due = TODAY + s.interval;
                } else {
                    s.ease = Math.min(4.0, s.ease + 0.15);
                    s.interval = Math.max(1, Math.round(s.interval * s.ease * EASY_BONUS));
                    s.due = TODAY + s.interval;
                }
            }
            return s;
        }

        // ═══════════════════════════════════════════════
        // IMPORT JSON
        // ═══════════════════════════════════════════════
        function importJSON(input) {
            var file = input.files[0]; if (!file) return;
            input.value = "";
            var reader = new FileReader();
            reader.onload = function (e) {
                var data;
                try { data = JSON.parse(e.target.result); } catch (err) { toast("JSON invalide : " + err.message); return; }
                if (isSongsData(data)) data = songsToDeckData(data);
                var total;
                try { total = importDeckData(data, file.name.replace(/\.json$/, "")); }
                catch (err) { toast("Import impossible : " + err.message); return; }
                if (total == null) { toast("Format invalide — utilisez extract_apkg.py"); return; }
                toast("✓ " + total + " cartes importées (" + data.decks.length + " deck(s))");
                renderHome();
            };
            reader.readAsText(file);
        }

        // Shared by the file picker and the default-deck auto-load below.
        // Returns the number of cards imported, or null if the JSON shape
        // is invalid.
        function importDeckData(data, fallbackName, forcedId, isDefault) {
            if (isSongsData(data)) data = songsToDeckData(data);
            if (!data || !data.decks || !Array.isArray(data.decks)) return null;

            var sid = forcedId || Date.now();
            var sourceName = data.source || fallbackName || "Deck";

            var cardsByDeck = {};
            data.decks.forEach(function (d) { cardsByDeck[d.id] = d.cards || []; });

            var decksMeta = data.decks.map(function (d) {
                var meta = { id: d.id, name: d.name, cardCount: (d.cards || []).length };
                if (d.lyrics) meta.lyrics = d.lyrics; // song layout (lyrics view)
                return meta;
            });

            // Cards first: if they don't fit in localStorage, saveCards
            // throws before an empty source gets listed on the home screen.
            saveCards(sid, cardsByDeck);
            var sources = loadSources();
            sources.push({ id: sid, name: sourceName, decks: decksMeta, isDefault: !!isDefault });
            saveSources(sources);

            // Seed SRS state for cards that already carry real Anki
            // scheduling (extract.py's "srs" field, e.g. from a deck
            // exported with its review history) instead of starting them
            // all as brand new. "dueOffset" is days-from-today at export
            // time, translated to our own day-stamp on import.
            var srs = {};
            data.decks.forEach(function (d) {
                (d.cards || []).forEach(function (c) {
                    if (c.srs) {
                        srs[c.id] = Object.assign({}, c.srs, { due: TODAY + c.srs.dueOffset });
                        delete srs[c.id].dueOffset;
                    }
                });
            });
            if (Object.keys(srs).length) saveSRS(sid, srs);

            return data.decks.reduce(function (n, d) { return n + (d.cards || []).length; }, 0);
        }

        // ── Songs (lyrics-trainer format) → one deck per song ──
        // songs.json: [{title, artist, strophes:[{label, text}], translations:
        // {line: [{w, t:[fr…]}]}}]. Each distinct line is a card (a repeated
        // chorus line is one card): question = the French gloss of the line,
        // words = its Spanish words to type, answer = the Spanish line. The
        // deck keeps the song's layout (verses → line ids) for the lyrics view.
        function isSongsData(d) {
            return Array.isArray(d) && d.length > 0 && d.every(function (x) { return x && Array.isArray(x.strophes); });
        }
        function strHash(str) {
            var h = 5381;
            for (var i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
            return (h >>> 0).toString(36);
        }
        function lineWords(line) {
            return line.split(/\s+/).map(function (w) {
                return w.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, "");
            }).filter(Boolean);
        }
        function songsToDeckData(songs) {
            return {
                source: "Chansons",
                decks: songs.map(function (song) {
                    var tr = song.translations || {};
                    var cards = [], byLine = {};
                    var strophes = song.strophes.map(function (st) {
                        var lines = String(st.text || "").split("\n")
                            .map(function (l) { return l.trim(); })
                            .filter(function (l) { return l.length > 1; });
                        return {
                            label: st.label || "",
                            lines: lines.map(function (line) {
                                if (!byLine[line]) {
                                    var gloss = (tr[line] || []).map(function (e) { return (e.t && e.t[0]) || ""; }).filter(Boolean).join(" ");
                                    byLine[line] = { id: "song-" + strHash(song.title + "\n" + line), question: esc(gloss), answer: esc(line), words: lineWords(line), tags: ["chanson"] };
                                    cards.push(byLine[line]);
                                }
                                return { id: byLine[line].id, text: line };
                            })
                        };
                    });
                    var name = song.title + (song.artist ? " — " + song.artist : "");
                    return { id: "song-" + strHash(song.title), name: "Chansons::" + name, cards: cards, lyrics: { strophes: strophes } };
                })
            };
        }

        // If no deck has ever been imported yet, try loading a bundled
        // default.json (+ its default_media/ folder) sitting next to
        // index.html — same idea as the old lyrics trainer's built-in
        // songs.json. Silently does nothing if that file isn't there.
        var DEFAULT_DECK_URL = "default.json";
        function loadDefaultDeckIfEmpty() {
            // default.json used to say "source": "out" (extract.py's --out
            // name); fix the label already stored on existing devices.
            var srcs = loadSources();
            var def = srcs.find(function (s) { return s.id === "default" && s.name === "out"; });
            if (def) { def.name = "Espagnol"; saveSources(srcs); }
            if (srcs.length) return Promise.resolve(false);
            return fetch(DEFAULT_DECK_URL)
                .then(function (r) { return r.ok ? r.json() : null; })
                .then(function (data) {
                    if (!data) return false;
                    // Stable id (not Date.now()) so cloud sync recognizes
                    // this same bundled deck across different devices.
                    var total = importDeckData(data, "Deck par défaut", "default", true);
                    if (total != null) { toast("✓ Deck par défaut chargé (" + total + " cartes)"); return true; }
                    return false;
                })
                .catch(function () { return false; });
        }

        // Other bundled decks (generated with extract.py, images as web
        // links so nothing is hosted here). Each one is loaded once per
        // browser — even if default.json is already there — and not again
        // after being deleted, until "Effacer les données" resets it all.
        var EXTRA_BUNDLED = [{ url: "arbres.json", id: "arbres" }, { url: "songs.json", id: "chansons" }];
        var LS_BUNDLED_SEEN = "ankitrain_v1_bundled_seen";
        function loadExtraBundledDecks() {
            var seen;
            try { seen = JSON.parse(localStorage.getItem(LS_BUNDLED_SEEN) || "[]"); } catch (e) { seen = []; }
            var have = loadSources().map(function (s) { return String(s.id); });
            var todo = EXTRA_BUNDLED.filter(function (b) { return seen.indexOf(b.id) === -1; });
            return Promise.all(todo.map(function (b) {
                if (have.indexOf(b.id) !== -1) return b.id;
                return fetch(b.url)
                    .then(function (r) { return r.ok ? r.json() : null; })
                    .then(function (data) {
                        if (!data) return null;
                        var total = importDeckData(data, b.id, b.id, false);
                        if (total != null) toast("✓ " + (data.source || (isSongsData(data) ? "Chansons" : b.id)) + " chargé (" + total + " cartes)");
                        return total != null ? b.id : null;
                    })
                    .catch(function () { return null; });
            })).then(function (ids) {
                ids.forEach(function (id) { if (id && seen.indexOf(id) === -1) seen.push(id); });
                try { localStorage.setItem(LS_BUNDLED_SEEN, JSON.stringify(seen)); } catch (e) { }
            });
        }

        // Wipes every localStorage key this app owns (sources, cards, SRS,
        // daily new-card counters) — the actual fix for "a source imported
        // before some bug was fixed still shows the bug": there's no other
        // way to clear that from inside the browser without dev tools.
        function resetAppData() {
            if (!confirm("Effacer toutes les sources importées, la progression et les compteurs quotidiens de cet appareil ? Irréversible.")) return;
            var toRemove = [];
            for (var i = 0; i < localStorage.length; i++) {
                var k = localStorage.key(i);
                if (k && k.indexOf("ankitrain_v1_") === 0) toRemove.push(k);
            }
            toRemove.forEach(function (k) { localStorage.removeItem(k); });
            toast("Données effacées (" + toRemove.length + " entrée(s))");
            if (fbUser) wipeFirestoreForUser();
            loadDefaultDeckIfEmpty().then(loadExtraBundledDecks).then(renderHome);
        }

        // ═══════════════════════════════════════════════
        // CLOUD SYNC (Firebase Auth + Firestore) — optional
        // ═══════════════════════════════════════════════
        // Everything above (load*/save*) stays synchronous, localStorage-
        // only, and unchanged in shape. This layer just watches saves and
        // mirrors them to Firestore in the background when signed in, and
        // does the reverse (cloud -> localStorage) on sign-in. If
        // FIREBASE_ENABLED is false none of this ever runs.
        var SYNC_DEBOUNCE_MS = 1500;
        var syncTimer = null;
        var syncInProgress = false;
        var syncPending = false;

        function setSyncStatus(state) {
            // state: "synced" | "syncing" | "offline" | "error" | "" (hidden)
            var el = document.getElementById("sync-status");
            if (!el) return;
            var labels = { synced: "✓ Synchronisé", syncing: "↻ Synchronisation…", offline: "⚠ Hors ligne", error: "⚠ Erreur de sync" };
            el.textContent = labels[state] || "";
            el.className = "sync-status sync-" + (state || "hidden");
        }

        function scheduleSync() {
            if (!FIREBASE_ENABLED || !fbUser) return;
            setSyncStatus(navigator.onLine === false ? "offline" : "syncing");
            clearTimeout(syncTimer);
            syncTimer = setTimeout(flushSync, SYNC_DEBOUNCE_MS);
        }
        function flushSync() {
            if (!FIREBASE_ENABLED || !fbUser) return;
            if (syncInProgress) { syncPending = true; return; }
            syncInProgress = true;
            pushAllToFirestore()
                .then(function () { setSyncStatus("synced"); })
                .catch(function (err) { console.error("sync push failed:", err); setSyncStatus("error"); })
                .then(function () {
                    syncInProgress = false;
                    if (syncPending) { syncPending = false; flushSync(); }
                });
        }
        document.addEventListener("visibilitychange", function () {
            if (document.visibilityState === "hidden") { clearTimeout(syncTimer); flushSync(); }
        });
        window.addEventListener("pagehide", function () { clearTimeout(syncTimer); flushSync(); });
        window.addEventListener("online", function () { if (fbUser) scheduleSync(); });
        window.addEventListener("offline", function () { if (fbUser) setSyncStatus("offline"); });

        // Firestore docs are capped at 1 MiB; split a big JSON string into
        // chunks comfortably under that so a large imported deck's card
        // content never risks hitting the limit.
        function chunkString(str, size) {
            var out = [];
            for (var i = 0; i < str.length; i += size) out.push(str.slice(i, i + size));
            return out.length ? out : [""];
        }

        function pushAllToFirestore() {
            if (!FIREBASE_ENABLED || !fbUser || !fbDb) return Promise.resolve();
            var sources = loadSources();
            var userRef = fbDb.collection("users").doc(fbUser.uid);
            var batch = fbDb.batch();

            batch.set(userRef, {
                sources: sources.map(function (s) { return { id: String(s.id), name: s.name, decks: s.decks, isDefault: !!s.isDefault }; }),
                theme: (function () { try { return localStorage.getItem(LS_THEME); } catch (e) { return null; } })(),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

            sources.forEach(function (src) {
                var srcRef = userRef.collection("sources").doc(String(src.id));
                batch.set(srcRef, {
                    srs: loadSRS(src.id),
                    newCount: loadNewCount(src.id),
                    flagged: loadFlagged(src.id),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
            });

            return batch.commit().then(function () {
                // Card content for user-imported sources only — the bundled
                // default deck is already static/served from default.json,
                // no need to duplicate its content in Firestore.
                var cardWrites = [];
                sources.forEach(function (src) {
                    if (src.isDefault) return;
                    var json = JSON.stringify(loadCards(src.id));
                    var chunks = chunkString(json, 900000);
                    var chunkCol = userRef.collection("sources").doc(String(src.id)).collection("cardChunks");
                    chunks.forEach(function (chunk, i) {
                        cardWrites.push(chunkCol.doc(String(i)).set({ data: chunk, index: i, total: chunks.length }));
                    });
                });
                return Promise.all(cardWrites);
            });
        }

        function fetchSourceCards(userRef, sourceId) {
            return userRef.collection("sources").doc(String(sourceId)).collection("cardChunks")
                .orderBy("index").get().then(function (snap) {
                    if (snap.empty) return null;
                    var parts = [];
                    snap.forEach(function (doc) { parts.push(doc.data().data); });
                    try { return JSON.parse(parts.join("")); } catch (e) { return null; }
                });
        }

        function backupLocalData() {
            var dump = { sources: loadSources(), perSource: {} };
            dump.sources.forEach(function (s) {
                dump.perSource[s.id] = { cards: loadCards(s.id), srs: loadSRS(s.id), newCount: loadNewCount(s.id), flagged: loadFlagged(s.id) };
            });
            try { localStorage.setItem("ankitrain_v1_backup_" + Date.now(), JSON.stringify(dump)); } catch (e) { }
        }

        // Keeps whichever SRS entry was reviewed more recently. Entries
        // from before lastReview existed are treated as older than any
        // timestamped entry, per spec.
        function mergeSRS(localSRS, cloudSRS) {
            var out = Object.assign({}, localSRS);
            Object.keys(cloudSRS || {}).forEach(function (cid) {
                var l = out[cid], c = cloudSRS[cid];
                if (!l) { out[cid] = c; return; }
                var lt = l.lastReview || 0, ct = c.lastReview || 0;
                if (ct > lt) out[cid] = c;
            });
            return out;
        }
        function mergeFlagged(localFl, cloudFl) {
            return Object.assign({}, cloudFl || {}, localFl || {}); // union, local text wins on conflict
        }

        function fetchAndMergeFromFirestore() {
            if (!FIREBASE_ENABLED || !fbUser || !fbDb) return Promise.resolve();
            var userRef = fbDb.collection("users").doc(fbUser.uid);
            return userRef.get().then(function (userDoc) {
                var cloud = userDoc.exists ? userDoc.data() : null;
                var localSources = loadSources();

                if (!cloud || !cloud.sources || !cloud.sources.length) {
                    // Nothing in the cloud yet — upload whatever's local, if any.
                    return localSources.length ? pushAllToFirestore() : Promise.resolve();
                }

                backupLocalData();

                if (!localSources.length) {
                    // Cloud has data, nothing local — pull everything down.
                    return Promise.all(cloud.sources.map(function (cs) {
                        var srcRef = userRef.collection("sources").doc(cs.id);
                        return Promise.all([srcRef.get(), fetchSourceCards(userRef, cs.id)]).then(function (r) {
                            var meta = r[0].exists ? r[0].data() : { srs: {}, newCount: {}, flagged: {} };
                            var cards = r[1] || (cs.isDefault ? null : {});
                            var sid = cs.isDefault ? "default" : cs.id;
                            localSources.push({ id: sid, name: cs.name, decks: cs.decks, isDefault: !!cs.isDefault });
                            if (cards) saveCardsRaw(sid, cards);
                            saveSRSRaw(sid, meta.srs || {});
                            saveNewCountRaw(sid, meta.newCount || { day: TODAY, count: 0 });
                            saveFlaggedRaw(sid, meta.flagged || {});
                        });
                    })).then(function () {
                        saveSourcesRaw(localSources);
                        if (cloud.theme) { try { localStorage.setItem(LS_THEME, cloud.theme); } catch (e) { } applyTheme(); updateThemeToggleIcon(); }
                    });
                }

                // Both sides have data: merge by source name (local ids are
                // per-device/Date.now()-based and won't match across
                // devices; the bundled default deck uses the stable id
                // "default" specifically so it always matches).
                var byName = {};
                localSources.forEach(function (s) { byName[s.name] = s; });

                var work = cloud.sources.map(function (cs) {
                    var local = byName[cs.name];
                    var srcRef = userRef.collection("sources").doc(cs.id);
                    return Promise.all([srcRef.get(), local ? null : fetchSourceCards(userRef, cs.id)]).then(function (r) {
                        var meta = r[0].exists ? r[0].data() : { srs: {}, newCount: {}, flagged: {} };
                        if (local) {
                            saveSRSRaw(local.id, mergeSRS(loadSRS(local.id), meta.srs || {}));
                            saveFlaggedRaw(local.id, mergeFlagged(loadFlagged(local.id), meta.flagged || {}));
                            // Higher of the two daily counters for today, so
                            // the limit can't be bypassed by switching devices.
                            var localNc = loadNewCount(local.id), cloudNc = meta.newCount || { day: TODAY, count: 0 };
                            var merged = (cloudNc.day === TODAY && cloudNc.count > (localNc.day === TODAY ? localNc.count : 0))
                                ? cloudNc : localNc;
                            saveNewCountRaw(local.id, merged);
                        } else if (r[1]) {
                            var sid = cs.isDefault ? "default" : cs.id;
                            localSources.push({ id: sid, name: cs.name, decks: cs.decks, isDefault: !!cs.isDefault });
                            saveCardsRaw(sid, r[1]);
                            saveSRSRaw(sid, meta.srs || {});
                            saveNewCountRaw(sid, meta.newCount || { day: TODAY, count: 0 });
                            saveFlaggedRaw(sid, meta.flagged || {});
                        }
                    });
                });

                return Promise.all(work).then(function () {
                    saveSourcesRaw(localSources);
                    if (cloud.theme) { try { localStorage.setItem(LS_THEME, cloud.theme); } catch (e) { } applyTheme(); updateThemeToggleIcon(); }
                    return pushAllToFirestore(); // write the merged result back
                });
            });
        }

        // "Raw" localStorage writes used only while merging — they skip
        // scheduleSync() so pulling from the cloud doesn't immediately try
        // to push straight back before the merge as a whole is done (the
        // final pushAllToFirestore() call above covers that).
        function saveSourcesRaw(s) { try { localStorage.setItem(LS_SOURCES, JSON.stringify(s)); } catch (e) { } }
        function saveCardsRaw(sid, c) { try { localStorage.setItem(LS_CARDS + sid, JSON.stringify(c)); } catch (e) { } }
        function saveSRSRaw(sid, s) { try { localStorage.setItem(LS_SRS + sid, JSON.stringify(s)); } catch (e) { } }
        function saveNewCountRaw(sid, nc) { try { localStorage.setItem(LS_NEWCOUNT + sid, JSON.stringify(nc)); } catch (e) { } }
        function saveFlaggedRaw(sid, fl) { try { localStorage.setItem(LS_FLAGGED + sid, JSON.stringify(fl)); } catch (e) { } }

        function deleteSourceFromFirestore(sourceId) {
            if (!FIREBASE_ENABLED || !fbUser || !fbDb) return Promise.resolve();
            var srcRef = fbDb.collection("users").doc(fbUser.uid).collection("sources").doc(String(sourceId));
            return srcRef.collection("cardChunks").get().then(function (snap) {
                var batch = fbDb.batch();
                snap.forEach(function (doc) { batch.delete(doc.ref); });
                batch.delete(srcRef);
                return batch.commit();
            }).catch(function (err) { console.error("Firestore source delete failed:", err); });
        }
        function wipeFirestoreForUser() {
            if (!FIREBASE_ENABLED || !fbUser || !fbDb) return Promise.resolve();
            var userRef = fbDb.collection("users").doc(fbUser.uid);
            return userRef.collection("sources").get().then(function (snap) {
                return Promise.all(snap.docs.map(function (d) { return deleteSourceFromFirestore(d.id); }));
            }).then(function () { return userRef.delete(); })
                .catch(function (err) { console.error("Firestore wipe failed:", err); });
        }

        // Clears the localStorage keys that hold another person's data —
        // run on sign-out so a shared/public device doesn't leak the
        // previous account's progress to whoever uses it next.
        function clearLocalSyncedData() {
            var toRemove = [];
            for (var i = 0; i < localStorage.length; i++) {
                var k = localStorage.key(i);
                if (k && k.indexOf("ankitrain_v1_") === 0 && k.indexOf("ankitrain_v1_backup_") !== 0) toRemove.push(k);
            }
            toRemove.forEach(function (k) { localStorage.removeItem(k); });
        }


        // ═══════════════════════════════════════════════
        // EXPORT STATS (for re-importing progress back into real Anki)
        // ═══════════════════════════════════════════════
        function exportStats(e, si) {
            e.stopPropagation();
            var sources = loadSources();
            var src = sources[si];
            var srs = loadSRS(src.id);
            if (!Object.keys(srs).length) { toast("Aucune progression à exporter pour cette source."); return; }
            var payload = { version: 1, source: src.name, exportedAt: new Date().toISOString(), cards: srs };
            var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
            var url = URL.createObjectURL(blob);
            var a = document.createElement("a");
            a.href = url;
            a.download = src.name.replace(/[^a-z0-9_\-]+/gi, "_") + "_stats.json";
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        }

        // ═══════════════════════════════════════════════
        // DECK TREE HELPERS
        // ═══════════════════════════════════════════════
        function naturalCompare(a, b) {
            return a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" });
        }

        // Build a full-depth tree from "::"-separated deck names (any number
        // of levels, e.g. Root::Child::"Espagnol 7"), sorted numerically so
        // "Espagnol 2" comes before "Espagnol 10".
        function buildDeckTree(decksMeta) {
            var nodes = {}, roots = [];
            decksMeta.forEach(function (d) {
                var parts = d.name.split("::");
                var path = "";
                for (var i = 0; i < parts.length; i++) {
                    var parentPath = path;
                    path = path ? path + "::" + parts[i] : parts[i];
                    if (!nodes[path]) {
                        var node = { name: parts[i], fullName: path, depth: i, children: [] };
                        nodes[path] = node;
                        if (parentPath) nodes[parentPath].children.push(node);
                        else roots.push(node);
                    }
                }
            });
            var sortRec = function (list) {
                list.sort(function (a, b) { return naturalCompare(a.name, b.name); });
                list.forEach(function (n) { sortRec(n.children); });
            };
            sortRec(roots);
            return roots;
        }

        function renderDeckRows(nodes, si, decksMeta, cardsByDeck, srs, newLimit) {
            return nodes.map(function (node) {
                var childIds = childDeckIds(decksMeta, node.fullName);
                var cardIds = allCardIds(cardsByDeck, childIds);
                var stats = deckStats(cardIds, srs, newLimit);
                var customLimit = stats.new + 20;
                var html = '<div class="h-deckrow" style="padding-left:' + (16 + node.depth * 20) + 'px" onclick="startStudy(' + si + ',\'' + esc(node.fullName) + '\')">'
                    + (node.depth > 0 ? '<span style="color:#ddd;margin-right:6px;font-size:11px">└</span>' : '')
                    + '<div class="h-deckrow-name' + (node.depth === 0 ? ' root-deck' : '') + '">' + esc(node.name) + '</div>'
                    + (stats.new ? '<span class="badge badge-new">' + stats.new + ' nvx</span>' : '')
                    + (stats.due ? '<span class="badge badge-due">' + stats.due + ' dus</span>' : '')
                    + (stats.learned ? '<span class="badge badge-done">' + stats.learned + ' appris</span>' : '')
                    + (stats.trueNew > stats.new
                        ? '<button class="h-custom-btn" title="Étudier 20 cartes de plus que la limite du jour" onclick="event.stopPropagation(); startStudy(' + si + ',\'' + esc(node.fullName) + '\',' + customLimit + ')">+20</button>'
                        : '')
                    + '<button class="h-custom-btn" title="Parcourir les cartes (recto → verso)" onclick="event.stopPropagation(); openBrowse(' + si + ',\'' + esc(node.fullName) + '\')">🔍</button>'
                    + '</div>';
                if (node.children.length) html += renderDeckRows(node.children, si, decksMeta, cardsByDeck, srs, newLimit);
                return html;
            }).join("");
        }

        function isChildOf(child, parent) {
            return child === parent || child.startsWith(parent + "::");
        }

        // Get all deck ids that are children of (or equal to) a given deck name
        function childDeckIds(decksMeta, deckName) {
            return decksMeta.filter(function (d) { return isChildOf(d.name, deckName); }).map(function (d) { return d.id; });
        }

        // SRS stats for a set of card ids
        function deckStats(cardIds, srs, newLimit) {
            var newC = 0, due = 0, learned = 0;
            cardIds.forEach(function (cid) {
                var s = srs[cid];
                if (!s || s.state === "new") newC++;
                else if (s.state === "learning" || s.state === "relearning" || s.due <= TODAY) due++;
                else learned++;
            });
            return { new: Math.min(newC, newLimit == null ? NEW_LIMIT : newLimit), due: due, learned: learned, trueNew: newC };
        }

        // Collect all card ids across a set of deck ids
        function allCardIds(cardsByDeck, deckIds) {
            var ids = [];
            deckIds.forEach(function (did) {
                (cardsByDeck[did] || []).forEach(function (c) { ids.push(c.id); });
            });
            return ids;
        }

        // ═══════════════════════════════════════════════
        // HOME
        // ═══════════════════════════════════════════════
        function renderHome() {
            var sources = loadSources();
            var el = document.getElementById("h-sources");
            if (!sources.length) {
                el.innerHTML = '<div class="h-empty">Aucun deck importé.<br>Pré-traitez votre .apkg avec <code>extract_apkg.py</code> puis importez le JSON.</div>';
                return;
            }

            el.innerHTML = sources.map(function (src, si) {
                var srs = loadSRS(src.id);
                var cardsByDeck = loadCards(src.id);
                var total = src.decks.reduce(function (n, d) { return n + d.cardCount; }, 0);
                var tree = buildDeckTree(src.decks);
