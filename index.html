<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anki Trainer</title>
    <!-- Compat SDK (not the modular one) so it plugs into the existing
         ES5-style script block below with no bundler/build step. -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --navy: #1e3a5f;
            --green: #16a34a;
            --red: #dc2626;
            --orange: #ea580c;
            --blue: #2563eb;
            --gold: #c8a84b;

            --bg: #fff;
            --surface: #fff;
            --surface-hover: #f8faff;
            --text: #111;
            --text-2: #999;
            --text-3: #ccc;
            --border: #f0f0f0;
            --border-2: #e5e7eb;
            --input-line: #d0ccc5;

            --tint-blue: #eff6ff;
            --tint-green: #f0fdf4;
            --tint-orange: #fff7ed;
            --tint-red: #fef2f2;
            --border-tint-blue: #cfe0fb;
            --border-tint-green: #cdebd8;
            --border-tint-orange: #fde3c8;
            --border-tint-red: #fde2e2;

            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --navy: #85aee0;
                --bg: #131417;
                --surface: #1b1d21;
                --surface-hover: #24272c;
                --text: #e8e9eb;
                --text-2: #8b8f96;
                --text-3: #52565d;
                --border: #26292e;
                --border-2: #34383f;
                --input-line: #4d4842;

                --tint-blue: rgba(37, 99, 235, .18);
                --tint-green: rgba(22, 163, 74, .18);
                --tint-orange: rgba(234, 88, 12, .18);
                --tint-red: rgba(220, 38, 38, .18);
                --border-tint-blue: #2a3c5c;
                --border-tint-green: #1f4430;
                --border-tint-orange: #593c20;
                --border-tint-red: #59292a;

                color-scheme: dark;
            }
        }

        :root[data-theme="dark"] {
            --navy: #85aee0;
            --bg: #131417;
            --surface: #1b1d21;
            --surface-hover: #24272c;
            --text: #e8e9eb;
            --text-2: #8b8f96;
            --text-3: #52565d;
            --border: #26292e;
            --border-2: #34383f;
            --input-line: #4d4842;

            --tint-blue: rgba(37, 99, 235, .18);
            --tint-green: rgba(22, 163, 74, .18);
            --tint-orange: rgba(234, 88, 12, .18);
            --tint-red: rgba(220, 38, 38, .18);
            --border-tint-blue: #2a3c5c;
            --border-tint-green: #1f4430;
            --border-tint-orange: #593c20;
            --border-tint-red: #59292a;

            color-scheme: dark;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── HOME ── */
        #home {
            position: relative;
            max-width: 560px;
            margin: 0 auto;
            padding: 52px 24px 80px;
        }

        .h-theme-toggle {
            position: absolute;
            top: env(safe-area-inset-top, 0px);
            right: 24px;
            margin-top: 16px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1.5px solid var(--border);
            background: var(--surface);
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color .15s, background .15s;
        }

        .h-theme-toggle:hover {
            border-color: var(--navy);
            background: var(--surface-hover);
        }

        .sync-status {
            font-size: 11px;
            color: var(--text-2);
        }

        .sync-status.sync-error { color: var(--red); }
        .sync-status.sync-offline { color: var(--orange); }
        .sync-status.sync-hidden { display: none; }

        .h-logo {
            font-size: 36px;
            margin-bottom: 6px;
        }

        .h-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 4px;
        }

        .h-sub {
            font-size: 13px;
            color: var(--text-2);
            margin-bottom: 36px;
        }

        /* Source list */
        .h-sources {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
        }

        .h-source {
            border: 1.5px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            transition: border-color .15s;
        }

        .h-source:hover {
            border-color: var(--border-tint-blue);
        }

        .h-source-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 16px;
            cursor: pointer;
            user-select: none;
            background: var(--surface);
            transition: background .12s;
        }

        .h-source-header:hover {
            background: var(--surface-hover);
        }

        .h-source-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            flex: 1;
        }

        .h-source-meta {
            font-size: 11px;
            color: var(--text-2);
        }

        .h-source-del {
            padding: 3px 8px;
            font-size: 12px;
            color: var(--text-3);
            background: none;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            transition: color .15s;
            flex-shrink: 0;
        }

        .h-source-export {
            padding: 3px 8px;
            font-size: 12px;
            color: var(--text-3);
            background: none;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            transition: color .15s;
            flex-shrink: 0;
        }

        .h-source-export:hover {
            color: var(--navy);
        }

        .h-source-del:hover {
            color: var(--red);
        }

        .h-source-arrow {
            font-size: 11px;
            color: var(--text-3);
            transition: transform .2s;
            flex-shrink: 0;
        }

        .h-source-arrow.open {
            transform: rotate(90deg);
        }

        /* Deck tree inside a source */
        .h-decktree {
            display: none;
            border-top: 1px solid var(--border);
            padding: 8px 0;
        }

        .h-decktree.open {
            display: block;
        }

        .h-deckrow {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            cursor: pointer;
            transition: background .12s;
        }

        .h-deckrow:hover {
            background: var(--surface-hover);
        }

        .h-deckrow-name {
            font-size: 13px;
            color: var(--text);
            flex: 1;
        }

        .h-deckrow-name.root-deck {
            font-weight: 600;
        }

        .badge {
            padding: 2px 7px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-new {
            background: var(--tint-blue);
            color: var(--blue);
        }

        .badge-due {
            background: var(--tint-orange);
            color: var(--orange);
        }

        .badge-done {
            background: var(--tint-green);
            color: var(--green);
        }

        .h-custom-btn {
            padding: 2px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            border: 1.5px solid var(--border-2);
            background: var(--surface);
            color: var(--text-2);
            cursor: pointer;
            transition: border-color .15s, background .15s;
        }

        .h-custom-btn:hover {
            border-color: var(--navy);
            color: var(--navy);
        }

        .h-empty {
            font-size: 14px;
            color: var(--text-3);
            text-align: center;
            padding: 28px 0;
        }

        .h-import-btn {
            width: 100%;
            padding: 13px;
            border: 1.5px dashed var(--text-3);
            border-radius: 14px;
            background: none;
            font-size: 14px;
            color: var(--text-2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: border-color .15s, color .15s;
        }

        .h-import-btn:hover {
            border-color: var(--navy);
            color: var(--navy);
        }

        .h-reset {
            margin-top: 14px;
            text-align: center;
            font-size: 11px;
            color: var(--text-3);
            cursor: pointer;
            transition: color .15s;
        }

        .h-reset:hover {
            color: var(--red);
        }

        /* ── STUDY ── */
        #study {
            min-height: 100vh;
            display: none;
            flex-direction: column;
        }

        .s-topbar {
            padding: 16px 24px 0;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .s-back {
            background: none;
            border: none;
            color: var(--text-2);
            cursor: pointer;
            font-size: 13px;
            transition: color .15s;
        }

        .s-back:hover {
            color: var(--navy);
        }

        .s-prog {
            flex: 1;
        }

        .s-prog-label {
            font-size: 11px;
            color: var(--text-3);
            text-align: right;
            margin-bottom: 5px;
        }

        .s-prog-track {
            height: 2px;
            background: var(--border);
            border-radius: 2px;
        }

        .s-prog-fill {
            height: 100%;
            background: var(--gold);
            border-radius: 2px;
            transition: width .6s cubic-bezier(.4, 0, .2, 1);
        }

        .s-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 36px 24px 84px;
        }

        .s-deck-name {
            font-size: 12px;
            color: var(--text-3);
            margin-bottom: 24px;
            letter-spacing: .3px;
        }

        /* Bottom counters, à la AnkiDroid: new (blue) / learning (red) / review (green) */
        .s-counts {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            display: flex;
            justify-content: center;
            gap: 26px;
            padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px));
            background: var(--surface);
            border-top: 1px solid var(--border);
        }

        .s-count {
            font-size: 14px;
            font-weight: 700;
        }

        .s-count-new { color: var(--blue); }
        .s-count-learn { color: var(--red); }
        .s-count-review { color: var(--green); }

        /* Question */
        .s-question {
            width: 100%;
            max-width: 720px;
            border: 1.5px solid var(--border);
            border-radius: 18px;
            padding: 28px 32px;
            margin-bottom: 32px;
            font-size: clamp(18px, 2.8vw, 26px);
            line-height: 1.6;
            color: var(--text);
            text-align: center;
        }

        .s-question img {
            max-width: 100%;
            max-height: 50vh;
            border-radius: 8px;
            margin: 8px 0;
        }

        .s-question * {
            font-family: inherit;
        }

        .s-audio-btn {
            display: block;
            margin: 10px auto 0;
            background: none;
            border: 1.5px solid var(--border-2);
            border-radius: 20px;
            padding: 5px 14px;
            font-size: 14px;
            color: var(--navy);
            cursor: pointer;
            transition: border-color .15s, background .15s;
        }

        .s-audio-btn:hover {
            border-color: var(--navy);
            background: var(--surface-hover);
        }

        /* Word inputs */
        .t-words {
            display: flex;
            flex-wrap: wrap;
            gap: 18px 28px;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            max-width: 720px;
        }

        .word-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .wc-lbl {
            font-family: Georgia, serif;
            font-size: clamp(16px, 2.4vw, 24px);
            min-height: 32px;
            color: var(--text-3);
        }

        .wc-inp {
            border: none;
            border-bottom: 2.5px solid var(--input-line);
            background: transparent;
            color: var(--text);
            font-family: Georgia, serif;
            font-size: 17px;
            text-align: center;
            outline: none;
            padding: 2px 4px 7px;
            transition: border-color .2s, color .2s;
            min-width: 48px;
        }

        .wc-inp:focus {
            border-bottom-color: #93aed6;
        }

        .wc-inp.ok {
            border-bottom-color: var(--green);
            color: var(--green);
        }

        .wc-inp.err {
            border-bottom-color: var(--red);
            color: var(--red);
        }

        .wc-inp::placeholder {
            color: var(--text-3);
        }

        .wc-hint {
            display: none;
            font-family: Georgia, serif;
            font-size: 13px;
            color: var(--gold);
        }

        .wc-attempts {
            font-size: 11px;
            color: var(--red);
            letter-spacing: 1px;
            min-height: 14px;
        }

        .t-actions {
            margin-top: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
            width: 100%;
        }

        .t-show-ans {
            font-size: 11px;
            color: var(--text-2);
            cursor: pointer;
            letter-spacing: .3px;
            transition: color .15s;
        }

        .t-show-ans:hover {
            color: var(--gold);
        }

        .t-flag {
            font-size: 11px;
            color: var(--text-3);
            cursor: pointer;
            letter-spacing: .3px;
            transition: color .15s;
        }

        .t-flag:hover {
            color: var(--orange);
        }

        .t-flag.flagged {
            color: var(--orange);
            font-weight: 600;
        }

        .t-key {
            display: inline-block;
            font-size: 9px;
            font-weight: 700;
            color: var(--text-2);
            border: 1px solid var(--text-3);
            border-radius: 4px;
            padding: 1px 4px;
            margin-left: 4px;
            vertical-align: middle;
        }

        /* Anki-style answer buttons, à la anki_ui_after.png */
        .t-ratings {
            margin-top: 22px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .t-rate {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            min-width: 92px;
            padding: 8px 14px;
            border: 1.5px solid var(--border-2);
            border-radius: 12px;
            background: var(--surface);
            cursor: pointer;
            transition: border-color .15s, background .15s, transform .1s;
        }

        .t-rate:hover {
            transform: translateY(-1px);
        }

        .t-rate:active {
            transform: translateY(0);
        }

        .t-rate .t-key {
            margin-left: 0;
            margin-top: 2px;
        }

        .t-rate-time {
            font-size: 11px;
            color: var(--text-2);
        }

        .t-rate-label {
            font-size: 13px;
            font-weight: 600;
        }

        .t-rate-again { border-color: var(--border-tint-red); }
        .t-rate-again:hover { background: var(--tint-red); border-color: var(--red); }
        .t-rate-again .t-rate-label { color: var(--red); }

        .t-rate-hard { border-color: var(--border-tint-orange); }
        .t-rate-hard:hover { background: var(--tint-orange); border-color: var(--orange); }
        .t-rate-hard .t-rate-label { color: var(--orange); }

        .t-rate-good { border-color: var(--border-tint-green); }
        .t-rate-good:hover { background: var(--tint-green); border-color: var(--green); }
        .t-rate-good .t-rate-label { color: var(--green); }

        .t-rate-easy { border-color: var(--border-tint-blue); }
        .t-rate-easy:hover { background: var(--tint-blue); border-color: var(--blue); }
        .t-rate-easy .t-rate-label { color: var(--blue); }

        /* Feedback is the rating button itself flashing its own color,
           fading in then out, instead of a separate popup. */
        .t-rate.rate-flash { animation: rateFlash .7s ease; }
        .t-rate.rate-flash .t-rate-label,
        .t-rate.rate-flash .t-rate-time,
        .t-rate.rate-flash .t-key { color: #fff; }
        .t-rate.rate-flash.t-rate-again { --flash-color: var(--red); }
        .t-rate.rate-flash.t-rate-hard { --flash-color: var(--orange); }
        .t-rate.rate-flash.t-rate-good { --flash-color: var(--green); }
        .t-rate.rate-flash.t-rate-easy { --flash-color: var(--blue); }

        @keyframes rateFlash {
            0%, 100% { background: var(--surface); border-color: var(--border-2); }
            35% { background: var(--flash-color); border-color: var(--flash-color); }
        }

        /* Done */
        .s-done {
            text-align: center;
            padding: 60px 24px;
            width: 100%;
        }

        .s-done-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .s-done-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 8px;
        }

        .s-done-sub {
            font-size: 14px;
            color: var(--text-2);
            margin-bottom: 28px;
        }

        .btn-home {
            padding: 12px 28px;
            border-radius: 12px;
            background: var(--blue);
            color: #fff;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Flash */
        #flash {
            position: fixed;
            inset: 0;
            pointer-events: none;
            border: 2.5px solid var(--green);
            border-radius: 10px;
            opacity: 0;
            transition: opacity .25s;
            z-index: 50;
        }

        #flash.on {
            opacity: .6;
        }

        /* Verso shown after a card whose back holds more than the typed words */
        /* Verso, shown inside the question card under a separator line
           once the card is done (same look as the card browser) */
        .s-verso {
            display: none;
        }

        .s-verso.on {
            display: block;
        }

        .s-next-btn {
            margin-top: 14px;
            background: none;
            border: 1.5px solid var(--border-2);
            border-radius: 10px;
            padding: 7px 16px;
            color: var(--text-2);
            font-size: 13px;
            cursor: pointer;
        }

        .s-next-btn:hover {
            border-color: var(--navy);
            color: var(--navy);
        }

        /* ── BROWSE (recto → verso, lecture seule) ── */
        #browse {
            min-height: 100vh;
            display: none;
            flex-direction: column;
        }

        .b-count {
            flex: 1;
            font-size: 11px;
            color: var(--text-3);
            text-align: right;
        }

        .b-search {
            width: 100%;
            max-width: 720px;
            margin-bottom: 20px;
            padding: 9px 14px;
            border: 1.5px solid var(--border-2);
            border-radius: 12px;
            background: var(--surface);
            color: var(--text);
            font-size: 14px;
            outline: none;
        }

        .b-search:focus {
            border-color: #93aed6;
        }

        /* Carousel: one slide per card, front + back shown together;
           neighbours peek on both sides, native swipe / trackpad scroll. */
        .b-track {
            width: calc(100% + 48px);
            margin: 0 -24px 18px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            padding: 4px max(24px, calc(50% - 280px)) 12px;
            scrollbar-width: none;
        }

        .b-track::-webkit-scrollbar {
            display: none;
        }

        .b-slide {
            flex: 0 0 min(560px, calc(100% - 48px));
            scroll-snap-align: center;
            margin: 0 !important;
            min-height: 220px;
            opacity: .45;
            transition: opacity .25s;
        }

        .b-slide.active {
            opacity: 1;
        }

        .b-slide-audio {
            display: block;
            margin: 14px auto 0;
            background: none;
            border: 1.5px solid var(--border-2);
            border-radius: 10px;
            padding: 5px 12px;
            font-size: 13px;
            cursor: pointer;
        }

        .b-sep {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 18px 0 12px;
            font-size: 11px;
            color: var(--text-3);
            letter-spacing: .3px;
        }

        .b-sep::before,
        .b-sep::after {
            content: "";
            flex: 1;
            border-top: 1px solid var(--border-2);
        }

        /* Dense list for text decks: front | back, one row per card */
        .b-list {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            border: 1.5px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
        }

        .b-row {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 14px;
            align-items: baseline;
            padding: 7px 14px;
            font-size: 14px;
            line-height: 1.4;
            border-top: 1px solid var(--border);
        }

        .b-row:first-child {
            border-top: none;
        }

        .b-row:nth-child(even) {
            background: var(--surface-hover);
        }

        .b-row-front {
            color: var(--text);
        }

        .b-row-back {
            color: var(--text-2);
            border-left: 1px solid var(--border-2);
            padding-left: 14px;
        }

        .b-row-audio {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 12px;
            padding: 0;
            opacity: .6;
        }

        .b-row-audio:hover {
            opacity: 1;
        }

        .b-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            font-size: 13px;
            color: var(--text-2);
        }

        .b-nav button {
            background: none;
            border: 1.5px solid var(--border-2);
            border-radius: 10px;
            padding: 7px 16px;

        .b-nav button:hover:not(:disabled) {

        .b-nav button:disabled {

        @media (max-width: 520px) {
