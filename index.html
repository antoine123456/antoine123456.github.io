<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anki Trainer</title>
    <style>
        :root {
            --navy: #1e3a5f;
            --green: #16a34a;
            --red: #dc2626;
            --orange: #ea580c;
            --blue: #2563eb;
            --gold: #c8a84b;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #fff;
            color: #111;
            min-height: 100vh;
        }

        /* ── HOME ── */
        #home {
            max-width: 560px;
            margin: 0 auto;
            padding: 52px 24px 80px;
        }

        .h-logo {
            font-size: 36px;
            margin-bottom: 6px;
        }

        .h-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 4px;
        }

        .h-sub {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 36px;
        }

        /* Source list */
        .h-sources {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
        }

        .h-source {
            border: 1.5px solid #f0f0f0;
            border-radius: 14px;
            overflow: hidden;
            transition: border-color .15s;
        }

        .h-source:hover {
            border-color: #d8e0f0;
        }

        .h-source-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 16px;
            cursor: pointer;
            user-select: none;
            background: #fff;
            transition: background .12s;
        }

        .h-source-header:hover {
            background: #f8faff;
        }

        .h-source-name {
            font-size: 14px;
            font-weight: 600;
            color: #111;
            flex: 1;
        }

        .h-source-meta {
            font-size: 11px;
            color: #bbb;
        }

        .h-source-del {
            padding: 3px 8px;
            font-size: 12px;
            color: #ddd;
            background: none;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            transition: color .15s;
            flex-shrink: 0;
        }

        .h-source-export {
            padding: 3px 8px;
            font-size: 12px;
            color: #ddd;
            background: none;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            transition: color .15s;
            flex-shrink: 0;
        }

        .h-source-export:hover {
            color: var(--navy);
        }

        .h-source-del:hover {
            color: var(--red);
        }

        .h-source-arrow {
            font-size: 11px;
            color: #ccc;
            transition: transform .2s;
            flex-shrink: 0;
        }

        .h-source-arrow.open {
            transform: rotate(90deg);
        }

        /* Deck tree inside a source */
        .h-decktree {
            display: none;
            border-top: 1px solid #f5f5f5;
            padding: 8px 0;
        }

        .h-decktree.open {
            display: block;
        }

        .h-deckrow {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            cursor: pointer;
            transition: background .12s;
        }

        .h-deckrow:hover {
            background: #f8faff;
        }

        .h-deckrow-name {
            font-size: 13px;
            color: #333;
            flex: 1;
        }

        .h-deckrow-name.root-deck {
            font-weight: 600;
        }

        .badge {
            padding: 2px 7px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-new {
            background: #eff6ff;
            color: var(--blue);
        }

        .badge-due {
            background: #fff7ed;
            color: var(--orange);
        }

        .badge-done {
            background: #f0fdf4;
            color: var(--green);
        }

        .h-empty {
            font-size: 14px;
            color: #ccc;
            text-align: center;
            padding: 28px 0;
        }

        .h-import-btn {
            width: 100%;
            padding: 13px;
            border: 1.5px dashed #ddd;
            border-radius: 14px;
            background: none;
            font-size: 14px;
            color: #aaa;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: border-color .15s, color .15s;
        }

        .h-import-btn:hover {
            border-color: var(--navy);
            color: var(--navy);
        }

        .h-reset {
            margin-top: 14px;
            text-align: center;
            font-size: 11px;
            color: #ddd;
            cursor: pointer;
            transition: color .15s;
        }

        .h-reset:hover {
            color: var(--red);
        }

        /* ── STUDY ── */
        #study {
            min-height: 100vh;
            display: none;
            flex-direction: column;
        }

        .s-topbar {
            padding: 16px 24px 0;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .s-back {
            background: none;
            border: none;
            color: #bbb;
            cursor: pointer;
            font-size: 13px;
            transition: color .15s;
        }

        .s-back:hover {
            color: var(--navy);
        }

        .s-prog {
            flex: 1;
        }

        .s-prog-label {
            font-size: 11px;
            color: #d0d0d0;
            text-align: right;
            margin-bottom: 5px;
        }

        .s-prog-track {
            height: 2px;
            background: #f0f0f0;
            border-radius: 2px;
        }

        .s-prog-fill {
            height: 100%;
            background: var(--gold);
            border-radius: 2px;
            transition: width .6s cubic-bezier(.4, 0, .2, 1);
        }

        .s-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 36px 24px 84px;
        }

        .s-deck-name {
            font-size: 12px;
            color: #ccc;
            margin-bottom: 24px;
            letter-spacing: .3px;
        }

        /* Bottom counters, à la AnkiDroid: new (blue) / learning (red) / review (green) */
        .s-counts {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            display: flex;
            justify-content: center;
            gap: 26px;
            padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px));
            background: #fff;
            border-top: 1px solid #f0f0f0;
        }

        .s-count {
            font-size: 14px;
            font-weight: 700;
        }

        .s-count-new { color: #2563eb; }
        .s-count-learn { color: var(--red); }
        .s-count-review { color: var(--green); }

        /* Question */
        .s-question {
            width: 100%;
            max-width: 720px;
            border: 1.5px solid #f0f0f0;
            border-radius: 18px;
            padding: 28px 32px;
            margin-bottom: 32px;
            font-size: clamp(18px, 2.8vw, 26px);
            line-height: 1.6;
            color: #222;
            text-align: center;
        }

        .s-question img {
            max-width: 100%;
            border-radius: 8px;
            margin: 8px 0;
        }

        .s-question * {
            font-family: inherit;
        }

        .s-audio-btn {
            display: block;
            margin: 10px auto 0;
            background: none;
            border: 1.5px solid #e5e7eb;
            border-radius: 20px;
            padding: 5px 14px;
            font-size: 14px;
            color: var(--navy);
            cursor: pointer;
            transition: border-color .15s, background .15s;
        }

        .s-audio-btn:hover {
            border-color: var(--navy);
            background: #f8faff;
        }

        /* Word inputs */
        .t-words {
            display: flex;
            flex-wrap: wrap;
            gap: 18px 28px;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            max-width: 720px;
        }

        .word-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .wc-lbl {
            font-family: Georgia, serif;
            font-size: clamp(16px, 2.4vw, 24px);
            min-height: 32px;
            color: #ccc;
        }

        .wc-inp {
            border: none;
            border-bottom: 2.5px solid #d0ccc5;
            background: transparent;
            font-family: Georgia, serif;
            font-size: 17px;
            text-align: center;
            outline: none;
            padding: 2px 4px 7px;
            transition: border-color .2s, color .2s;
            min-width: 48px;
        }

        .wc-inp:focus {
            border-bottom-color: #93aed6;
        }

        .wc-inp.ok {
            border-bottom-color: var(--green);
            color: var(--green);
        }

        .wc-inp.err {
            border-bottom-color: var(--red);
            color: var(--red);
        }

        .wc-inp::placeholder {
            color: #ddd;
        }

        .wc-hint {
            display: none;
            font-family: Georgia, serif;
            font-size: 13px;
            color: #c9922a;
        }

        .wc-attempts {
            font-size: 11px;
            color: var(--red);
            letter-spacing: 1px;
            min-height: 14px;
        }

        .t-actions {
            margin-top: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
            width: 100%;
        }

        .t-show-ans {
            font-size: 11px;
            color: #c9c0b6;
            cursor: pointer;
            letter-spacing: .3px;
            transition: color .15s;
        }

        .t-show-ans:hover {
            color: #c9922a;
        }

        .t-flag {
            font-size: 11px;
            color: #ddd;
            cursor: pointer;
            letter-spacing: .3px;
            transition: color .15s;
        }

        .t-flag:hover {
            color: var(--orange);
        }

        .t-flag.flagged {
            color: var(--orange);
            font-weight: 600;
        }

        .t-key {
            display: inline-block;
            font-size: 9px;
            font-weight: 700;
            color: #aaa;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 1px 4px;
            margin-left: 4px;
            vertical-align: middle;
        }

        /* Anki-style answer buttons, à la anki_ui_after.png */
        .t-ratings {
            margin-top: 22px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .t-rate {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            min-width: 92px;
            padding: 8px 14px;
            border: 1.5px solid #eee;
            border-radius: 12px;
            background: #fff;
            cursor: pointer;
            transition: border-color .15s, background .15s, transform .1s;
        }

        .t-rate:hover {
            transform: translateY(-1px);
        }

        .t-rate:active {
            transform: translateY(0);
        }

        .t-rate .t-key {
            margin-left: 0;
            margin-top: 2px;
        }

        .t-rate-time {
            font-size: 11px;
            color: #bbb;
        }

        .t-rate-label {
            font-size: 13px;
            font-weight: 600;
        }

        .t-rate-again { border-color: #fde2e2; }
        .t-rate-again:hover { background: #fef2f2; border-color: var(--red); }
        .t-rate-again .t-rate-label { color: var(--red); }

        .t-rate-hard { border-color: #fde3c8; }
        .t-rate-hard:hover { background: #fff7ed; border-color: var(--orange); }
        .t-rate-hard .t-rate-label { color: var(--orange); }

        .t-rate-good { border-color: #cdebd8; }
        .t-rate-good:hover { background: #f0fdf4; border-color: var(--green); }
        .t-rate-good .t-rate-label { color: var(--green); }

        .t-rate-easy { border-color: #cfe0fb; }
        .t-rate-easy:hover { background: #eff6ff; border-color: var(--blue); }
        .t-rate-easy .t-rate-label { color: var(--blue); }

        /* Rating pill */
        /* Feedback is the rating button itself flashing its own color,
           fading in then out, instead of a separate popup. */
        .t-rate.rate-flash { animation: rateFlash .7s ease; }
        .t-rate.rate-flash .t-rate-label,
        .t-rate.rate-flash .t-rate-time,
        .t-rate.rate-flash .t-key { color: #fff; }
        .t-rate.rate-flash.t-rate-again { --flash-color: var(--red); }
        .t-rate.rate-flash.t-rate-hard { --flash-color: var(--orange); }
        .t-rate.rate-flash.t-rate-good { --flash-color: var(--green); }
        .t-rate.rate-flash.t-rate-easy { --flash-color: var(--blue); }

        @keyframes rateFlash {
            0%, 100% { background: #fff; border-color: #eee; }
            35% { background: var(--flash-color); border-color: var(--flash-color); }
        }

        /* Done */
        .s-done {
            text-align: center;
            padding: 60px 24px;
            width: 100%;
        }

        .s-done-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .s-done-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 8px;
        }

        .s-done-sub {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 28px;
        }

        .btn-home {
            padding: 12px 28px;
            border-radius: 12px;
            background: var(--navy);
            color: #fff;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Flash */
        #flash {
            position: fixed;
            inset: 0;
            pointer-events: none;
            border: 2.5px solid var(--green);
            border-radius: 10px;
            opacity: 0;
            transition: opacity .25s;
            z-index: 50;
        }

        #flash.on {
            opacity: .6;
        }

        /* Toast */
        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #111;
            color: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            transition: transform .3s;
            z-index: 300;
            pointer-events: none;
            white-space: nowrap;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body>

    <!-- ── HOME ── -->
    <div id="home">
        <div class="h-logo">🃏</div>
        <div class="h-title">Anki Trainer</div>
        <div class="h-sub">Pré-traitez votre .apkg avec <code>extract_apkg.py</code>, puis importez le JSON ici</div>
        <div class="h-sources" id="h-sources"></div>
        <label class="h-import-btn">
            ＋ Importer un fichier .json
            <input type="file" accept=".json" style="display:none" onchange="importJSON(this)">
        </label>
        <div class="h-reset" onclick="resetAppData()">🧹 Effacer les données de cet appareil</div>
    </div>

    <!-- ── STUDY ── -->
    <div id="study">
        <div class="s-topbar">
            <button class="s-back" onclick="goHome()">← Quitter</button>
            <div class="s-prog">
                <div class="s-prog-label" id="prog-label">0 / 0</div>
                <div class="s-prog-track">
                    <div class="s-prog-fill" id="prog-fill" style="width:0%"></div>
                </div>
            </div>
        </div>
        <div class="s-main">
            <div class="s-deck-name" id="s-deck-name"></div>
            <div id="s-content"></div>
        </div>
        <div class="s-counts">
            <span class="s-count s-count-new" id="cnt-new">0</span>
            <span class="s-count s-count-learn" id="cnt-learn">0</span>
            <span class="s-count s-count-review" id="cnt-review">0</span>
        </div>
    </div>

    <div id="flash"></div>
    <div id="toast"></div>
    <audio id="audio-player" preload="none"></audio>

    <script>
        // ═══════════════════════════════════════════════
        // STORAGE
        // ═══════════════════════════════════════════════
        var LS_SOURCES = "ankitrain_v1_sources"; // [{id, name, decks:[{id,name,cardCount}]}]
        var LS_CARDS = "ankitrain_v1_c_";      // + sourceId → {deckId:[cards]}
        var LS_SRS = "ankitrain_v1_s_";      // + sourceId → {cardId: srsMeta}
        var LS_NEWCOUNT = "ankitrain_v1_nc_";     // + sourceId → {day, count}
        var LS_FLAGGED = "ankitrain_v1_fl_";     // + sourceId → {cardId: questionPlainText}
        var NEW_LIMIT = 20;
        var TODAY = dayStamp();

        function dayStamp(d) { d = d || new Date(); return Math.floor(d.getTime() / 86400000); }
        function loadSources() { try { return JSON.parse(localStorage.getItem(LS_SOURCES) || "[]"); } catch (e) { return []; } }
        function saveSources(s) { try { localStorage.setItem(LS_SOURCES, JSON.stringify(s)); } catch (e) { toast("Erreur stockage"); } }
        function loadCards(sid) { try { return JSON.parse(localStorage.getItem(LS_CARDS + sid) || "{}"); } catch (e) { return {}; } }
        function saveCards(sid, c) { try { localStorage.setItem(LS_CARDS + sid, JSON.stringify(c)); } catch (e) { throw new Error("Données trop volumineuses pour le stockage local"); } }
        function loadSRS(sid) { try { return JSON.parse(localStorage.getItem(LS_SRS + sid) || "{}"); } catch (e) { return {}; } }
        function saveSRS(sid, s) { try { localStorage.setItem(LS_SRS + sid, JSON.stringify(s)); } catch (e) { } }

        // How many new cards have actually been INTRODUCED today (first
        // rating of a card that was still "new"), persisted per source so
        // the 20/day limit holds across separate visits/sessions instead of
        // resetting to a fresh 20 every time you open a deck.
        function loadNewCount(sid) {
            try { return JSON.parse(localStorage.getItem(LS_NEWCOUNT + sid) || "null") || { day: TODAY, count: 0 }; }
            catch (e) { return { day: TODAY, count: 0 }; }
        }
        function saveNewCount(sid, nc) { try { localStorage.setItem(LS_NEWCOUNT + sid, JSON.stringify(nc)); } catch (e) { } }
        function remainingNewToday(sid) {
            var nc = loadNewCount(sid);
            var introducedToday = nc.day === TODAY ? nc.count : 0;
            return Math.max(0, NEW_LIMIT - introducedToday);
        }
        function recordNewIntroduced(sid) {
            var nc = loadNewCount(sid);
            if (nc.day !== TODAY) { nc.day = TODAY; nc.count = 0; }
            nc.count++;
            saveNewCount(sid, nc);
        }

        // Cards flagged "à corriger" during study, so they can be fixed
        // directly in real Anki afterward (search "cid:<id>" in its Browse
        // screen to jump straight to one).
        function loadFlagged(sid) {
            try { return JSON.parse(localStorage.getItem(LS_FLAGGED + sid) || "{}"); } catch (e) { return {}; }
        }
        function saveFlagged(sid, fl) { try { localStorage.setItem(LS_FLAGGED + sid, JSON.stringify(fl)); } catch (e) { } }
        function toggleFlagCurrent() {
            if (!sess.sourceId) return;
            var card = sess.queue[sess.qIdx];
            if (!card) return;
            var fl = loadFlagged(sess.sourceId);
            if (fl[card.id]) { delete fl[card.id]; toast("Marque retirée"); }
            else { fl[card.id] = plainText(card.question).slice(0, 200); toast("🚩 Carte marquée à corriger"); }
            saveFlagged(sess.sourceId, fl);
            updateFlagIndicator();
        }
        function updateFlagIndicator() {
            var btn = document.getElementById("s-flag-btn");
            if (!btn || !sess.sourceId) return;
            var card = sess.queue[sess.qIdx];
            var flagged = card && loadFlagged(sess.sourceId)[card.id];
            btn.classList.toggle("flagged", !!flagged);
        }
        function showFlaggedList(e, si) {
            e.stopPropagation();
            var sources = loadSources();
            var src = sources[si];
            var fl = loadFlagged(src.id);
            var ids = Object.keys(fl);
            if (!ids.length) { toast("Aucune carte marquée pour cette source."); return; }
            var lines = ids.map(function (id) { return "cid:" + id + "  —  " + fl[id]; });
            var text = lines.join("\n");
            prompt(ids.length + " carte(s) à corriger dans Anki (Parcourir → coller \"cid:X or cid:Y...\" ou chercher une ligne) :",
                "cid:" + ids.join(" or cid:") + "\n\n" + text);
        }

        // ═══════════════════════════════════════════════
        // SCHEDULER — modeled on Anki's actual default scheduler (new →
        // learning steps → review; lapses → relearning steps), structured
        // after a documented clean-room reference implementation
        // (github.com/vlopezferrando/simple-spaced-repetition), not
        // textbook SM-2. Stock defaults: learning 1m then 10m, relearning
        // 1m then 6m, graduating interval 1d, easy interval 4d, starting
        // ease 2.5, easy bonus 1.5, hard factor 1.2. Within a single
        // browser session there's no real clock wait, so a "due in N
        // minutes" step is approximated by reinserting the card N cards
        // further down the current queue instead.
        // ═══════════════════════════════════════════════
        var GRADUATING_DAYS = 1;
        var EASY_DAYS = 4;
        var EASY_BONUS = 1.5;
        var HARD_FACTOR = 1.2;

        function defaultSRS() {
            return { state: "new", step: 0, interval: 0, ease: 2.5, due: TODAY, reps: 0, lapses: 0, easyCount: 0 };
        }

        // Erreurs sur les mots → note : 0=Facile 1=Correct 2=Difficile 3+=À revoir
        function errorsToRating(e) { return e === 0 ? 4 : e === 1 ? 3 : e === 2 ? 2 : 1; }

        // q: 1=Again 2=Hard 3=Good 4=Easy. ctx.requeueIn (minutes, approximated
        // as "cards later") is set when the card should come back THIS session;
        // left null once it graduates out to day-based review scheduling.
        function applyRating(srs, q, ctx) {
            var s = Object.assign({}, srs);
            s.reps++;
            if (q === 4) s.easyCount = (s.easyCount || 0) + 1;
            if (s.state === "new") s.state = "learning";

            if (s.state === "learning") {
                if (q === 1) { s.step = 0; ctx.requeueIn = 1; }
                else if (q === 2) { s.step = 1; ctx.requeueIn = 6; }
                else if (q === 4) {
                    s.ease = Math.min(4.0, s.ease + 0.15);
                    s.state = "review"; s.step = 0;
                    s.interval = EASY_DAYS; s.due = TODAY + s.interval;
                } else if (s.step === 0) { s.step = 1; ctx.requeueIn = 10; }
                else {
                    s.state = "review"; s.step = 0;
                    s.interval = GRADUATING_DAYS; s.due = TODAY + s.interval;
                }
            } else if (s.state === "relearning") {
                if (q === 1) { s.ease = Math.max(1.3, s.ease - 0.2); ctx.requeueIn = 1; }
                else if (q === 2) { ctx.requeueIn = 6; }
                else if (q === 3) {
                    s.state = "review";
                    s.interval = GRADUATING_DAYS; s.due = TODAY + s.interval;
                } else {
                    s.ease = Math.min(4.0, s.ease + 0.15);
                    s.state = "review";
                    s.interval = EASY_DAYS; s.due = TODAY + s.interval;
                }
            } else { // review
                if (q === 1) {
                    s.lapses++;
                    s.ease = Math.max(1.3, s.ease - 0.2);
                    s.state = "relearning";
                    ctx.requeueIn = 1;
                } else if (q === 2) {
                    s.ease = Math.max(1.3, s.ease - 0.15);
                    s.interval = Math.max(s.interval + 1, Math.round(s.interval * HARD_FACTOR));
                    s.due = TODAY + s.interval;
                } else if (q === 3) {
                    s.interval = Math.max(1, Math.round(s.interval * s.ease));
                    s.due = TODAY + s.interval;
                } else {
                    s.ease = Math.min(4.0, s.ease + 0.15);
                    s.interval = Math.max(1, Math.round(s.interval * s.ease * EASY_BONUS));
                    s.due = TODAY + s.interval;
                }
            }
            return s;
        }

        // ═══════════════════════════════════════════════
        // IMPORT JSON
        // ═══════════════════════════════════════════════
        function importJSON(input) {
            var file = input.files[0]; if (!file) return;
            input.value = "";
            var reader = new FileReader();
            reader.onload = function (e) {
                var data;
                try { data = JSON.parse(e.target.result); } catch (err) { toast("JSON invalide : " + err.message); return; }
                var total = importDeckData(data, file.name.replace(/\.json$/, ""));
                if (total == null) { toast("Format invalide — utilisez extract_apkg.py"); return; }
                toast("✓ " + total + " cartes importées (" + data.decks.length + " deck(s))");
                renderHome();
            };
            reader.readAsText(file);
        }

        // Shared by the file picker and the default-deck auto-load below.
        // Returns the number of cards imported, or null if the JSON shape
        // is invalid.
        function importDeckData(data, fallbackName) {
            if (!data || !data.decks || !Array.isArray(data.decks)) return null;

            var sid = Date.now();
            var sourceName = data.source || fallbackName || "Deck";

            var cardsByDeck = {};
            data.decks.forEach(function (d) { cardsByDeck[d.id] = d.cards || []; });

            var decksMeta = data.decks.map(function (d) {
                return { id: d.id, name: d.name, cardCount: (d.cards || []).length };
            });

            var sources = loadSources();
            sources.push({ id: sid, name: sourceName, decks: decksMeta });
            saveSources(sources);
            saveCards(sid, cardsByDeck);

            // Seed SRS state for cards that already carry real Anki
            // scheduling (extract.py's "srs" field, e.g. from a deck
            // exported with its review history) instead of starting them
            // all as brand new. "dueOffset" is days-from-today at export
            // time, translated to our own day-stamp on import.
            var srs = {};
            data.decks.forEach(function (d) {
                (d.cards || []).forEach(function (c) {
                    if (c.srs) {
                        srs[c.id] = Object.assign({}, c.srs, { due: TODAY + c.srs.dueOffset });
                        delete srs[c.id].dueOffset;
                    }
                });
            });
            if (Object.keys(srs).length) saveSRS(sid, srs);

            return data.decks.reduce(function (n, d) { return n + (d.cards || []).length; }, 0);
        }

        // If no deck has ever been imported yet, try loading a bundled
        // default.json (+ its default_media/ folder) sitting next to
        // index.html — same idea as the old lyrics trainer's built-in
        // songs.json. Silently does nothing if that file isn't there.
        var DEFAULT_DECK_URL = "default.json";
        function loadDefaultDeckIfEmpty() {
            if (loadSources().length) return Promise.resolve(false);
            return fetch(DEFAULT_DECK_URL)
                .then(function (r) { return r.ok ? r.json() : null; })
                .then(function (data) {
                    if (!data) return false;
                    var total = importDeckData(data, "Deck par défaut");
                    if (total != null) { toast("✓ Deck par défaut chargé (" + total + " cartes)"); return true; }
                    return false;
                })
                .catch(function () { return false; });
        }

        // Wipes every localStorage key this app owns (sources, cards, SRS,
        // daily new-card counters) — the actual fix for "a source imported
        // before some bug was fixed still shows the bug": there's no other
        // way to clear that from inside the browser without dev tools.
        function resetAppData() {
            if (!confirm("Effacer toutes les sources importées, la progression et les compteurs quotidiens de cet appareil ? Irréversible.")) return;
            var toRemove = [];
            for (var i = 0; i < localStorage.length; i++) {
                var k = localStorage.key(i);
                if (k && k.indexOf("ankitrain_v1_") === 0) toRemove.push(k);
            }
            toRemove.forEach(function (k) { localStorage.removeItem(k); });
            toast("Données effacées (" + toRemove.length + " entrée(s))");
            loadDefaultDeckIfEmpty().then(renderHome);
        }

        // ═══════════════════════════════════════════════
        // EXPORT STATS (for re-importing progress back into real Anki)
        // ═══════════════════════════════════════════════
        function exportStats(e, si) {
            e.stopPropagation();
            var sources = loadSources();
            var src = sources[si];
            var srs = loadSRS(src.id);
            if (!Object.keys(srs).length) { toast("Aucune progression à exporter pour cette source."); return; }
            var payload = { version: 1, source: src.name, exportedAt: new Date().toISOString(), cards: srs };
            var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
            var url = URL.createObjectURL(blob);
            var a = document.createElement("a");
            a.href = url;
            a.download = src.name.replace(/[^a-z0-9_\-]+/gi, "_") + "_stats.json";
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        }

        // ═══════════════════════════════════════════════
        // DECK TREE HELPERS
        // ═══════════════════════════════════════════════
        function naturalCompare(a, b) {
            return a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" });
        }

        // Build a full-depth tree from "::"-separated deck names (any number
        // of levels, e.g. Root::Child::"Espagnol 7"), sorted numerically so
        // "Espagnol 2" comes before "Espagnol 10".
        function buildDeckTree(decksMeta) {
            var nodes = {}, roots = [];
            decksMeta.forEach(function (d) {
                var parts = d.name.split("::");
                var path = "";
                for (var i = 0; i < parts.length; i++) {
                    var parentPath = path;
                    path = path ? path + "::" + parts[i] : parts[i];
                    if (!nodes[path]) {
                        var node = { name: parts[i], fullName: path, depth: i, children: [] };
                        nodes[path] = node;
                        if (parentPath) nodes[parentPath].children.push(node);
                        else roots.push(node);
                    }
                }
            });
            var sortRec = function (list) {
                list.sort(function (a, b) { return naturalCompare(a.name, b.name); });
                list.forEach(function (n) { sortRec(n.children); });
            };
            sortRec(roots);
            return roots;
        }

        function renderDeckRows(nodes, si, decksMeta, cardsByDeck, srs, newLimit) {
            return nodes.map(function (node) {
                var childIds = childDeckIds(decksMeta, node.fullName);
                var cardIds = allCardIds(cardsByDeck, childIds);
                var stats = deckStats(cardIds, srs, newLimit);
                var html = '<div class="h-deckrow" style="padding-left:' + (16 + node.depth * 20) + 'px" onclick="startStudy(' + si + ',\'' + esc(node.fullName) + '\')">'
                    + (node.depth > 0 ? '<span style="color:#ddd;margin-right:6px;font-size:11px">└</span>' : '')
                    + '<div class="h-deckrow-name' + (node.depth === 0 ? ' root-deck' : '') + '">' + esc(node.name) + '</div>'
                    + (stats.new ? '<span class="badge badge-new">' + stats.new + ' nvx</span>' : '')
                    + (stats.due ? '<span class="badge badge-due">' + stats.due + ' dus</span>' : '')
                    + (stats.learned ? '<span class="badge badge-done">' + stats.learned + ' appris</span>' : '')
                    + '</div>';
                if (node.children.length) html += renderDeckRows(node.children, si, decksMeta, cardsByDeck, srs, newLimit);
                return html;
            }).join("");
        }

        function isChildOf(child, parent) {
            return child === parent || child.startsWith(parent + "::");
        }

        // Get all deck ids that are children of (or equal to) a given deck name
        function childDeckIds(decksMeta, deckName) {
            return decksMeta.filter(function (d) { return isChildOf(d.name, deckName); }).map(function (d) { return d.id; });
        }

        // SRS stats for a set of card ids
        function deckStats(cardIds, srs, newLimit) {
            var newC = 0, due = 0, learned = 0;
            cardIds.forEach(function (cid) {
                var s = srs[cid];
                if (!s || s.state === "new") newC++;
                else if (s.state === "learning" || s.state === "relearning" || s.due <= TODAY) due++;
                else learned++;
            });
            return { new: Math.min(newC, newLimit == null ? NEW_LIMIT : newLimit), due: due, learned: learned };
        }

        // Collect all card ids across a set of deck ids
        function allCardIds(cardsByDeck, deckIds) {
            var ids = [];
            deckIds.forEach(function (did) {
                (cardsByDeck[did] || []).forEach(function (c) { ids.push(c.id); });
            });
            return ids;
        }

        // ═══════════════════════════════════════════════
        // HOME
        // ═══════════════════════════════════════════════
        function renderHome() {
            var sources = loadSources();
            var el = document.getElementById("h-sources");
            if (!sources.length) {
                el.innerHTML = '<div class="h-empty">Aucun deck importé.<br>Pré-traitez votre .apkg avec <code>extract_apkg.py</code> puis importez le JSON.</div>';
                return;
            }

            el.innerHTML = sources.map(function (src, si) {
                var srs = loadSRS(src.id);
                var cardsByDeck = loadCards(src.id);
                var total = src.decks.reduce(function (n, d) { return n + d.cardCount; }, 0);
                var tree = buildDeckTree(src.decks);
                var rows = renderDeckRows(tree, si, src.decks, cardsByDeck, srs, remainingNewToday(src.id));

                return '<div class="h-source">'
                    + '<div class="h-source-header" onclick="toggleSource(this)">'
                    + '<div class="h-source-name">' + esc(src.name) + '</div>'
                    + '<div class="h-source-meta">' + total + ' cartes · ' + src.decks.length + ' deck(s)</div>'
                    + '<button class="h-source-export" onclick="showFlaggedList(event,' + si + ')" title="Cartes marquées à corriger">🚩</button>'
                    + '<button class="h-source-export" onclick="exportStats(event,' + si + ')" title="Exporter les stats">📤</button>'
                    + '<button class="h-source-del" onclick="deleteSource(event,' + si + ')">✕</button>'
                    + '<span class="h-source-arrow open">›</span>'
                    + '</div>'
                    + '<div class="h-decktree open">' + rows + '</div>'
                    + '</div>';
            }).join("");
        }

        function toggleSource(header) {
            var arrow = header.querySelector(".h-source-arrow");
            var tree = header.nextElementSibling;
            var open = tree.classList.toggle("open");
            arrow.classList.toggle("open", open);
        }

        function deleteSource(e, si) {
            e.stopPropagation();
            if (!confirm("Supprimer cette source et toute la progression ?")) return;
            var sources = loadSources();
            var id = sources[si].id;
            sources.splice(si, 1);
            saveSources(sources);
            try { localStorage.removeItem(LS_CARDS + id); } catch (e2) { }
            try { localStorage.removeItem(LS_SRS + id); } catch (e2) { }
            try { localStorage.removeItem(LS_NEWCOUNT + id); } catch (e2) { }
            try { localStorage.removeItem(LS_FLAGGED + id); } catch (e2) { }
            renderHome();
        }

        // ═══════════════════════════════════════════════
        // SESSION STATE
        // ═══════════════════════════════════════════════
        var sess = { sourceIdx: 0, sourceId: null, deckLabel: "", cards: [], queue: [], qIdx: 0, srs: {}, done: 0 };
        var wordRows = [];
        var cardErrors = 0;
        var advancing = false;
        var revealed = false;

        function startStudy(si, deckName) {
            var sources = loadSources();
            var src = sources[si];
            var cardsByDeck = loadCards(src.id);
            var srs = loadSRS(src.id);

            // Collect all cards from deckName and its children
            var childIds = childDeckIds(src.decks, deckName);
            var allCards = [];
            childIds.forEach(function (did) {
                (cardsByDeck[did] || []).forEach(function (c) { allCards.push(c); });
            });

            // Split new vs due (learning/relearning cards are always "due" —
            // they're mid-way through short-term steps, not day-scheduled yet)
            var newCards = [], dueCards = [];
            allCards.forEach(function (c) {
                var s = srs[c.id];
                if (!s || s.state === "new") newCards.push(c);
                else if (s.state === "learning" || s.state === "relearning" || s.due <= TODAY) dueCards.push(c);
            });
            shuffle(newCards); shuffle(dueCards);
            newCards = newCards.slice(0, remainingNewToday(src.id));
            var queue = dueCards.concat(newCards);

            if (!queue.length) { toast("Aucune carte à réviser aujourd'hui 🎉"); return; }

            sess.sourceIdx = si;
            sess.sourceId = src.id;
            sess.deckLabel = deckName.split("::").join(" › ");
            sess.cards = allCards;
            sess.queue = queue;
            sess.qIdx = 0;
            sess.srs = srs;
            sess.done = 0;

            document.getElementById("home").style.display = "none";
            document.getElementById("study").style.display = "flex";
            document.getElementById("s-deck-name").textContent = sess.deckLabel;
            showCard();
        }

        function goHome() {
            saveSRS(sess.sourceId, sess.srs);
            document.getElementById("study").style.display = "none";
            document.getElementById("home").style.display = "block";
            renderHome();
        }

        // ═══════════════════════════════════════════════
        // CARD DISPLAY
        // ═══════════════════════════════════════════════
        function showCard() {
            advancing = false; cardErrors = 0; wordRows = []; revealed = false;
            var card = sess.queue[sess.qIdx];
            if (!card) { showDone(); return; }
            updateProgress();
            updateCounts();

            if (!card.words || !card.words.length) { sess.qIdx++; showCard(); return; }

            var hasAudio = (card.audioQuestion && card.audioQuestion.length) || card.lang;
            var previews = previewIntervals(sess.srs[card.id]);
            document.getElementById("s-content").innerHTML =
                '<div class="s-question">' + card.question
                + (hasAudio ? '<button class="s-audio-btn" onclick="playCardAudio(\'q\')">🔊 Écouter</button>' : '')
                + '</div>'
                + '<div class="t-words" id="t-words"></div>'
                + '<div class="t-actions">'
                + '<span class="t-show-ans" onclick="revealCurrent()">💡 Voir la réponse <span class="t-key">F1</span></span>'
                + '<span class="t-flag" id="s-flag-btn" onclick="toggleFlagCurrent()" title="Marquer à corriger dans Anki">🚩 <span class="t-key">F6</span></span>'
                + '</div>'
                + ratingButtonsHtml(previews);

            buildRows(card.words);
            updateFlagIndicator();
            if (hasAudio) playCardAudio("q");
        }

        // Anki-style answer buttons — the interval preview sits above each
        // one, same layout as Anki's own reviewer.
        function ratingButtonsHtml(previews) {
            var defs = [
                [1, "again", "À revoir", "F2"],
                [3, "good", "Correct", "F3"],
                [2, "hard", "Difficile", "F4"],
                [4, "easy", "Facile", "F5"],
            ];
            return '<div class="t-ratings">' + defs.map(function (d) {
                return '<button class="t-rate t-rate-' + d[1] + '" data-q="' + d[0] + '" onclick="rate(' + d[0] + ')">'
                    + '<span class="t-rate-time">' + previews[d[0]] + '</span>'
                    + '<span class="t-rate-label">' + d[2] + '</span>'
                    + '<span class="t-key">' + d[3] + '</span>'
                    + '</button>';
            }).join('') + '</div>';
        }

        // Plain-color fade-in/fade-out flash on the button that matches the
        // rating actually applied, instead of a separate popup.
        function flashRateButton(q) {
            var btn = document.querySelector('.t-rate[data-q="' + q + '"]');
            if (!btn) return;
            btn.classList.remove("rate-flash");
            void btn.offsetWidth; // restart the animation if it's still running
            btn.classList.add("rate-flash");
        }

        function rate(q) {
            if (advancing) return;
            advancing = true;
            playCardAudio("both", function () { advanceCard(q); });
        }

        // What each rating would do to THIS card right now — shown above the
        // shortcuts, same idea as the time labels above Anki's own answer
        // buttons ("<10m", "1j", "2j"...). Doesn't mutate any real state.
        function formatInterval(days) {
            if (days < 1) return "<1j";
            if (days < 30) return days + "j";
            if (days < 365) return Math.round(days / 30) + "mo";
            return (days / 365).toFixed(1) + "a";
        }
        function formatRequeue(minutes) {
            if (minutes < 60) return "<" + minutes + "m";
            return "<" + Math.round(minutes / 60) + "h";
        }
        function previewIntervals(srs) {
            var base = srs || defaultSRS();
            var out = {};
            [1, 2, 3, 4].forEach(function (q) {
                var ctx = { requeueIn: null };
                var s = applyRating(base, q, ctx);
                out[q] = ctx.requeueIn ? formatRequeue(ctx.requeueIn) : formatInterval(s.interval);
            });
            return out;
        }

        // ═══════════════════════════════════════════════
        // AUDIO
        // ═══════════════════════════════════════════════
        // onDone fires once the whole list has played (or immediately if
        // there's nothing to play, or if playback is blocked/fails) so
        // callers can wait for it before switching to the next card —
        // otherwise the next card's question audio cuts this one off.
        function playAudioList(urls, onDone) {
            var audio = document.getElementById("audio-player");
            if (!urls || !urls.length) { if (onDone) onDone(); return; }
            var i = 0;
            function playNext() {
                if (i >= urls.length) { audio.onended = null; if (onDone) onDone(); return; }
                audio.src = urls[i++];
                var p = audio.play();
                if (p && p.catch) p.catch(playNext);
            }
            audio.onended = playNext;
            playNext();
        }
        function plainText(html) {
            return String(html || "").replace(/<style[\s\S]*?<\/style>/gi, "").replace(/<[^>]*>/g, "").trim();
        }
        // Browser text-to-speech fallback for cards with no recorded audio
        // but a known language — currently words added via cuatroloop/
        // tresloop, which have no real pronunciation clip to fall back on.
        function speakText(text, lang, onDone) {
            if (!text || !window.speechSynthesis) { if (onDone) onDone(); return; }
            window.speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(text);
            u.lang = lang === "fr" ? "fr-FR" : "es-ES";
            if (onDone) { u.onend = onDone; u.onerror = onDone; }
            window.speechSynthesis.speak(u);
        }
        function playCardAudio(which, onDone) {
            var card = sess.queue[sess.qIdx];
            if (!card) { if (onDone) onDone(); return; }
            var urls = which === "both"
                ? (card.audioQuestion || []).concat(card.audioAnswer || [])
                : (which === "a" ? card.audioAnswer : card.audioQuestion);
            if (urls && urls.length) { playAudioList(urls, onDone); return; }
            if (!card.lang) { if (onDone) onDone(); return; }
            var otherLang = card.lang === "es" ? "fr" : "es";
            if (which === "both") {
                speakText(plainText(card.question), card.lang, function () {
                    speakText((card.words || []).join(" "), otherLang, onDone);
                });
            } else if (which === "a") {
                speakText((card.words || []).join(" "), otherLang, onDone);
            } else {
                speakText(plainText(card.question), card.lang, onDone);
            }
        }

        function updateProgress() {
            var total = sess.queue.length;
            var done = Math.min(sess.qIdx, total);
            document.getElementById("prog-label").textContent = done + " / " + total;
            document.getElementById("prog-fill").style.width = Math.round(done / total * 100) + "%";
        }

        // Cards left in the queue (from the current position on), grouped by
        // scheduler state — new (blue) / learning+relearning (red) / review (green).
        function updateCounts() {
            var counts = { new: 0, learning: 0, review: 0 };
            for (var i = sess.qIdx; i < sess.queue.length; i++) {
                var s = sess.srs[sess.queue[i].id];
                var state = s ? s.state : "new";
                if (state === "new") counts.new++;
                else if (state === "learning" || state === "relearning") counts.learning++;
                else counts.review++;
            }
            document.getElementById("cnt-new").textContent = counts.new;
            document.getElementById("cnt-learn").textContent = counts.learning;
            document.getElementById("cnt-review").textContent = counts.review;
        }

        // ═══════════════════════════════════════════════
        // WORD ROWS
        // ═══════════════════════════════════════════════
        function buildRows(words) {
            advancing = false;
            var section = document.getElementById("t-words"); if (!section) return;
            section.innerHTML = ""; wordRows = [];

            words.forEach(function (word, i) {
                var col = document.createElement("div"); col.className = "word-col";
                var lbl = document.createElement("div"); lbl.className = "wc-lbl";
                var inp = document.createElement("input"); inp.className = "wc-inp";
                inp.type = "text"; inp.placeholder = "···";
                inp.autocomplete = "off"; inp.autocorrect = "off"; inp.spellcheck = false;
                inp.style.width = Math.max(word.length * 14, 48) + "px";
                var hint = document.createElement("div"); hint.className = "wc-hint";
                var attempts = document.createElement("div"); attempts.className = "wc-attempts";
                col.append(lbl, inp, hint, attempts);
                section.appendChild(col);

                var entry = { word: word, expected: [word], inp: inp, lbl: lbl, hint: hint, attempts: attempts, solved: false, revealed: false, errors: 0, _errTimer: null };
                wordRows.push(entry);
                inp.addEventListener("input", makeCheck(entry, i));
                inp.addEventListener("keydown", makeKey(i));
            });

            setTimeout(function () { if (wordRows.length) wordRows[0].inp.focus(); }, 60);
        }

        function makeCheck(entry, i) { return function () { liveCheck(entry, i); }; }
        function makeKey(i) {
            return function (e) { if (e.key === "Enter") { e.preventDefault(); focusNext(i); } };
        }

        function norm(s) {
            return s.toLowerCase().trim()
                .replace(/^[¿¡!.,;:'"«»()\[\]\-–—]+|[¿¡!.,;:'"«»()\[\]\-–—]+$/g, "").trim();
        }
        function noAcc(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, ""); }
        function isMatch(input, expected) { var ni = norm(input), ne = norm(expected); return ni === ne || noAcc(ni) === noAcc(ne); }
        function check(entry) {
            if (!entry.inp.value.trim()) return null;
            return entry.expected.some(function (t) { return isMatch(entry.inp.value, t); });
        }

        function liveCheck(entry, i) {
            var r = check(entry);
            if (r === null) {
                clearTimeout(entry._errTimer);
                entry.inp.className = "wc-inp";
                if (!entry.inp.value.trim()) entry.solved = false;
                return;
            }
            if (r) {
                clearTimeout(entry._errTimer);
                entry.inp.className = "wc-inp ok";
                entry.solved = true;
                entry.lbl.textContent = entry.word;
                entry.lbl.style.color = "#16a34a";
                setTimeout(function () { if (!entry.inp.isConnected) return; focusNext(i); }, 220);
            } else {
                entry.inp.className = "wc-inp err";
                entry.solved = false;
                clearTimeout(entry._errTimer);
                entry._errTimer = setTimeout(function () {
                    if (!entry.inp.isConnected || entry.solved) return;
                    entry.errors++;
                    cardErrors = Math.max(cardErrors, entry.errors);
                    entry.attempts.textContent = "✗".repeat(Math.min(entry.errors, 5));
                    if (entry.errors >= 3) revealHint(entry);
                }, 1500);
            }
        }

        function focusNext(i) {
            for (var j = i + 1; j < wordRows.length; j++) { if (!wordRows[j].solved) { wordRows[j].inp.focus(); return; } }
            for (var j = 0; j < i && j < wordRows.length; j++) { if (!wordRows[j].solved) { wordRows[j].inp.focus(); return; } }
            tryComplete();
        }

        function revealHint(entry) {
            entry.hint.textContent = entry.expected[0];
            entry.hint.style.display = "block";
            entry.revealed = true;
        }
        // Reveals only the word at the cursor (or the first not-yet-shown one
        // if nothing has focus) — not the whole card at once. Once nothing
        // is left to reveal, that same shortcut becomes the confirmation to
        // move on: the press that reveals the LAST word just reveals it and
        // stops, so you get to see the fully-revealed card; the NEXT press
        // (with nothing left to reveal) advances. If nothing was ever typed
        // correctly that's tagged Again ("I knew none of this"); if some
        // words were solved and the rest revealed, it goes through the same
        // rating logic as completing normally (this used to only handle the
        // all-revealed case and silently do nothing for a mix of the two).
        function revealCurrent() {
            var entry = wordRows.find(function (e) { return e.inp === document.activeElement && !e.solved && !e.revealed; })
                || wordRows.find(function (e) { return !e.solved && !e.revealed; });
            if (!entry) {
                if (advancing) return;
                var noneSolved = wordRows.length && wordRows.every(function (e) { return !e.solved; });
                if (noneSolved) {
                    advancing = true;
                    playCardAudio("a", function () { flash(function () { advanceCard(1); }); });
                } else {
                    completeCard();
                }
                return;
            }
            revealed = true;
            revealHint(entry);
            entry.lbl.textContent = entry.word;
            entry.lbl.style.color = "#c9922a";
            playCardAudio("a"); // like Anki: audio plays as soon as the answer appears
        }

        function completeCard() {
            if (advancing) return;
            advancing = true;
            var q = revealed ? 2 : errorsToRating(cardErrors);
            playCardAudio("a", function () { flash(function () { advanceCard(q); }); });
        }

        function tryComplete() {
            if (advancing) return;
            if (wordRows.every(function (e) { return e.solved; })) completeCard();
        }

        // ═══════════════════════════════════════════════
        // KEYBOARD SHORTCUTS (study screen only)
        // ═══════════════════════════════════════════════
        // F1 = voir la réponse (au curseur) · F2 = À revoir · F3 = Correct
        // · F4 = Difficile · F5 = Facile — "Facile" is deliberately the
        // farthest from F1 since it schedules the longest interval, so a
        // stray key-repeat or mis-click right after reveal can't trigger it.
        var FKEY_RATING = { F2: 1, F3: 3, F4: 2, F5: 4 };
        document.addEventListener("keydown", function (e) {
            if (document.getElementById("study").style.display !== "flex") return;
            if (e.key === "F1") {
                e.preventDefault();
                revealCurrent();
            } else if (e.key === "F6") {
                e.preventDefault();
                toggleFlagCurrent();
            } else if (FKEY_RATING.hasOwnProperty(e.key)) {
                e.preventDefault();
                rate(FKEY_RATING[e.key]);
            }
        });

        function advanceCard(q) {
            var card = sess.queue[sess.qIdx];
            var wasNew = !sess.srs[card.id] || sess.srs[card.id].state === "new";
            var ctx = { requeueIn: null };
            sess.srs[card.id] = applyRating(sess.srs[card.id] || defaultSRS(), q, ctx);
            if (wasNew) recordNewIntroduced(sess.sourceId);
            sess.done++;
            sess.qIdx++;
            if (ctx.requeueIn) {
                // Not a fixed distance — Anki itself doesn't resurface a
                // learning-step card at an exact position either, it's
                // interleaved with whatever else is due around that time.
                var jitter = 0.6 + Math.random() * 1.0; // 0.6x .. 1.6x
                var offset = Math.max(2, Math.round(ctx.requeueIn * jitter));
                var insertAt = Math.min(sess.queue.length, sess.qIdx + offset);
                sess.queue.splice(insertAt, 0, card);
            }
            flashRateButtonFor(q, sess.srs[card.id]);
            updateCounts();
            var content = document.getElementById("s-content");
            content.style.cssText = "opacity:0;transform:translateY(-10px);transition:opacity .4s,transform .4s";
            setTimeout(function () {
                content.style.cssText = "opacity:0;transform:translateY(10px);transition:none";
                content.offsetHeight;
                content.style.cssText = "opacity:1;transform:translateY(0);transition:opacity .4s,transform .4s";
                showCard();
            }, 400);
        }

        function flash(cb) {
            var f = document.getElementById("flash");
            f.classList.add("on");
            setTimeout(function () { f.classList.remove("on"); }, 350);
            setTimeout(cb, 400);
        }

        // The rating itself (and scheduling) is unaffected — this only
        // softens the *feedback*: flashing "Facile" is held back until a
        // card has actually been aced on the first try a few times, the
        // "Correct" button flashes instead for the first three.
        function flashRateButtonFor(q, srs) {
            var showAsGood = q === 4 && srs && (srs.easyCount || 0) <= 3;
            flashRateButton(showAsGood ? 3 : q);
        }

        function showDone() {
            saveSRS(sess.sourceId, sess.srs);
            document.getElementById("s-content").innerHTML =
                '<div class="s-done">'
                + '<div class="s-done-icon">🎉</div>'
                + '<div class="s-done-title">Session terminée !</div>'
                + '<div class="s-done-sub">' + sess.done + ' cartes révisées aujourd\'hui</div>'
                + '<button class="btn-home" onclick="goHome()">← Retour</button>'
                + '</div>';
            document.getElementById("prog-fill").style.width = "100%";
            document.getElementById("prog-label").textContent = sess.done + " / " + sess.done;
        }

        // ═══════════════════════════════════════════════
        // UTILS
        // ═══════════════════════════════════════════════
        function esc(s) { return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/'/g, "&#39;"); }
        function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

        var _toastTimer;
        function toast(msg) {
            var el = document.getElementById("toast");
            el.textContent = msg; el.classList.add("show");
            clearTimeout(_toastTimer);
            _toastTimer = setTimeout(function () { el.classList.remove("show"); }, 3500);
        }

        // ── INIT ──
        loadDefaultDeckIfEmpty().then(renderHome);
    </script>
</body>

</html>
