<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase · diagnostic</title>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg: #fff;
            --surface: #fafafa;
            --text: #1a1a1a;
            --text-2: #777;
            --border: #e5e7eb;
            --ok: #16a34a;
            --ko: #dc2626;
            --wait: #ca8a04;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #131417;
                --surface: #1b1d21;
                --text: #eee;
                --text-2: #8b8f96;
                --border: #2a2d33;
                --ok: #4ade80;
                --ko: #f87171;
                --wait: #facc15;
            }
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            max-width: 720px;
            margin: 0 auto;
            padding: 24px 16px 60px;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 2px;
        }

        .sub {
            color: var(--text-2);
            font-size: 13px;
            margin-bottom: 18px;
        }

        .sub a {
            color: inherit;
        }

        .row {
            display: grid;
            grid-template-columns: 18px 150px 1fr;
            gap: 10px;
            align-items: baseline;
            padding: 8px 12px;
            border-top: 1px solid var(--border);
        }

        .rows {
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
        }

        .rows .row:first-child {
            border-top: none;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-2);
            display: inline-block;
        }

        .dot.ok { background: var(--ok); }
        .dot.ko { background: var(--ko); }
        .dot.wait { background: var(--wait); }

        .label {
            color: var(--text-2);
        }

        .val {
            word-break: break-word;
        }

        .hint {
            color: var(--ko);
            font-size: 12px;
            margin-top: 2px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 16px 0;
        }

        button {
            border: 1.5px solid var(--border);
            background: var(--surface);
            color: var(--text);
            border-radius: 999px;
            padding: 7px 14px;
            font-size: 13px;
            cursor: pointer;
        }

        button:disabled {
            opacity: .4;
            cursor: default;
        }

        pre {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 12px;
            max-height: 320px;
            overflow: auto;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>
    <main>
        <h1>Firebase · diagnostic</h1>
        <div class="sub">Branche <b>firebase-debug</b> — état de la connexion uniquement. L'appli : <a href="app.html">app.html</a></div>

        <div class="rows" id="rows"></div>

        <div class="actions">
            <button id="b-signin" onclick="signIn()">Se connecter avec Google</button>
            <button id="b-signout" onclick="signOut()">Se déconnecter</button>
            <button id="b-read" onclick="testRead()">Tester la lecture Firestore</button>
            <button id="b-write" onclick="testWrite()">Tester l'écriture Firestore</button>
            <button onclick="copyLog()">Copier le journal</button>
        </div>

        <pre id="log"></pre>
    </main>

    <script>
        // Même configuration que l'appli (app.html).
        var FIREBASE_CONFIG = {
            apiKey: "AIzaSyDMn9fYdjo3rpo2k1Q89pQ2dsIi12c0kJk",
            authDomain: "type-in-anki.firebaseapp.com",
            projectId: "type-in-anki",
            storageBucket: "type-in-anki.firebasestorage.app",
            messagingSenderId: "295848150298",
            appId: "1:295848150298:web:24c322ba3faa57374158a3"
        };

        // Explications des erreurs les plus courantes.
        var HINTS = {
            "auth/unauthorized-domain": "Ajouter « " + location.hostname + " » dans Firebase Console → Authentication → Settings → Authorized domains.",
            "auth/operation-not-allowed": "Activer le fournisseur Google dans Firebase Console → Authentication → Sign-in method.",
            "auth/popup-blocked": "Le navigateur a bloqué la fenêtre de connexion : autoriser les pop-ups pour ce site.",
            "auth/popup-closed-by-user": "Fenêtre de connexion fermée avant la fin.",
            "auth/network-request-failed": "Pas de réseau, ou requête bloquée (bloqueur de pub, pare-feu).",
            "auth/api-key-not-valid.-please-pass-a-valid-api-key.": "Clé API invalide : vérifier apiKey dans la configuration.",
            "permission-denied": "Refusé par les règles Firestore : vérifier Firestore → Rules (ex. accès à users/{uid} pour l'utilisateur connecté).",
            "unavailable": "Firestore injoignable (hors ligne ou base non créée).",
            "failed-precondition": "Base Firestore absente ou pas encore créée pour ce projet.",
            "not-found": "Document absent (normal si rien n'a encore été écrit)."
        };

        var state = {};
        function set(key, label, status, value, hint) {
            state[key] = { label: label, status: status, value: value, hint: hint || "" };
            render();
        }
        function render() {
            document.getElementById("rows").innerHTML = Object.keys(state).map(function (k) {
                var s = state[k];
                return '<div class="row"><span class="dot ' + s.status + '"></span><span class="label">' + s.label
                    + '</span><span class="val">' + s.value + (s.hint ? '<div class="hint">' + s.hint + '</div>' : '') + '</span></div>';
            }).join("");
            var signedIn = state.auth && state.auth.status === "ok";
            document.getElementById("b-signin").disabled = !window.fbAuth || signedIn;
            document.getElementById("b-signout").disabled = !signedIn;
            document.getElementById("b-read").disabled = !window.fbDb;
            document.getElementById("b-write").disabled = !window.fbDb;
        }
        function log(msg, err) {
            var line = new Date().toLocaleTimeString() + "  " + msg + (err ? "  [" + (err.code || err.name || "") + "] " + (err.message || err) : "");
            var el = document.getElementById("log");
            el.textContent = line + "\n" + el.textContent;
            (err ? console.error : console.log)(line);
        }
        function hintFor(err) {
            return err && (HINTS[err.code] || HINTS[(err.code || "").replace(/^firestore\//, "")]) || "";
        }
        function copyLog() {
            navigator.clipboard.writeText(document.getElementById("log").textContent).then(function () { log("journal copié"); });
        }

        // ── Environnement ──
        set("page", "Page", "ok", location.href);
        set("net", "Réseau", navigator.onLine ? "ok" : "ko", navigator.onLine ? "en ligne" : "hors ligne");
        window.addEventListener("online", function () { set("net", "Réseau", "ok", "en ligne"); log("réseau : en ligne"); });
        window.addEventListener("offline", function () { set("net", "Réseau", "ko", "hors ligne"); log("réseau : hors ligne"); });

        // ── SDK + configuration + initialisation ──
        if (!window.firebase) {
            set("sdk", "SDK Firebase", "ko", "non chargé", "Les scripts gstatic.com n'ont pas pu être chargés (réseau, bloqueur).");
            log("SDK Firebase non chargé");
        } else {
            set("sdk", "SDK Firebase", "ok", "chargé — version " + firebase.SDK_VERSION);
            set("config", "Configuration", "ok", "projet « " + FIREBASE_CONFIG.projectId + " » · authDomain " + FIREBASE_CONFIG.authDomain);
            try {
                firebase.initializeApp(FIREBASE_CONFIG);
                window.fbAuth = firebase.auth();
                window.fbDb = firebase.firestore();
                set("init", "Initialisation", "ok", "firebase.initializeApp OK");
                log("initialisation OK");
            } catch (e) {
                set("init", "Initialisation", "ko", e.message, hintFor(e));
                log("initialisation échouée", e);
            }
        }

        // ── Authentification ──
        if (window.fbAuth) {
            set("auth", "Authentification", "wait", "en attente de l'état…");
            fbAuth.onAuthStateChanged(function (u) {
                if (u) {
                    set("auth", "Authentification", "ok", "connecté : " + (u.email || "(sans e-mail)") + "<br><span class='label'>uid " + u.uid + " · " + u.providerData.map(function (p) { return p.providerId; }).join(", ") + "</span>");
                    log("connecté : " + (u.email || u.uid));
                } else {
                    set("auth", "Authentification", "ko", "non connecté");
                    log("non connecté");
                }
            }, function (e) {
                set("auth", "Authentification", "ko", e.message, hintFor(e));
                log("erreur d'authentification", e);
            });
            fbAuth.getRedirectResult().catch(function (e) {
                set("auth", "Authentification", "ko", e.message, hintFor(e));
                log("retour de connexion", e);
            });
        }
        function signIn() {
            log("connexion Google…");
            fbAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function (e) {
                set("auth", "Authentification", "ko", e.message, hintFor(e));
                log("connexion échouée", e);
            });
        }
        function signOut() {
            fbAuth.signOut().then(function () { log("déconnecté"); });
        }

        // ── Firestore ──
        function docRef() {
            var u = fbAuth && fbAuth.currentUser;
            return u ? fbDb.collection("users").doc(u.uid) : fbDb.collection("debug").doc("ping");
        }
        function testRead() {
            var ref = docRef();
            log("lecture " + ref.path + "…");
            set("read", "Lecture Firestore", "wait", ref.path + " …");
            ref.get().then(function (snap) {
                set("read", "Lecture Firestore", "ok", ref.path + " — " + (snap.exists ? "document trouvé (" + Object.keys(snap.data()).length + " champ(s))" : "document absent (lecture autorisée)")
                    + " · " + (snap.metadata.fromCache ? "depuis le cache" : "depuis le serveur"));
                log("lecture OK : " + (snap.exists ? JSON.stringify(snap.data()).slice(0, 200) : "document absent"));
            }).catch(function (e) {
                set("read", "Lecture Firestore", "ko", ref.path + " — " + e.message, hintFor(e));
                log("lecture échouée", e);
            });
        }
        function testWrite() {
            var ref = docRef();
            var data = { debugPing: firebase.firestore.FieldValue.serverTimestamp(), debugFrom: location.hostname };
            log("écriture " + ref.path + "…");
            set("write", "Écriture Firestore", "wait", ref.path + " …");
            ref.set(data, { merge: true }).then(function () {
                set("write", "Écriture Firestore", "ok", ref.path + " — champs debugPing / debugFrom écrits (merge)");
                log("écriture OK");
            }).catch(function (e) {
                set("write", "Écriture Firestore", "ko", ref.path + " — " + e.message, hintFor(e));
                log("écriture échouée", e);
            });
        }
        render();
    </script>
</body>

</html>
