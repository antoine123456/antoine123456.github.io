        /* Toast */
        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #111;
            color: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            transition: transform .3s;
            z-index: 300;
            pointer-events: none;
            white-space: nowrap;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body>

    <!-- ── HOME ── -->
    <div id="home">
        <button class="h-theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Basculer clair/sombre">🌙</button>
        <div class="h-logo">🃏</div>
        <div class="h-title">Anki Trainer</div>
        <div class="h-sub">Pré-traitez votre .apkg avec <code>extract_apkg.py</code>, puis importez le JSON ici</div>
        <div class="h-sources" id="h-sources"></div>
        <label class="h-import-btn">
            ＋ Importer un fichier .json
            <input type="file" accept=".json" style="display:none" onchange="importJSON(this)">
        </label>
        <div class="h-reset" onclick="resetAppData()">🧹 Effacer les données de cet appareil</div>
    </div>

    <!-- ── STUDY ── -->
    <div id="study">
        <div class="s-topbar">
            <button class="s-back" onclick="goHome()">← Quitter</button>
            <div class="s-prog">
                <div class="s-prog-label" id="prog-label">0 / 0</div>
                <div class="s-prog-track">
                    <div class="s-prog-fill" id="prog-fill" style="width:0%"></div>
                </div>
            </div>
        </div>
        <div class="s-main">
            <div class="s-deck-name" id="s-deck-name"></div>
            <div id="s-content"></div>
        </div>
        <div class="s-counts">
            <span class="s-count s-count-new" id="cnt-new">0</span>
            <span class="s-count s-count-learn" id="cnt-learn">0</span>
            <span class="s-count s-count-review" id="cnt-review">0</span>
        </div>
    </div>

    <div id="flash"></div>
    <div id="toast"></div>
    <!-- ── BROWSE ── -->
    <div id="browse">
        <div class="s-topbar">
            <button class="s-back" onclick="closeBrowse()">← Retour</button>
            <div class="b-count" id="b-count">0 / 0</div>
        </div>
        <div class="s-main">
            <div class="s-deck-name" id="b-deck-name"></div>
            <input class="b-search" id="b-search" type="search" placeholder="🔎 Rechercher…" oninput="filterBrowse(this.value)">
            <div id="b-content" style="width:100%"></div>
        </div>
    </div>

    <audio id="audio-player" preload="none"></audio>

    <script>
        // ═══════════════════════════════════════════════
        // FIREBASE (optional — Google sign-in + cloud sync)
        // ═══════════════════════════════════════════════
        // Paste your own project's values here to enable sync. Not a secret:
        // this is meant to be public in client code.
        //
        // There is currently no way to actually sign in — a name-picking
        // dropdown was tried and dropped (no real auth behind it meant every
        // id needed manual allow-listing in the Firestore rules for each
        // new person, not worth it), and real Google sign-in is intended
        // for later (see the `auth` branch, which already has a working
        // implementation). Everything below stays wired up and dormant in
        // the meantime: fbUser is never set, so scheduleSync()/flushSync()
        // (guarded by `if (!fbUser) return`) never fire, and the app is
        // pure localStorage — but the Firestore database, its users/{uid}
        // schema, and all the push/merge logic are ready to go the moment
        // something sets fbUser again.
        var FIREBASE_CONFIG = {
            apiKey: "AIzaSyDMn9fYdjo3rpo2k1Q89pQ2dsIi12c0kJk",
            authDomain: "type-in-anki.firebaseapp.com",
            projectId: "type-in-anki",
            storageBucket: "type-in-anki.firebasestorage.app",
            messagingSenderId: "295848150298",
            appId: "1:295848150298:web:24c322ba3faa57374158a3"
        };
        var FIREBASE_ENABLED = !!(FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey
            && FIREBASE_CONFIG.apiKey.indexOf("PASTE") === -1
            && window.firebase);

        var fbDb = null, fbUser = null;
        if (FIREBASE_ENABLED) {
            try {
                firebase.initializeApp(FIREBASE_CONFIG);
                fbDb = firebase.firestore();
                try { fbDb.enablePersistence({ synchronizeTabs: true }).catch(function () { }); } catch (e) { }
            } catch (e) {
                FIREBASE_ENABLED = false;
                console.error("Firebase init failed:", e);
            }
        }

        // ═══════════════════════════════════════════════
        // STORAGE
        // ═══════════════════════════════════════════════
        var LS_SOURCES = "ankitrain_v1_sources"; // [{id, name, decks:[{id,name,cardCount}]}]
        var LS_CARDS = "ankitrain_v1_c_";      // + sourceId → {deckId:[cards]}
        var LS_SRS = "ankitrain_v1_s_";      // + sourceId → {cardId: srsMeta}
        var LS_NEWCOUNT = "ankitrain_v1_nc_";     // + sourceId → {day, count}
        var LS_FLAGGED = "ankitrain_v1_fl_";     // + sourceId → {cardId: questionPlainText}
        var LS_STYLES = "ankitrain_v1_css_";    // + sourceId → [css shared by cards, see card.style]
        var LS_THEME = "ankitrain_v1_theme";    // "light" | "dark" | absent (follow system)
        var NEW_LIMIT = 20;

        // Manual override on top of the CSS @media(prefers-color-scheme)
        // default. Absent = follow the system/browser setting.
        function applyTheme() {
            var saved = null;
            try { saved = localStorage.getItem(LS_THEME); } catch (e) { }
            if (saved === "light" || saved === "dark") {
                document.documentElement.setAttribute("data-theme", saved);
            } else {
                document.documentElement.removeAttribute("data-theme");
            }
        }
        function isDarkNow() {
            var saved = null;
            try { saved = localStorage.getItem(LS_THEME); } catch (e) { }
            if (saved === "light" || saved === "dark") return saved === "dark";
            return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        }
        function toggleTheme() {
            var next = isDarkNow() ? "light" : "dark";
            try { localStorage.setItem(LS_THEME, next); } catch (e) { }
            applyTheme();
            updateThemeToggleIcon();
        }
        function updateThemeToggleIcon() {
            var btn = document.getElementById("theme-toggle");
            if (btn) btn.textContent = isDarkNow() ? "☀️" : "🌙";
        }
        applyTheme();
        var TODAY = dayStamp();

        function dayStamp(d) { d = d || new Date(); return Math.floor(d.getTime() / 86400000); }
        function loadSources() { try { return JSON.parse(localStorage.getItem(LS_SOURCES) || "[]"); } catch (e) { return []; } }
        function saveSources(s) { try { localStorage.setItem(LS_SOURCES, JSON.stringify(s)); } catch (e) { toast("Erreur stockage"); } scheduleSync(); }
        function loadCards(sid) { try { return JSON.parse(localStorage.getItem(LS_CARDS + sid) || "{}"); } catch (e) { return {}; } }
        function saveCards(sid, c) { try { localStorage.setItem(LS_CARDS + sid, JSON.stringify(c)); } catch (e) { throw new Error("Données trop volumineuses pour le stockage local"); } scheduleSync(); }
        function loadSRS(sid) { try { return JSON.parse(localStorage.getItem(LS_SRS + sid) || "{}"); } catch (e) { return {}; } }
        function saveSRS(sid, s) { try { localStorage.setItem(LS_SRS + sid, JSON.stringify(s)); } catch (e) { } scheduleSync(); }

        // How many new cards have actually been INTRODUCED today (first
        // rating of a card that was still "new"), persisted per source so
        // the 20/day limit holds across separate visits/sessions instead of
        // resetting to a fresh 20 every time you open a deck.
        function loadNewCount(sid) {
            try { return JSON.parse(localStorage.getItem(LS_NEWCOUNT + sid) || "null") || { day: TODAY, count: 0 }; }
            catch (e) { return { day: TODAY, count: 0 }; }
        }
        function saveNewCount(sid, nc) { try { localStorage.setItem(LS_NEWCOUNT + sid, JSON.stringify(nc)); } catch (e) { } scheduleSync(); }
        function remainingNewToday(sid) {
            var nc = loadNewCount(sid);
            var introducedToday = nc.day === TODAY ? nc.count : 0;
            return Math.max(0, NEW_LIMIT - introducedToday);
        }
        function recordNewIntroduced(sid) {
            var nc = loadNewCount(sid);
            if (nc.day !== TODAY) { nc.day = TODAY; nc.count = 0; }
            nc.count++;
            saveNewCount(sid, nc);
        }

        // Cards flagged "à corriger" during study, so they can be fixed
        // directly in real Anki afterward (search "cid:<id>" in its Browse
        // screen to jump straight to one).
        function loadStyles(sid) { try { return JSON.parse(localStorage.getItem(LS_STYLES + sid) || "[]"); } catch (e) { return []; } }
        function cardStyle(sid, card) { return card.style != null ? (loadStyles(sid)[card.style] || "") : ""; }
        function loadFlagged(sid) {
            try { return JSON.parse(localStorage.getItem(LS_FLAGGED + sid) || "{}"); } catch (e) { return {}; }
        }
        function saveFlagged(sid, fl) { try { localStorage.setItem(LS_FLAGGED + sid, JSON.stringify(fl)); } catch (e) { } scheduleSync(); }
        function toggleFlagCurrent() {
            if (!sess.sourceId) return;
            var card = sess.queue[sess.qIdx];
            if (!card) return;
            var fl = loadFlagged(sess.sourceId);
            if (fl[card.id]) { delete fl[card.id]; toast("Marque retirée"); }
            else { fl[card.id] = plainText(card.question).slice(0, 200); toast("🚩 Carte marquée à corriger"); }
            saveFlagged(sess.sourceId, fl);
            updateFlagIndicator();
        }
        function updateFlagIndicator() {
            var btn = document.getElementById("s-flag-btn");
            if (!btn || !sess.sourceId) return;
            var card = sess.queue[sess.qIdx];
            var flagged = card && loadFlagged(sess.sourceId)[card.id];
            btn.classList.toggle("flagged", !!flagged);
        }
        function showFlaggedList(e, si) {
            e.stopPropagation();
            var sources = loadSources();
            var src = sources[si];
            var fl = loadFlagged(src.id);
            var ids = Object.keys(fl);
            if (!ids.length) { toast("Aucune carte marquée pour cette source."); return; }
            var lines = ids.map(function (id) { return "cid:" + id + "  —  " + fl[id]; });
            var text = lines.join("\n");
            prompt(ids.length + " carte(s) à corriger dans Anki (Parcourir → coller \"cid:X or cid:Y...\" ou chercher une ligne) :",
                "cid:" + ids.join(" or cid:") + "\n\n" + text);
        }

        // ═══════════════════════════════════════════════
        // SCHEDULER — modeled on Anki's actual default scheduler (new →
        // learning steps → review; lapses → relearning steps), structured
        // after a documented clean-room reference implementation
        // (github.com/vlopezferrando/simple-spaced-repetition), not
        // textbook SM-2. Stock defaults: learning 1m then 10m, relearning
        // 1m then 6m, graduating interval 1d, easy interval 4d, starting
        // ease 2.5, easy bonus 1.5, hard factor 1.2. Within a single
        // browser session there's no real clock wait, so a "due in N
        // minutes" step is approximated by reinserting the card N cards
        // further down the current queue instead.
        // ═══════════════════════════════════════════════
        var GRADUATING_DAYS = 1;
        var EASY_DAYS = 4;
        var EASY_BONUS = 1.5;
        var HARD_FACTOR = 1.2;

        function defaultSRS() {
            return { state: "new", step: 0, interval: 0, ease: 2.5, due: TODAY, reps: 0, lapses: 0, easyCount: 0 };
        }

        // q: 1=Again 2=Hard 3=Good 4=Easy. ctx.requeueIn (minutes, approximated
        // as "cards later") is set when the card should come back THIS session;
        // left null once it graduates out to day-based review scheduling.
        function applyRating(srs, q, ctx) {
            var s = Object.assign({}, srs);
            s.reps++;
            if (q === 4) s.easyCount = (s.easyCount || 0) + 1;
            if (s.state === "new") s.state = "learning";

            if (s.state === "learning") {
                if (q === 1) { s.step = 0; ctx.requeueIn = 1; }
                else if (q === 2) { s.step = 1; ctx.requeueIn = 6; }
                else if (q === 4) {
                    s.ease = Math.min(4.0, s.ease + 0.15);
                    s.state = "review"; s.step = 0;
                    s.interval = EASY_DAYS; s.due = TODAY + s.interval;
                } else if (s.step === 0) { s.step = 1; ctx.requeueIn = 10; }
                else {
                    s.state = "review"; s.step = 0;
                    s.interval = GRADUATING_DAYS; s.due = TODAY + s.interval;
                }
            } else if (s.state === "relearning") {
                if (q === 1) { s.ease = Math.max(1.3, s.ease - 0.2); ctx.requeueIn = 1; }
                else if (q === 2) { ctx.requeueIn = 6; }
                else if (q === 3) {
                    s.state = "review";
                    s.interval = GRADUATING_DAYS; s.due = TODAY + s.interval;
                } else {
                    s.ease = Math.min(4.0, s.ease + 0.15);
                    s.state = "review";
                    s.interval = EASY_DAYS; s.due = TODAY + s.interval;
                }
            } else { // review
                if (q === 1) {
                    s.lapses++;
                    s.ease = Math.max(1.3, s.ease - 0.2);
                    s.state = "relearning";
                    ctx.requeueIn = 1;
                } else if (q === 2) {
                    s.ease = Math.max(1.3, s.ease - 0.15);
                    s.interval = Math.max(s.interval + 1, Math.round(s.interval * HARD_FACTOR));
                    s.due = TODAY + s.interval;
                } else if (q === 3) {
                    s.interval = Math.max(1, Math.round(s.interval * s.ease));
                    s.due = TODAY + s.interval;
                } else {
                    s.ease = Math.min(4.0, s.ease + 0.15);
                    s.interval = Math.max(1, Math.round(s.interval * s.ease * EASY_BONUS));
                    s.due = TODAY + s.interval;
                }
            }
            return s;
        }

        // ═══════════════════════════════════════════════
        // IMPORT JSON
        // ═══════════════════════════════════════════════
        function importJSON(input) {
            var file = input.files[0]; if (!file) return;
            input.value = "";
            var reader = new FileReader();
            reader.onload = function (e) {
                var data;
                try { data = JSON.parse(e.target.result); } catch (err) { toast("JSON invalide : " + err.message); return; }
                var total;
                try { total = importDeckData(data, file.name.replace(/\.json$/, "")); }
                catch (err) { toast("Import impossible : " + err.message); return; }
                if (total == null) { toast("Format invalide — utilisez extract_apkg.py"); return; }
                toast("✓ " + total + " cartes importées (" + data.decks.length + " deck(s))");
                renderHome();
            };
            reader.readAsText(file);
        }

        // Shared by the file picker and the default-deck auto-load below.
        // Returns the number of cards imported, or null if the JSON shape
        // is invalid.
        function importDeckData(data, fallbackName, forcedId, isDefault) {
            if (!data || !data.decks || !Array.isArray(data.decks)) return null;

            var sid = forcedId || Date.now();
            var sourceName = data.source || fallbackName || "Deck";

            var cardsByDeck = {};
            data.decks.forEach(function (d) { cardsByDeck[d.id] = d.cards || []; });

            var decksMeta = data.decks.map(function (d) {
                return { id: d.id, name: d.name, cardCount: (d.cards || []).length };
            });

            // Cards first: if they don't fit in localStorage, saveCards
            // throws before an empty source gets listed on the home screen.
            saveCards(sid, cardsByDeck);
            var sources = loadSources();
            sources.push({ id: sid, name: sourceName, decks: decksMeta, isDefault: !!isDefault });
            saveSources(sources);

            // Seed SRS state for cards that already carry real Anki
            // scheduling (extract.py's "srs" field, e.g. from a deck
            // exported with its review history) instead of starting them
            // all as brand new. "dueOffset" is days-from-today at export
            // time, translated to our own day-stamp on import.
            var srs = {};
            data.decks.forEach(function (d) {
                (d.cards || []).forEach(function (c) {
                    if (c.srs) {
                        srs[c.id] = Object.assign({}, c.srs, { due: TODAY + c.srs.dueOffset });
                        delete srs[c.id].dueOffset;
                    }
                });
            });
            if (Object.keys(srs).length) saveSRS(sid, srs);

            return data.decks.reduce(function (n, d) { return n + (d.cards || []).length; }, 0);
        }

        // If no deck has ever been imported yet, try loading a bundled
        // default.json (+ its default_media/ folder) sitting next to
        // index.html — same idea as the old lyrics trainer's built-in
        // songs.json. Silently does nothing if that file isn't there.
        var DEFAULT_DECK_URL = "default.json";
        function loadDefaultDeckIfEmpty() {
            // default.json used to say "source": "out" (extract.py's --out
            // name); fix the label already stored on existing devices.
            var srcs = loadSources();
            var def = srcs.find(function (s) { return s.id === "default" && s.name === "out"; });
            if (def) { def.name = "Espagnol"; saveSources(srcs); }
            if (srcs.length) return Promise.resolve(false);
            return fetch(DEFAULT_DECK_URL)
                .then(function (r) { return r.ok ? r.json() : null; })
                .then(function (data) {
                    if (!data) return false;
                    // Stable id (not Date.now()) so cloud sync recognizes
                    // this same bundled deck across different devices.
                    var total = importDeckData(data, "Deck par défaut", "default", true);
                    if (total != null) { toast("✓ Deck par défaut chargé (" + total + " cartes)"); return true; }
                    return false;
                })
                .catch(function () { return false; });
        }

        // Other bundled decks (generated with extract.py, images as web
        // links so nothing is hosted here). Each one is loaded once per
        // browser — even if default.json is already there — and not again
        // after being deleted, until "Effacer les données" resets it all.
        var EXTRA_BUNDLED = [{ url: "arbres.json", id: "arbres" }];
        var LS_BUNDLED_SEEN = "ankitrain_v1_bundled_seen";
        function loadExtraBundledDecks() {
            var seen;
            try { seen = JSON.parse(localStorage.getItem(LS_BUNDLED_SEEN) || "[]"); } catch (e) { seen = []; }
            var have = loadSources().map(function (s) { return String(s.id); });
            var todo = EXTRA_BUNDLED.filter(function (b) { return seen.indexOf(b.id) === -1; });
            return Promise.all(todo.map(function (b) {
                if (have.indexOf(b.id) !== -1) return b.id;
                return fetch(b.url)
                    .then(function (r) { return r.ok ? r.json() : null; })
                    .then(function (data) {
                        if (!data) return null;
                        var total = importDeckData(data, b.id, b.id, false);
                        if (total != null) toast("✓ " + (data.source || b.id) + " chargé (" + total + " cartes)");
                        return total != null ? b.id : null;
                    })
                    .catch(function () { return null; });
            })).then(function (ids) {
                ids.forEach(function (id) { if (id && seen.indexOf(id) === -1) seen.push(id); });
                try { localStorage.setItem(LS_BUNDLED_SEEN, JSON.stringify(seen)); } catch (e) { }
            });
        }

        // Wipes every localStorage key this app owns (sources, cards, SRS,
        // daily new-card counters) — the actual fix for "a source imported
        // before some bug was fixed still shows the bug": there's no other
        // way to clear that from inside the browser without dev tools.
        function resetAppData() {
            if (!confirm("Effacer toutes les sources importées, la progression et les compteurs quotidiens de cet appareil ? Irréversible.")) return;
            var toRemove = [];
            for (var i = 0; i < localStorage.length; i++) {
                var k = localStorage.key(i);
                if (k && k.indexOf("ankitrain_v1_") === 0) toRemove.push(k);
            }
            toRemove.forEach(function (k) { localStorage.removeItem(k); });
            toast("Données effacées (" + toRemove.length + " entrée(s))");
            if (fbUser) wipeFirestoreForUser();
            loadDefaultDeckIfEmpty().then(loadExtraBundledDecks).then(renderHome);
        }

        // ═══════════════════════════════════════════════
        // CLOUD SYNC (Firebase Auth + Firestore) — optional
        // ═══════════════════════════════════════════════
        // Everything above (load*/save*) stays synchronous, localStorage-
        // only, and unchanged in shape. This layer just watches saves and
        // mirrors them to Firestore in the background when signed in, and
        // does the reverse (cloud -> localStorage) on sign-in. If
        // FIREBASE_ENABLED is false none of this ever runs.
        var SYNC_DEBOUNCE_MS = 1500;
        var syncTimer = null;
        var syncInProgress = false;
        var syncPending = false;

        function setSyncStatus(state) {
            // state: "synced" | "syncing" | "offline" | "error" | "" (hidden)
            var el = document.getElementById("sync-status");
            if (!el) return;
            var labels = { synced: "✓ Synchronisé", syncing: "↻ Synchronisation…", offline: "⚠ Hors ligne", error: "⚠ Erreur de sync" };
            el.textContent = labels[state] || "";
            el.className = "sync-status sync-" + (state || "hidden");
        }

        function scheduleSync() {
            if (!FIREBASE_ENABLED || !fbUser) return;
            setSyncStatus(navigator.onLine === false ? "offline" : "syncing");
            clearTimeout(syncTimer);
            syncTimer = setTimeout(flushSync, SYNC_DEBOUNCE_MS);
        }
        function flushSync() {
            if (!FIREBASE_ENABLED || !fbUser) return;
            if (syncInProgress) { syncPending = true; return; }
            syncInProgress = true;
            pushAllToFirestore()
                .then(function () { setSyncStatus("synced"); })
                .catch(function (err) { console.error("sync push failed:", err); setSyncStatus("error"); })
                .then(function () {
                    syncInProgress = false;
                    if (syncPending) { syncPending = false; flushSync(); }
                });
        }
        document.addEventListener("visibilitychange", function () {
            if (document.visibilityState === "hidden") { clearTimeout(syncTimer); flushSync(); }
        });
        window.addEventListener("pagehide", function () { clearTimeout(syncTimer); flushSync(); });
        window.addEventListener("online", function () { if (fbUser) scheduleSync(); });
        window.addEventListener("offline", function () { if (fbUser) setSyncStatus("offline"); });

        // Firestore docs are capped at 1 MiB; split a big JSON string into
        // chunks comfortably under that so a large imported deck's card
        // content never risks hitting the limit.
        function chunkString(str, size) {
            var out = [];
            for (var i = 0; i < str.length; i += size) out.push(str.slice(i, i + size));
            return out.length ? out : [""];
        }

        function pushAllToFirestore() {
            if (!FIREBASE_ENABLED || !fbUser || !fbDb) return Promise.resolve();
            var sources = loadSources();
            var userRef = fbDb.collection("users").doc(fbUser.uid);
            var batch = fbDb.batch();

            batch.set(userRef, {
                sources: sources.map(function (s) { return { id: String(s.id), name: s.name, decks: s.decks, isDefault: !!s.isDefault }; }),
                theme: (function () { try { return localStorage.getItem(LS_THEME); } catch (e) { return null; } })(),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

            sources.forEach(function (src) {
                var srcRef = userRef.collection("sources").doc(String(src.id));
                batch.set(srcRef, {
                    srs: loadSRS(src.id),
                    newCount: loadNewCount(src.id),
                    flagged: loadFlagged(src.id),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
            });

            return batch.commit().then(function () {
                // Card content for user-imported sources only — the bundled
                // default deck is already static/served from default.json,
                // no need to duplicate its content in Firestore.
                var cardWrites = [];
                sources.forEach(function (src) {
                    if (src.isDefault) return;
                    var json = JSON.stringify(loadCards(src.id));
                    var chunks = chunkString(json, 900000);
                    var chunkCol = userRef.collection("sources").doc(String(src.id)).collection("cardChunks");
                    chunks.forEach(function (chunk, i) {
                        cardWrites.push(chunkCol.doc(String(i)).set({ data: chunk, index: i, total: chunks.length }));
                    });
                });
                return Promise.all(cardWrites);
            });
        }

        function fetchSourceCards(userRef, sourceId) {
            return userRef.collection("sources").doc(String(sourceId)).collection("cardChunks")
                .orderBy("index").get().then(function (snap) {
                    if (snap.empty) return null;
                    var parts = [];
                    snap.forEach(function (doc) { parts.push(doc.data().data); });
                    try { return JSON.parse(parts.join("")); } catch (e) { return null; }
                });
        }

        function backupLocalData() {
            var dump = { sources: loadSources(), perSource: {} };
            dump.sources.forEach(function (s) {
                dump.perSource[s.id] = { cards: loadCards(s.id), srs: loadSRS(s.id), newCount: loadNewCount(s.id), flagged: loadFlagged(s.id) };
            });
            try { localStorage.setItem("ankitrain_v1_backup_" + Date.now(), JSON.stringify(dump)); } catch (e) { }
        }

        // Keeps whichever SRS entry was reviewed more recently. Entries
        // from before lastReview existed are treated as older than any
        // timestamped entry, per spec.
        function mergeSRS(localSRS, cloudSRS) {
            var out = Object.assign({}, localSRS);
            Object.keys(cloudSRS || {}).forEach(function (cid) {
                var l = out[cid], c = cloudSRS[cid];
                if (!l) { out[cid] = c; return; }
                var lt = l.lastReview || 0, ct = c.lastReview || 0;
                if (ct > lt) out[cid] = c;
            });
            return out;
        }
        function mergeFlagged(localFl, cloudFl) {
            return Object.assign({}, cloudFl || {}, localFl || {}); // union, local text wins on conflict
        }

        function fetchAndMergeFromFirestore() {
            if (!FIREBASE_ENABLED || !fbUser || !fbDb) return Promise.resolve();
            var userRef = fbDb.collection("users").doc(fbUser.uid);
            return userRef.get().then(function (userDoc) {
                var cloud = userDoc.exists ? userDoc.data() : null;
                var localSources = loadSources();

                if (!cloud || !cloud.sources || !cloud.sources.length) {
                    // Nothing in the cloud yet — upload whatever's local, if any.
                    return localSources.length ? pushAllToFirestore() : Promise.resolve();
                }

                backupLocalData();

                if (!localSources.length) {
                    // Cloud has data, nothing local — pull everything down.
                    return Promise.all(cloud.sources.map(function (cs) {
                        var srcRef = userRef.collection("sources").doc(cs.id);
                        return Promise.all([srcRef.get(), fetchSourceCards(userRef, cs.id)]).then(function (r) {
                            var meta = r[0].exists ? r[0].data() : { srs: {}, newCount: {}, flagged: {} };
                            var cards = r[1] || (cs.isDefault ? null : {});
                            var sid = cs.isDefault ? "default" : cs.id;
                            localSources.push({ id: sid, name: cs.name, decks: cs.decks, isDefault: !!cs.isDefault });
                            if (cards) saveCardsRaw(sid, cards);
                            saveSRSRaw(sid, meta.srs || {});
                            saveNewCountRaw(sid, meta.newCount || { day: TODAY, count: 0 });
                            saveFlaggedRaw(sid, meta.flagged || {});
                        });
                    })).then(function () {
                        saveSourcesRaw(localSources);
                        if (cloud.theme) { try { localStorage.setItem(LS_THEME, cloud.theme); } catch (e) { } applyTheme(); updateThemeToggleIcon(); }
                    });
                }

                // Both sides have data: merge by source name (local ids are
                // per-device/Date.now()-based and won't match across
                // devices; the bundled default deck uses the stable id
                // "default" specifically so it always matches).
                var byName = {};
                localSources.forEach(function (s) { byName[s.name] = s; });

                var work = cloud.sources.map(function (cs) {
                    var local = byName[cs.name];
                    var srcRef = userRef.collection("sources").doc(cs.id);
                    return Promise.all([srcRef.get(), local ? null : fetchSourceCards(userRef, cs.id)]).then(function (r) {
                        var meta = r[0].exists ? r[0].data() : { srs: {}, newCount: {}, flagged: {} };
                        if (local) {
                            saveSRSRaw(local.id, mergeSRS(loadSRS(local.id), meta.srs || {}));
                            saveFlaggedRaw(local.id, mergeFlagged(loadFlagged(local.id), meta.flagged || {}));
                            // Higher of the two daily counters for today, so
                            // the limit can't be bypassed by switching devices.
                            var localNc = loadNewCount(local.id), cloudNc = meta.newCount || { day: TODAY, count: 0 };
                            var merged = (cloudNc.day === TODAY && cloudNc.count > (localNc.day === TODAY ? localNc.count : 0))
                                ? cloudNc : localNc;
                            saveNewCountRaw(local.id, merged);
                        } else if (r[1]) {
                            var sid = cs.isDefault ? "default" : cs.id;
                            localSources.push({ id: sid, name: cs.name, decks: cs.decks, isDefault: !!cs.isDefault });
                            saveCardsRaw(sid, r[1]);
                            saveSRSRaw(sid, meta.srs || {});
                            saveNewCountRaw(sid, meta.newCount || { day: TODAY, count: 0 });
                            saveFlaggedRaw(sid, meta.flagged || {});
                        }
                    });
                });

                return Promise.all(work).then(function () {
                    saveSourcesRaw(localSources);
                    if (cloud.theme) { try { localStorage.setItem(LS_THEME, cloud.theme); } catch (e) { } applyTheme(); updateThemeToggleIcon(); }
                    return pushAllToFirestore(); // write the merged result back
                });
            });
        }

        // "Raw" localStorage writes used only while merging — they skip
        // scheduleSync() so pulling from the cloud doesn't immediately try
        // to push straight back before the merge as a whole is done (the
        // final pushAllToFirestore() call above covers that).
        function saveSourcesRaw(s) { try { localStorage.setItem(LS_SOURCES, JSON.stringify(s)); } catch (e) { } }
        function saveCardsRaw(sid, c) { try { localStorage.setItem(LS_CARDS + sid, JSON.stringify(c)); } catch (e) { } }
        function saveSRSRaw(sid, s) { try { localStorage.setItem(LS_SRS + sid, JSON.stringify(s)); } catch (e) { } }
        function saveNewCountRaw(sid, nc) { try { localStorage.setItem(LS_NEWCOUNT + sid, JSON.stringify(nc)); } catch (e) { } }
        function saveFlaggedRaw(sid, fl) { try { localStorage.setItem(LS_FLAGGED + sid, JSON.stringify(fl)); } catch (e) { } }

        function deleteSourceFromFirestore(sourceId) {
            if (!FIREBASE_ENABLED || !fbUser || !fbDb) return Promise.resolve();
            var srcRef = fbDb.collection("users").doc(fbUser.uid).collection("sources").doc(String(sourceId));
            return srcRef.collection("cardChunks").get().then(function (snap) {
                var batch = fbDb.batch();
                snap.forEach(function (doc) { batch.delete(doc.ref); });
                batch.delete(srcRef);
                return batch.commit();
            }).catch(function (err) { console.error("Firestore source delete failed:", err); });
        }
        function wipeFirestoreForUser() {
            if (!FIREBASE_ENABLED || !fbUser || !fbDb) return Promise.resolve();
            var userRef = fbDb.collection("users").doc(fbUser.uid);
            return userRef.collection("sources").get().then(function (snap) {
                return Promise.all(snap.docs.map(function (d) { return deleteSourceFromFirestore(d.id); }));
            }).then(function () { return userRef.delete(); })
                .catch(function (err) { console.error("Firestore wipe failed:", err); });
        }

        // Clears the localStorage keys that hold another person's data —
        // run on sign-out so a shared/public device doesn't leak the
        // previous account's progress to whoever uses it next.
        function clearLocalSyncedData() {
            var toRemove = [];
            for (var i = 0; i < localStorage.length; i++) {
                var k = localStorage.key(i);
                if (k && k.indexOf("ankitrain_v1_") === 0 && k.indexOf("ankitrain_v1_backup_") !== 0) toRemove.push(k);
            }
            toRemove.forEach(function (k) { localStorage.removeItem(k); });
        }


        // ═══════════════════════════════════════════════
        // EXPORT STATS (for re-importing progress back into real Anki)
        // ═══════════════════════════════════════════════
        function exportStats(e, si) {
            e.stopPropagation();
            var sources = loadSources();
            var src = sources[si];
            var srs = loadSRS(src.id);
            if (!Object.keys(srs).length) { toast("Aucune progression à exporter pour cette source."); return; }
            var payload = { version: 1, source: src.name, exportedAt: new Date().toISOString(), cards: srs };
            var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
            var url = URL.createObjectURL(blob);
            var a = document.createElement("a");
            a.href = url;
            a.download = src.name.replace(/[^a-z0-9_\-]+/gi, "_") + "_stats.json";
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        }

        // ═══════════════════════════════════════════════
        // DECK TREE HELPERS
        // ═══════════════════════════════════════════════
        function naturalCompare(a, b) {
            return a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" });
        }

        // Build a full-depth tree from "::"-separated deck names (any number
        // of levels, e.g. Root::Child::"Espagnol 7"), sorted numerically so
        // "Espagnol 2" comes before "Espagnol 10".
        function buildDeckTree(decksMeta) {
            var nodes = {}, roots = [];
            decksMeta.forEach(function (d) {
                var parts = d.name.split("::");
                var path = "";
                for (var i = 0; i < parts.length; i++) {
                    var parentPath = path;
                    path = path ? path + "::" + parts[i] : parts[i];
                    if (!nodes[path]) {
                        var node = { name: parts[i], fullName: path, depth: i, children: [] };
                        nodes[path] = node;
                        if (parentPath) nodes[parentPath].children.push(node);
                        else roots.push(node);
                    }
                }
            });
            var sortRec = function (list) {
                list.sort(function (a, b) { return naturalCompare(a.name, b.name); });
                list.forEach(function (n) { sortRec(n.children); });
            };
            sortRec(roots);
            return roots;
        }

        function renderDeckRows(nodes, si, decksMeta, cardsByDeck, srs, newLimit) {
            return nodes.map(function (node) {
                var childIds = childDeckIds(decksMeta, node.fullName);
                var cardIds = allCardIds(cardsByDeck, childIds);
                var stats = deckStats(cardIds, srs, newLimit);
                var customLimit = stats.new + 20;
                var html = '<div class="h-deckrow" style="padding-left:' + (16 + node.depth * 20) + 'px" onclick="startStudy(' + si + ',\'' + esc(node.fullName) + '\')">'
                    + (node.depth > 0 ? '<span style="color:#ddd;margin-right:6px;font-size:11px">└</span>' : '')
                    + '<div class="h-deckrow-name' + (node.depth === 0 ? ' root-deck' : '') + '">' + esc(node.name) + '</div>'
                    + (stats.new ? '<span class="badge badge-new">' + stats.new + ' nvx</span>' : '')
                    + (stats.due ? '<span class="badge badge-due">' + stats.due + ' dus</span>' : '')
                    + (stats.learned ? '<span class="badge badge-done">' + stats.learned + ' appris</span>' : '')
                    + (stats.trueNew > stats.new
                        ? '<button class="h-custom-btn" title="Étudier 20 cartes de plus que la limite du jour" onclick="event.stopPropagation(); startStudy(' + si + ',\'' + esc(node.fullName) + '\',' + customLimit + ')">+20</button>'
                        : '')
                    + '<button class="h-custom-btn" title="Parcourir les cartes (recto → verso)" onclick="event.stopPropagation(); openBrowse(' + si + ',\'' + esc(node.fullName) + '\')">🔍</button>'
                    + '</div>';
                if (node.children.length) html += renderDeckRows(node.children, si, decksMeta, cardsByDeck, srs, newLimit);
                return html;
            }).join("");
        }

        function isChildOf(child, parent) {
            return child === parent || child.startsWith(parent + "::");
        }

        // Get all deck ids that are children of (or equal to) a given deck name
        function childDeckIds(decksMeta, deckName) {
            return decksMeta.filter(function (d) { return isChildOf(d.name, deckName); }).map(function (d) { return d.id; });
        }

        // SRS stats for a set of card ids
        function deckStats(cardIds, srs, newLimit) {
            var newC = 0, due = 0, learned = 0;
            cardIds.forEach(function (cid) {
                var s = srs[cid];
                if (!s || s.state === "new") newC++;
                else if (s.state === "learning" || s.state === "relearning" || s.due <= TODAY) due++;
                else learned++;
            });
            return { new: Math.min(newC, newLimit == null ? NEW_LIMIT : newLimit), due: due, learned: learned, trueNew: newC };
        }

        // Collect all card ids across a set of deck ids
        function allCardIds(cardsByDeck, deckIds) {
            var ids = [];
            deckIds.forEach(function (did) {
                (cardsByDeck[did] || []).forEach(function (c) { ids.push(c.id); });
            });
            return ids;
        }

        // ═══════════════════════════════════════════════
        // HOME
        // ═══════════════════════════════════════════════
        function renderHome() {
            var sources = loadSources();
            var el = document.getElementById("h-sources");
            if (!sources.length) {
                el.innerHTML = '<div class="h-empty">Aucun deck importé.<br>Pré-traitez votre .apkg avec <code>extract_apkg.py</code> puis importez le JSON.</div>';
                return;
            }

            el.innerHTML = sources.map(function (src, si) {
                var srs = loadSRS(src.id);
                var cardsByDeck = loadCards(src.id);
                var total = src.decks.reduce(function (n, d) { return n + d.cardCount; }, 0);
                var tree = buildDeckTree(src.decks);
                var rows = renderDeckRows(tree, si, src.decks, cardsByDeck, srs, remainingNewToday(src.id));

                return '<div class="h-source">'
                    + '<div class="h-source-header" onclick="toggleSource(this)">'
                    + '<div class="h-source-name">' + esc(src.name) + '</div>'
                    + '<div class="h-source-meta">' + total + ' cartes · ' + src.decks.length + ' deck(s)</div>'
                    + '<button class="h-source-export" onclick="showFlaggedList(event,' + si + ')" title="Cartes marquées à corriger">🚩</button>'
                    + '<button class="h-source-export" onclick="exportStats(event,' + si + ')" title="Exporter les stats">📤</button>'
                    + '<button class="h-source-del" onclick="deleteSource(event,' + si + ')">✕</button>'
                    + '<span class="h-source-arrow open">›</span>'
                    + '</div>'
                    + '<div class="h-decktree open">' + rows + '</div>'
                    + '</div>';
            }).join("");
        }

        function toggleSource(header) {
            var arrow = header.querySelector(".h-source-arrow");
            var tree = header.nextElementSibling;
            var open = tree.classList.toggle("open");
            arrow.classList.toggle("open", open);
        }

        function deleteSource(e, si) {
            e.stopPropagation();
            if (!confirm("Supprimer cette source et toute la progression ?")) return;
            var sources = loadSources();
            var id = sources[si].id;
            sources.splice(si, 1);
            saveSources(sources);
            try { localStorage.removeItem(LS_CARDS + id); } catch (e2) { }
            try { localStorage.removeItem(LS_SRS + id); } catch (e2) { }
            try { localStorage.removeItem(LS_NEWCOUNT + id); } catch (e2) { }
            try { localStorage.removeItem(LS_FLAGGED + id); } catch (e2) { }
            try { localStorage.removeItem(LS_STYLES + id); } catch (e2) { }
            if (fbUser) deleteSourceFromFirestore(id);
            renderHome();
        }

        // ═══════════════════════════════════════════════
        // SESSION STATE
        // ═══════════════════════════════════════════════
        var sess = { sourceIdx: 0, sourceId: null, deckLabel: "", cards: [], queue: [], qIdx: 0, srs: {}, done: 0 };
        var wordRows = [];
        var cardErrors = 0;
        var advancing = false;
        var revealed = false;

        function startStudy(si, deckName, customNewLimit) {
            var sources = loadSources();
            var src = sources[si];
            var cardsByDeck = loadCards(src.id);
            var srs = loadSRS(src.id);

            // Collect all cards from deckName and its children
            var childIds = childDeckIds(src.decks, deckName);
            var allCards = [];
            childIds.forEach(function (did) {
                (cardsByDeck[did] || []).forEach(function (c) { allCards.push(c); });
            });

            // Split new vs due (learning/relearning cards are always "due" —
            // they're mid-way through short-term steps, not day-scheduled yet)
            var newCards = [], dueCards = [];
            allCards.forEach(function (c) {
                var s = srs[c.id];
                if (!s || s.state === "new") newCards.push(c);
                else if (s.state === "learning" || s.state === "relearning" || s.due <= TODAY) dueCards.push(c);
            });
            shuffle(newCards); shuffle(dueCards);
            var newLimit = customNewLimit != null ? customNewLimit : remainingNewToday(src.id);
            newCards = newCards.slice(0, newLimit);
            var queue = dueCards.concat(newCards);

            if (!queue.length) { toast("Aucune carte à réviser aujourd'hui 🎉"); return; }

            sess.sourceIdx = si;
            sess.sourceId = src.id;
            sess.deckLabel = deckName.split("::").join(" › ");
            sess.cards = allCards;
            sess.queue = queue;
            sess.qIdx = 0;
            sess.srs = srs;
            sess.done = 0;

            document.getElementById("home").style.display = "none";
            document.getElementById("study").style.display = "flex";
            document.getElementById("s-deck-name").textContent = sess.deckLabel;
            showCard();
        }

        function goHome() {
            pendingNext = null;
            saveSRS(sess.sourceId, sess.srs);
            document.getElementById("study").style.display = "none";
            document.getElementById("home").style.display = "block";
            renderHome();
        }

        // ═══════════════════════════════════════════════
        // CARD HTML — rendered in a Shadow DOM so a note type's own CSS
        // (e.g. Refold Mandarin's global div{} / hr{} rules, its Kai font)
        // applies like in Anki without leaking into the app. Our rules come
        // after the card's <style> so they win: colors/background follow
        // the app theme, base font/size stay the app's, per-class styles
        // (.hanzi, .pinyin…) are kept.
        // ═══════════════════════════════════════════════
        var CARD_SHADOW_CSS = ".card{background:transparent!important;color:inherit!important;font-family:inherit;font-size:inherit;text-align:center;padding:0}"
            + "img{max-width:100%;max-height:50vh;border-radius:8px;margin:8px 0}"
            + "[lang|=zh]{font-family:Kai,'Kaiti SC',STKaiti,'PingFang SC','Noto Serif SC',serif}";
        function mountCardHtml(el, html, css) {
            if (!el) return;
            var root = el.shadowRoot || el.attachShadow({ mode: "open" });
            root.innerHTML = (css || "") + '<div class="card">' + html + '</div><style>' + CARD_SHADOW_CSS + '</style>';
        }

        // True when the back holds more than the typed words (an image, a
        // meaning, an example sentence…) — worth showing before moving on.
        function hasRichAnswer(card) {
            if (!card.answer) return false;
            if (/<img/i.test(card.answer)) return true;
            var squash = function (t) { return noAcc(String(t).toLowerCase()).replace(/[\s.,;:!?¡¿'"()\-]+/g, ""); };
            return squash(plainText(card.answer)) !== squash((card.words || []).join(""));
        }

        // ═══════════════════════════════════════════════
        // BROWSE — carrousel, recto + verso affichés, lecture seule (aucun
        // effet sur le SRS). Verso = card.answer (extract.py récent), sinon
        // les mots à taper pour les JSON plus anciens.
        // ═══════════════════════════════════════════════
        var browse = { all: [], list: [], idx: 0, observer: null };

        function openBrowse(si, deckName) {
            var src = loadSources()[si];
            var cardsByDeck = loadCards(src.id);
            browse.sid = src.id;
            var all = [];
            childDeckIds(src.decks, deckName).forEach(function (did) {
                (cardsByDeck[did] || []).forEach(function (c) { all.push(c); });
            });
            if (!all.length) { toast("Aucune carte dans ce deck"); return; }
            browse.all = all.map(function (c) {
                var back = c.answer != null ? c.answer : esc((c.words || []).join(" "));
                return { card: c, back: back, text: (plainText(c.question) + " " + plainText(back) + " " + (c.words || []).join(" ")).toLowerCase() };
            });
            browse.list = browse.all;
            // Pictures need room → carousel; words/sentences read better as
            // a dense two-column list.
            browse.carousel = browse.all.some(function (b) { return /<img/i.test(b.card.question + b.back); });
            document.getElementById("b-search").value = "";
            document.getElementById("b-deck-name").textContent = deckName.split("::").join(" › ");
            document.getElementById("home").style.display = "none";
            document.getElementById("browse").style.display = "flex";
            renderBrowse();
        }

        function closeBrowse() {
            document.getElementById("audio-player").pause();
            if (browse.observer) browse.observer.disconnect();
            document.getElementById("b-content").innerHTML = "";
            document.getElementById("browse").style.display = "none";
            document.getElementById("home").style.display = "block";
        }

        function filterBrowse(q) {
            var terms = noAcc(q.toLowerCase()).split(/\s+/).filter(Boolean);
            browse.list = browse.all.filter(function (b) {
                var t = noAcc(b.text);
                return terms.every(function (term) { return t.indexOf(term) !== -1; });
            });
            renderBrowse();
        }

        // Builds empty slide shells for the whole list; each one is filled
        // (front + back, via the Shadow DOM renderer) only when it gets
        // near the viewport, so 1000+ card decks stay light.
        function renderBrowse() {
            var n = browse.list.length;
            var el = document.getElementById("b-content");
            if (browse.observer) browse.observer.disconnect();
            browse.idx = 0;
            if (!n) {
                el.innerHTML = '<div class="h-empty">Aucune carte ne correspond.</div>';
                updateBrowseCount();
                return;
            }
            if (!browse.carousel) { renderBrowseList(el); return; }
            var slides = browse.list.map(function (b, i) {
                return '<div class="s-question b-slide' + (i === 0 ? ' active' : '') + '" data-i="' + i + '"></div>';
            }).join("");
            el.innerHTML = '<div class="b-track" id="b-track">' + slides + '</div>'
                + '<div class="b-nav">'
                + '<button id="b-prev" onclick="stepBrowse(-1)">‹ Préc.</button>'
                + '<span class="b-hint">← → pour défiler</span>'
                + '<button id="b-next" onclick="stepBrowse(1)">Suiv. ›</button>'
                + '</div>';
            var track = document.getElementById("b-track");
            browse.observer = new IntersectionObserver(function (entries) {
                entries.forEach(function (en) {
                    if (en.isIntersecting) fillSlide(en.target);
                });
            }, { root: track, rootMargin: "0px 150%" });
            track.querySelectorAll(".b-slide").forEach(function (sl) { browse.observer.observe(sl); });
            track.addEventListener("scroll", onBrowseScroll, { passive: true });
            track.addEventListener("wheel", onBrowseWheel, { passive: false });
            updateBrowseCount();
        }

        // Mouse wheel (vertical) → one slide per notch; horizontal trackpad
        // swipes keep the native scroll.
        var wheelLock = 0;
        function onBrowseWheel(e) {
            if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
            e.preventDefault();
            var now = Date.now();
            if (now < wheelLock) return;
            wheelLock = now + 250;
            stepBrowse(e.deltaY > 0 ? 1 : -1);
        }

        // Text of a card side, entities decoded, <style>/media dropped
        // (inert <template>: nothing gets loaded).
        function htmlToText(html) {
            var t = document.createElement("template");
            t.innerHTML = String(html || "");
            t.content.querySelectorAll("style,script").forEach(function (n) { n.remove(); });
            return t.content.textContent.replace(/\s+/g, " ").trim();
        }

        function renderBrowseList(el) {
            el.innerHTML = '<div class="b-list">' + browse.list.map(function (b, i) {
                var c = b.card;
                var hasAudio = (c.audioQuestion && c.audioQuestion.length) || (c.audioAnswer && c.audioAnswer.length);
                return '<div class="b-row">'
                    + '<div class="b-row-front">' + esc(htmlToText(c.question)) + '</div>'
                    + '<div class="b-row-back">' + esc(htmlToText(b.back)) + '</div>'
                    + (hasAudio ? '<button class="b-row-audio" onclick="playBrowseAudio(' + i + ')" title="Écouter">🔊</button>' : '<span></span>')
                    + '</div>';
            }).join("") + '</div>';
            document.getElementById("b-count").textContent = browse.list.length + " cartes";
        }

        function fillSlide(sl) {
            if (sl.dataset.filled) return;
            sl.dataset.filled = "1";
            var b = browse.list[+sl.dataset.i], c = b.card;
            var hasAudio = (c.audioQuestion && c.audioQuestion.length) || (c.audioAnswer && c.audioAnswer.length);
            sl.innerHTML = '<div class="b-front"></div><div class="b-sep">verso</div><div class="b-back"></div>'
                + (hasAudio ? '<button class="b-slide-audio" onclick="playBrowseAudio(' + sl.dataset.i + ')" title="Écouter">🔊</button>' : '');
            var css = cardStyle(browse.sid, c);
            mountCardHtml(sl.querySelector(".b-front"), c.question, css);
            mountCardHtml(sl.querySelector(".b-back"), b.back, css);
        }

        // Current slide = the one whose centre is closest to the track's.
        function onBrowseScroll() {
            var track = document.getElementById("b-track");
            if (!track) return;
            var mid = track.scrollLeft + track.clientWidth / 2, best = 0, bestD = Infinity;
            var slides = track.children;
            for (var i = 0; i < slides.length; i++) {
                var d = Math.abs(slides[i].offsetLeft + slides[i].offsetWidth / 2 - mid);
                if (d < bestD) { bestD = d; best = i; }
                else if (d > bestD) break;
            }
            if (best === browse.idx) return;
            slides[browse.idx] && slides[browse.idx].classList.remove("active");
            slides[best].classList.add("active");
            browse.idx = best;
            document.getElementById("audio-player").pause();
            updateBrowseCount();
        }

        function updateBrowseCount() {
            var n = browse.list.length;
            document.getElementById("b-count").textContent = (n ? browse.idx + 1 : 0) + " / " + n;
            var prev = document.getElementById("b-prev"), next = document.getElementById("b-next");
            if (prev) prev.disabled = browse.idx === 0;
            if (next) next.disabled = browse.idx >= n - 1;
        }

        function stepBrowse(d) {
            var track = document.getElementById("b-track");
            var target = track && track.children[browse.idx + d];
            if (!target) return;
            track.scrollTo({ left: target.offsetLeft + target.offsetWidth / 2 - track.clientWidth / 2 });
        }

        function playBrowseAudio(i) {
            var c = browse.list[i].card;
            playAudioList((c.audioQuestion || []).concat(c.audioAnswer || []));
        }

        document.addEventListener("keydown", function (e) {
            if (document.getElementById("browse").style.display !== "flex") return;
            var inSearch = e.target && e.target.id === "b-search";
            if (!browse.carousel && !inSearch && e.key !== "Escape") return;
            if (e.key === "Escape") {
                e.preventDefault();
                if (inSearch) e.target.blur(); else closeBrowse();
            } else if (inSearch) {
                if (e.key === "Enter") { e.preventDefault(); e.target.blur(); }
            } else if (e.key === "ArrowLeft") {
                e.preventDefault();
                stepBrowse(-1);
            } else if (e.key === "ArrowRight") {
                e.preventDefault();
                stepBrowse(1);
            }
        });

        // ═══════════════════════════════════════════════
        // CARD DISPLAY
        // ═══════════════════════════════════════════════
        function showCard() {
            advancing = false; cardErrors = 0; wordRows = []; revealed = false; pendingNext = null;
            var card = sess.queue[sess.qIdx];
            if (!card) { showDone(); return; }
            updateProgress();
            updateCounts();

            if (!card.words || !card.words.length) { sess.qIdx++; showCard(); return; }

            var hasAudio = (card.audioQuestion && card.audioQuestion.length) || card.lang;
            var previews = previewIntervals(sess.srs[card.id]);
            document.getElementById("s-content").innerHTML =
                '<div class="s-question"><div class="s-card-body"></div>'
                + (hasAudio ? '<button class="s-audio-btn" onclick="playCardAudio(\'q\')">🔊 Écouter</button>' : '')
                + '<div class="s-verso" id="s-verso"><div class="b-sep">verso</div><div class="s-verso-body"></div><div class="s-verso-next"></div></div>'
                + '</div>'
                + '<div class="t-words" id="t-words"></div>'
                + '<div class="t-actions">'
                + '<span class="t-show-ans" onclick="revealCurrent()">💡 Voir la réponse <span class="t-key">F1</span></span>'
                + '<span class="t-flag" id="s-flag-btn" onclick="toggleFlagCurrent()" title="Marquer à corriger dans Anki">🚩 <span class="t-key">F6</span></span>'
                + '</div>'
                + ratingButtonsHtml(previews);
            mountCardHtml(document.querySelector("#s-content .s-card-body"), card.question, cardStyle(sess.sourceId, card));

            buildRows(card.words);
            updateFlagIndicator();
            if (hasAudio) playCardAudio("q");
        }

        // Anki-style answer buttons — the interval preview sits above each
        // one, same layout as Anki's own reviewer.
        function ratingButtonsHtml(previews) {
            var defs = [
                [1, "again", "À revoir", "F2"],
                [3, "good", "Correct", "F3"],
                [2, "hard", "Difficile", "F4"],
                [4, "easy", "Facile", "F7"],
            ];
            return '<div class="t-ratings">' + defs.map(function (d) {
                return '<button class="t-rate t-rate-' + d[1] + '" data-q="' + d[0] + '" onclick="rate(' + d[0] + ')">'
                    + '<span class="t-rate-time">' + previews[d[0]] + '</span>'
                    + '<span class="t-rate-label">' + d[2] + '</span>'
                    + '<span class="t-key">' + d[3] + '</span>'
                    + '</button>';
            }).join('') + '</div>';
        }

        // Plain-color fade-in/fade-out flash on the button that matches the
        // rating actually applied, instead of a separate popup.
        function flashRateButton(q) {
            var btn = document.querySelector('.t-rate[data-q="' + q + '"]');
            if (!btn) return;
            btn.classList.remove("rate-flash");
            void btn.offsetWidth; // restart the animation if it's still running
            btn.classList.add("rate-flash");
        }

        function rate(q) {
            if (advancing) return;
            advancing = true;
            flashForPendingRating(q);
            playCardAudio("both", function () { advanceCard(q); });
        }

        // Highlight the button the instant the decision is made (press, or
        // completing the card), not after any audio has finished playing —
        // that's a separate, later step (the card-change transition).
        function flashForPendingRating(q) {
            var card = sess.queue[sess.qIdx];
            if (!card) return;
            var previewSrs = applyRating(sess.srs[card.id] || defaultSRS(), q, { requeueIn: null });
            flashRateButtonFor(q, previewSrs);
        }

        // What each rating would do to THIS card right now — shown above the
        // shortcuts, same idea as the time labels above Anki's own answer
        // buttons ("<10m", "1j", "2j"...). Doesn't mutate any real state.
        function formatInterval(days) {
            if (days < 1) return "<1j";
            if (days < 30) return days + "j";
            if (days < 365) return Math.round(days / 30) + "mo";
            return (days / 365).toFixed(1) + "a";
        }
        function formatRequeue(minutes) {
            if (minutes < 60) return "<" + minutes + "m";
            return "<" + Math.round(minutes / 60) + "h";
        }
        function previewIntervals(srs) {
            var base = srs || defaultSRS();
            var out = {};
            [1, 2, 3, 4].forEach(function (q) {
                var ctx = { requeueIn: null };
                var s = applyRating(base, q, ctx);
                out[q] = ctx.requeueIn ? formatRequeue(ctx.requeueIn) : formatInterval(s.interval);
            });
            return out;
        }

        // ═══════════════════════════════════════════════
        // AUDIO
        // ═══════════════════════════════════════════════
        // onDone fires once the whole list has played (or immediately if
        // there's nothing to play, or if playback is blocked/fails) so
        // callers can wait for it before switching to the next card —
        // otherwise the next card's question audio cuts this one off.
        function playAudioList(urls, onDone) {
            var audio = document.getElementById("audio-player");
            if (!urls || !urls.length) { if (onDone) onDone(); return; }
            var i = 0;
            function playNext() {
                if (i >= urls.length) { audio.onended = null; if (onDone) onDone(); return; }
                audio.src = urls[i++];
                var p = audio.play();
                if (p && p.catch) p.catch(playNext);
            }
            audio.onended = playNext;
            playNext();
        }
        function plainText(html) {
            return String(html || "").replace(/<style[\s\S]*?<\/style>/gi, "").replace(/<[^>]*>/g, "").trim();
        }
        // Browser text-to-speech fallback for cards with no recorded audio
        // but a known language — currently words added via cuatroloop/
        // tresloop, which have no real pronunciation clip to fall back on.
        function speakText(text, lang, onDone) {
            if (!text || !window.speechSynthesis) { if (onDone) onDone(); return; }
            window.speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(text);
            u.lang = lang === "fr" ? "fr-FR" : "es-ES";
            if (onDone) { u.onend = onDone; u.onerror = onDone; }
            window.speechSynthesis.speak(u);
        }
        function playCardAudio(which, onDone) {
            var card = sess.queue[sess.qIdx];
            if (!card) { if (onDone) onDone(); return; }
            var urls = which === "both"
                ? (card.audioQuestion || []).concat(card.audioAnswer || [])
                : (which === "a" ? card.audioAnswer : card.audioQuestion);
            if (urls && urls.length) { playAudioList(urls, onDone); return; }
            if (!card.lang) { if (onDone) onDone(); return; }
            var otherLang = card.lang === "es" ? "fr" : "es";
            if (which === "both") {
                speakText(plainText(card.question), card.lang, function () {
                    speakText((card.words || []).join(" "), otherLang, onDone);
                });
            } else if (which === "a") {
                speakText((card.words || []).join(" "), otherLang, onDone);
            } else {
                speakText(plainText(card.question), card.lang, onDone);
            }
        }

        function updateProgress() {
            var total = sess.queue.length;
            var done = Math.min(sess.qIdx, total);
            document.getElementById("prog-label").textContent = done + " / " + total;
            document.getElementById("prog-fill").style.width = Math.round(done / total * 100) + "%";
        }

        // Cards left in the queue (from the current position on), grouped by
        // scheduler state — new (blue) / learning+relearning (red) / review (green).
        function updateCounts() {
            var counts = { new: 0, learning: 0, review: 0 };
            for (var i = sess.qIdx; i < sess.queue.length; i++) {
                var s = sess.srs[sess.queue[i].id];
                var state = s ? s.state : "new";
                if (state === "new") counts.new++;
                else if (state === "learning" || state === "relearning") counts.learning++;
                else counts.review++;
            }
            document.getElementById("cnt-new").textContent = counts.new;
            document.getElementById("cnt-learn").textContent = counts.learning;
            document.getElementById("cnt-review").textContent = counts.review;
        }

        // ═══════════════════════════════════════════════
        // WORD ROWS
        // ═══════════════════════════════════════════════
        function buildRows(words) {
            advancing = false;
            var section = document.getElementById("t-words"); if (!section) return;
            section.innerHTML = ""; wordRows = [];

            words.forEach(function (word, i) {
                var col = document.createElement("div"); col.className = "word-col";
                var lbl = document.createElement("div"); lbl.className = "wc-lbl";
                var inp = document.createElement("input"); inp.className = "wc-inp";
                inp.type = "text"; inp.placeholder = "···";
                inp.autocomplete = "off"; inp.autocorrect = "off"; inp.spellcheck = false;
                inp.style.width = Math.max(word.length * 14, 48) + "px";
                var hint = document.createElement("div"); hint.className = "wc-hint";
                var attempts = document.createElement("div"); attempts.className = "wc-attempts";
                col.append(lbl, inp, hint, attempts);
                section.appendChild(col);

                var entry = { word: word, expected: [word], inp: inp, lbl: lbl, hint: hint, attempts: attempts, solved: false, revealed: false, errors: 0, _errTimer: null };
                wordRows.push(entry);
                inp.addEventListener("input", makeCheck(entry, i));
                inp.addEventListener("keydown", makeKey(i));
            });

            setTimeout(function () { if (wordRows.length) wordRows[0].inp.focus(); }, 60);
        }

        function makeCheck(entry, i) { return function () { liveCheck(entry, i); }; }
        function makeKey(i) {
            return function (e) { if (e.key === "Enter") { e.preventDefault(); focusNext(i); } };
        }

        function norm(s) {
            return s.toLowerCase().trim()
                .replace(/^[¿¡!.,;:'"«»()\[\]\-–—]+|[¿¡!.,;:'"«»()\[\]\-–—]+$/g, "").trim();
        }
        function noAcc(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, ""); }
        function isMatch(input, expected) { var ni = norm(input), ne = norm(expected); return ni === ne || noAcc(ni) === noAcc(ne); }
        function check(entry) {
            if (!entry.inp.value.trim()) return null;
            return entry.expected.some(function (t) { return isMatch(entry.inp.value, t); });
        }

        function liveCheck(entry, i) {
            var r = check(entry);
            if (r === null) {
                clearTimeout(entry._errTimer);
                entry.inp.className = "wc-inp";
                if (!entry.inp.value.trim()) entry.solved = false;
                return;
            }
            if (r) {
                clearTimeout(entry._errTimer);
                entry.inp.className = "wc-inp ok";
                entry.solved = true;
                entry.lbl.textContent = entry.word;
                entry.lbl.style.color = "#16a34a";
                setTimeout(function () { if (!entry.inp.isConnected) return; focusNext(i); }, 220);
            } else {
                entry.inp.className = "wc-inp err";
                entry.solved = false;
                clearTimeout(entry._errTimer);
                entry._errTimer = setTimeout(function () {
                    if (!entry.inp.isConnected || entry.solved) return;
                    entry.errors++;
                    cardErrors = Math.max(cardErrors, entry.errors);
                    entry.attempts.textContent = "✗".repeat(Math.min(entry.errors, 5));
                    if (entry.errors >= 3) revealHint(entry);
                }, 1500);
            }
        }

        function focusNext(i) {
            for (var j = i + 1; j < wordRows.length; j++) { if (!wordRows[j].solved) { wordRows[j].inp.focus(); return; } }
            for (var j = 0; j < i && j < wordRows.length; j++) { if (!wordRows[j].solved) { wordRows[j].inp.focus(); return; } }
            tryComplete();
        }

        function revealHint(entry) {
            entry.hint.textContent = entry.expected[0];
            entry.hint.style.display = "block";
            entry.revealed = true;
        }
        // Reveals only the word at the cursor (or the first not-yet-shown one
        // if nothing has focus) — not the whole card at once. Once nothing
        // is left to reveal, that same shortcut becomes the confirmation to
        // move on: the press that reveals the LAST word just reveals it and
        // stops, so you get to see the fully-revealed card; the NEXT press
        // (with nothing left to reveal) advances via completeCard(), which
        // always rates À revoir once any reveal was used this card — no
        // matter how many other words were typed correctly on their own.
        function revealCurrent() {
            var entry = wordRows.find(function (e) { return e.inp === document.activeElement && !e.solved && !e.revealed; })
                || wordRows.find(function (e) { return !e.solved && !e.revealed; });
            if (!entry) { completeCard(); return; }
            revealed = true;
            revealHint(entry);
            entry.lbl.textContent = entry.word;
            entry.lbl.style.color = "#c9922a";
            playCardAudio("a"); // like Anki: audio plays as soon as the answer appears
        }

        // Difficile/Facile are only ever a manual, deliberate call (the
        // rating buttons/F4/F7) — never inferred from mistakes. Automatic
        // completion only ever lands on one of two outcomes: needed a hint
        // at any point this card -> À revoir, got there entirely on your
        // own -> Correct. The attempt counters (✗) are still shown per
        // word as feedback, they just no longer drive the rating.
        function completeCard() {
            if (advancing) return;
            advancing = true;
            var q = revealed ? 1 : 3;
            flashForPendingRating(q);
            var card = sess.queue[sess.qIdx];
            showVerso(card);
            if (!hasRichAnswer(card)) {
                playCardAudio("a", function () { flash(function () { advanceCard(q); }); });
                return;
            }
            // Rich back (meaning, example sentence, image…): leave it on
            // screen and wait for Entrée / « Suivant → ».
            document.querySelector("#s-verso .s-verso-next").innerHTML =
                '<button class="s-next-btn" onclick="continueAfterAnswer()">Suivant → <span class="t-key">Entrée</span></button>';
            if (document.activeElement) document.activeElement.blur();
            pendingNext = function () { flash(function () { advanceCard(q); }); };
            playCardAudio("a");
        }

        // Back of the card, under the separator line inside the question card.
        function showVerso(card) {
            var box = document.getElementById("s-verso");
            if (!box) return;
            var back = card.answer != null ? card.answer : esc((card.words || []).join(" "));
            mountCardHtml(box.querySelector(".s-verso-body"), back, cardStyle(sess.sourceId, card));
            box.classList.add("on");
        }

        var pendingNext = null;
        function continueAfterAnswer() {
            if (!pendingNext) return;
            var go = pendingNext; pendingNext = null;
            document.getElementById("audio-player").pause();
            go();
        }

        function tryComplete() {
            if (advancing) return;
            if (wordRows.every(function (e) { return e.solved; })) completeCard();
        }

        // ═══════════════════════════════════════════════
        // KEYBOARD SHORTCUTS (study screen only)
        // ═══════════════════════════════════════════════
        // F1 = voir la réponse (au curseur) · F2 = À revoir · F3 = Correct
        // · F4 = Difficile · F7 = Facile (not F5/F6: F5 reloads the page in
        // most browsers and preventDefault() can't reliably stop that; F6
        // is already the flag shortcut) — "Facile" is deliberately the
        // farthest from F1 since it schedules the longest interval, so a
        // stray key-repeat or mis-click right after reveal can't trigger it.
        var FKEY_RATING = { F2: 1, F3: 3, F4: 2, F7: 4 };
        document.addEventListener("keydown", function (e) {
            if (document.getElementById("study").style.display !== "flex") return;
            if (pendingNext && e.key === "Enter") {
                e.preventDefault();
                continueAfterAnswer();
            } else if (e.key === "F1") {
                e.preventDefault();
                revealCurrent();
            } else if (e.key === "F6") {
                e.preventDefault();
                toggleFlagCurrent();
            } else if (FKEY_RATING.hasOwnProperty(e.key)) {
                e.preventDefault();
                rate(FKEY_RATING[e.key]);
            }
        });

        function advanceCard(q) {
            var card = sess.queue[sess.qIdx];
            var wasNew = !sess.srs[card.id] || sess.srs[card.id].state === "new";
            var ctx = { requeueIn: null };
            sess.srs[card.id] = applyRating(sess.srs[card.id] || defaultSRS(), q, ctx);
            sess.srs[card.id].lastReview = Date.now(); // for cross-device merge on sign-in
            if (wasNew) recordNewIntroduced(sess.sourceId);
            sess.done++;
            sess.qIdx++;
            if (ctx.requeueIn) {
                // Not a fixed distance — Anki itself doesn't resurface a
                // learning-step card at an exact position either, it's
                // interleaved with whatever else is due around that time.
                var jitter = 0.6 + Math.random() * 1.0; // 0.6x .. 1.6x
                var offset = Math.max(2, Math.round(ctx.requeueIn * jitter));
                var insertAt = Math.min(sess.queue.length, sess.qIdx + offset);
                sess.queue.splice(insertAt, 0, card);
            }
            updateCounts();
            var content = document.getElementById("s-content");
            content.style.cssText = "opacity:0;transform:translateY(-10px);transition:opacity .4s,transform .4s";
            setTimeout(function () {
                content.style.cssText = "opacity:0;transform:translateY(10px);transition:none";
                content.offsetHeight;
                content.style.cssText = "opacity:1;transform:translateY(0);transition:opacity .4s,transform .4s";
                showCard();
            }, 400);
        }

        function flash(cb) {
            var f = document.getElementById("flash");
            f.classList.add("on");
            setTimeout(function () { f.classList.remove("on"); }, 350);
            setTimeout(cb, 400);
        }

        // The rating itself (and scheduling) is unaffected — this only
        // softens the *feedback*: flashing "Facile" is held back until a
        // card has actually been aced on the first try a few times, the
        // "Correct" button flashes instead for the first three.
        function flashRateButtonFor(q, srs) {
            var showAsGood = q === 4 && srs && (srs.easyCount || 0) <= 3;
            flashRateButton(showAsGood ? 3 : q);
        }

        function showDone() {
            saveSRS(sess.sourceId, sess.srs);
            document.getElementById("s-content").innerHTML =
                '<div class="s-done">'
                + '<div class="s-done-icon">🎉</div>'
                + '<div class="s-done-title">Session terminée !</div>'
                + '<div class="s-done-sub">' + sess.done + ' cartes révisées aujourd\'hui</div>'
                + '<button class="btn-home" onclick="goHome()">← Retour</button>'
                + '</div>';
            document.getElementById("prog-fill").style.width = "100%";
            document.getElementById("prog-label").textContent = sess.done + " / " + sess.done;
        }

        // ═══════════════════════════════════════════════
        // UTILS
        // ═══════════════════════════════════════════════
        function esc(s) { return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/'/g, "&#39;"); }
        function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

        var _toastTimer;
        function toast(msg) {
            var el = document.getElementById("toast");
            el.textContent = msg; el.classList.add("show");
            clearTimeout(_toastTimer);
            _toastTimer = setTimeout(function () { el.classList.remove("show"); }, 3500);
        }

        // ── INIT ──
        updateThemeToggleIcon();
        loadDefaultDeckIfEmpty().then(loadExtraBundledDecks).then(renderHome);
    </script>
</body>

</html>
