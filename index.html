<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anki Trainer</title>
    <style>
        :root {
            --navy: #1e3a5f;
            --green: #16a34a;
            --red: #dc2626;
            --orange: #ea580c;
            --blue: #2563eb;
            --gold: #c8a84b;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #fff;
            color: #111;
            min-height: 100vh;
        }

        /* ── HOME ── */
        #home {
            max-width: 560px;
            margin: 0 auto;
            padding: 52px 24px 80px;
        }

        .h-logo {
            font-size: 36px;
            margin-bottom: 6px;
        }

        .h-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 4px;
        }

        .h-sub {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 36px;
        }

        /* Source list */
        .h-sources {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
        }

        .h-source {
            border: 1.5px solid #f0f0f0;
            border-radius: 14px;
            overflow: hidden;
            transition: border-color .15s;
        }

        .h-source:hover {
            border-color: #d8e0f0;
        }

        .h-source-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 16px;
            cursor: pointer;
            user-select: none;
            background: #fff;
            transition: background .12s;
        }

        .h-source-header:hover {
            background: #f8faff;
        }

        .h-source-name {
            font-size: 14px;
            font-weight: 600;
            color: #111;
            flex: 1;
        }

        .h-source-meta {
            font-size: 11px;
            color: #bbb;
        }

        .h-source-del {
            padding: 3px 8px;
            font-size: 12px;
            color: #ddd;
            background: none;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            transition: color .15s;
            flex-shrink: 0;
        }

        .h-source-del:hover {
            color: var(--red);
        }

        .h-source-arrow {
            font-size: 11px;
            color: #ccc;
            transition: transform .2s;
            flex-shrink: 0;
        }

        .h-source-arrow.open {
            transform: rotate(90deg);
        }

        /* Deck tree inside a source */
        .h-decktree {
            display: none;
            border-top: 1px solid #f5f5f5;
            padding: 8px 0;
        }

        .h-decktree.open {
            display: block;
        }

        .h-deckrow {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            cursor: pointer;
            transition: background .12s;
        }

        .h-deckrow:hover {
            background: #f8faff;
        }

        .h-deckrow-name {
            font-size: 13px;
            color: #333;
            flex: 1;
        }

        .h-deckrow-name.root-deck {
            font-weight: 600;
        }

        .badge {
            padding: 2px 7px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-new {
            background: #eff6ff;
            color: var(--blue);
        }

        .badge-due {
            background: #fff7ed;
            color: var(--orange);
        }

        .badge-done {
            background: #f0fdf4;
            color: var(--green);
        }

        .h-empty {
            font-size: 14px;
            color: #ccc;
            text-align: center;
            padding: 28px 0;
        }

        .h-import-btn {
            width: 100%;
            padding: 13px;
            border: 1.5px dashed #ddd;
            border-radius: 14px;
            background: none;
            font-size: 14px;
            color: #aaa;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: border-color .15s, color .15s;
        }

        .h-import-btn:hover {
            border-color: var(--navy);
            color: var(--navy);
        }

        /* ── STUDY ── */
        #study {
            min-height: 100vh;
            display: none;
            flex-direction: column;
        }

        .s-topbar {
            padding: 16px 24px 0;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .s-back {
            background: none;
            border: none;
            color: #bbb;
            cursor: pointer;
            font-size: 13px;
            transition: color .15s;
        }

        .s-back:hover {
            color: var(--navy);
        }

        .s-prog {
            flex: 1;
        }

        .s-prog-label {
            font-size: 11px;
            color: #d0d0d0;
            text-align: right;
            margin-bottom: 5px;
        }

        .s-prog-track {
            height: 2px;
            background: #f0f0f0;
            border-radius: 2px;
        }

        .s-prog-fill {
            height: 100%;
            background: var(--gold);
            border-radius: 2px;
            transition: width .6s cubic-bezier(.4, 0, .2, 1);
        }

        .s-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 36px 24px 60px;
        }

        .s-deck-name {
            font-size: 12px;
            color: #ccc;
            margin-bottom: 24px;
            letter-spacing: .3px;
        }

        /* Question */
        .s-question {
            width: 100%;
            max-width: 720px;
            border: 1.5px solid #f0f0f0;
            border-radius: 18px;
            padding: 28px 32px;
            margin-bottom: 32px;
            font-size: clamp(18px, 2.8vw, 26px);
            line-height: 1.6;
            color: #222;
            text-align: center;
        }

        .s-question img {
            max-width: 100%;
            border-radius: 8px;
            margin: 8px 0;
        }

        .s-question * {
            font-family: inherit;
        }

        .s-audio-btn {
            display: block;
            margin: 10px auto 0;
            background: none;
            border: 1.5px solid #e5e7eb;
            border-radius: 20px;
            padding: 5px 14px;
            font-size: 14px;
            color: var(--navy);
            cursor: pointer;
            transition: border-color .15s, background .15s;
        }

        .s-audio-btn:hover {
            border-color: var(--navy);
            background: #f8faff;
        }

        /* Word inputs */
        .t-words {
            display: flex;
            flex-wrap: wrap;
            gap: 18px 28px;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            max-width: 720px;
        }

        .word-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .wc-lbl {
            font-family: Georgia, serif;
            font-size: clamp(16px, 2.4vw, 24px);
            min-height: 32px;
            color: #ccc;
        }

        .wc-inp {
            border: none;
            border-bottom: 2.5px solid #d0ccc5;
            background: transparent;
            font-family: Georgia, serif;
            font-size: 17px;
            text-align: center;
            outline: none;
            padding: 2px 4px 7px;
            transition: border-color .2s, color .2s;
            min-width: 48px;
        }

        .wc-inp:focus {
            border-bottom-color: #93aed6;
        }

        .wc-inp.ok {
            border-bottom-color: var(--green);
            color: var(--green);
        }

        .wc-inp.err {
            border-bottom-color: var(--red);
            color: var(--red);
        }

        .wc-inp::placeholder {
            color: #ddd;
        }

        .wc-hint {
            display: none;
            font-family: Georgia, serif;
            font-size: 13px;
            color: #c9922a;
        }

        .t-actions {
            margin-top: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
            width: 100%;
        }

        .t-show-ans {
            font-size: 11px;
            color: #c9c0b6;
            cursor: pointer;
            letter-spacing: .3px;
            transition: color .15s;
        }

        .t-show-ans:hover {
            color: #c9922a;
        }

        .t-skip {
            font-size: 11px;
            color: #d0d0d0;
            cursor: pointer;
            letter-spacing: .3px;
            transition: color .15s;
        }

        .t-skip:hover {
            color: #999;
        }

        /* Rating pill */
        .s-pill {
            position: fixed;
            bottom: 36px;
            left: 50%;
            transform: translateX(-50%) translateY(60px);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            opacity: 0;
            transition: transform .3s, opacity .3s;
            pointer-events: none;
            z-index: 50;
        }

        .s-pill.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .pill-easy {
            background: #eff6ff;
            color: var(--blue);
        }

        .pill-good {
            background: #f0fdf4;
            color: var(--green);
        }

        .pill-hard {
            background: #fff7ed;
            color: var(--orange);
        }

        .pill-again {
            background: #fef2f2;
            color: var(--red);
        }

        /* Done */
        .s-done {
            text-align: center;
            padding: 60px 24px;
            width: 100%;
        }

        .s-done-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .s-done-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 8px;
        }

        .s-done-sub {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 28px;
        }

        .btn-home {
            padding: 12px 28px;
            border-radius: 12px;
            background: var(--navy);
            color: #fff;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Flash */
        #flash {
            position: fixed;
            inset: 0;
            pointer-events: none;
            border: 2.5px solid var(--green);
            border-radius: 10px;
            opacity: 0;
            transition: opacity .25s;
            z-index: 50;
        }

        #flash.on {
            opacity: .6;
        }

        /* Toast */
        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #111;
            color: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            transition: transform .3s;
            z-index: 300;
            pointer-events: none;
            white-space: nowrap;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body>

    <!-- ── HOME ── -->
    <div id="home">
        <div class="h-logo">🃏</div>
        <div class="h-title">Anki Trainer</div>
        <div class="h-sub">Pré-traitez votre .apkg avec <code>extract_apkg.py</code>, puis importez le JSON ici</div>
        <div class="h-sources" id="h-sources"></div>
        <label class="h-import-btn">
            ＋ Importer un fichier .json
            <input type="file" accept=".json" style="display:none" onchange="importJSON(this)">
        </label>
    </div>

    <!-- ── STUDY ── -->
    <div id="study">
        <div class="s-topbar">
            <button class="s-back" onclick="goHome()">← Quitter</button>
            <div class="s-prog">
                <div class="s-prog-label" id="prog-label">0 / 0</div>
                <div class="s-prog-track">
                    <div class="s-prog-fill" id="prog-fill" style="width:0%"></div>
                </div>
            </div>
        </div>
        <div class="s-main">
            <div class="s-deck-name" id="s-deck-name"></div>
            <div id="s-content"></div>
        </div>
    </div>

    <div id="flash"></div>
    <div class="s-pill" id="pill"></div>
    <div id="toast"></div>
    <audio id="audio-player" preload="none"></audio>

    <script>
        // ═══════════════════════════════════════════════
        // STORAGE
        // ═══════════════════════════════════════════════
        var LS_SOURCES = "ankitrain_v1_sources"; // [{id, name, decks:[{id,name,cardCount}]}]
        var LS_CARDS = "ankitrain_v1_c_";      // + sourceId → {deckId:[cards]}
        var LS_SRS = "ankitrain_v1_s_";      // + sourceId → {cardId: srsMeta}
        var NEW_LIMIT = 20;
        var TODAY = dayStamp();

        function dayStamp(d) { d = d || new Date(); return Math.floor(d.getTime() / 86400000); }
        function loadSources() { try { return JSON.parse(localStorage.getItem(LS_SOURCES) || "[]"); } catch (e) { return []; } }
        function saveSources(s) { try { localStorage.setItem(LS_SOURCES, JSON.stringify(s)); } catch (e) { toast("Erreur stockage"); } }
        function loadCards(sid) { try { return JSON.parse(localStorage.getItem(LS_CARDS + sid) || "{}"); } catch (e) { return {}; } }
        function saveCards(sid, c) { try { localStorage.setItem(LS_CARDS + sid, JSON.stringify(c)); } catch (e) { throw new Error("Données trop volumineuses pour le stockage local"); } }
        function loadSRS(sid) { try { return JSON.parse(localStorage.getItem(LS_SRS + sid) || "{}"); } catch (e) { return {}; } }
        function saveSRS(sid, s) { try { localStorage.setItem(LS_SRS + sid, JSON.stringify(s)); } catch (e) { } }

        // ═══════════════════════════════════════════════
        // SM-2
        // ═══════════════════════════════════════════════
        function defaultSRS() { return { interval: 0, ease: 2.5, due: TODAY, reps: 0, lapses: 0 }; }

        // Erreurs → rating : 0=Easy 1=Good 2=Hard 3+=Again
        function errorsToRating(e) { return e === 0 ? 4 : e === 1 ? 3 : e === 2 ? 2 : 1; }

        var PILL_LABEL = { 4: "✨ Parfait", 3: "🟢 Correct", 2: "🟠 Difficile", 1: "🔴 À revoir" };
        var PILL_CLASS = { 4: "pill-easy", 3: "pill-good", 2: "pill-hard", 1: "pill-again" };

        function applyRating(srs, q) {
            var s = Object.assign({}, srs);
            if (q === 1) {
                s.lapses++; s.ease = Math.max(1.3, s.ease - 0.2);
                s.interval = 1; s.reps = 0;
            } else if (q === 2) {
                s.ease = Math.max(1.3, s.ease - 0.15);
                s.interval = s.reps < 2 ? Math.max(1, s.interval || 1) : Math.max(1, Math.round(s.interval * 1.2));
                s.reps++;
            } else if (q === 3) {
                s.interval = s.reps === 0 ? 1 : s.reps === 1 ? 4 : Math.max(1, Math.round(s.interval * s.ease));
                s.reps++;
            } else {
                s.ease = Math.min(4.0, s.ease + 0.15);
                s.interval = s.reps === 0 ? 3 : s.reps === 1 ? 7 : Math.max(1, Math.round(s.interval * s.ease * 1.3));
                s.reps++;
            }
            s.due = TODAY + s.interval;
            return s;
        }

        // ═══════════════════════════════════════════════
        // IMPORT JSON
        // ═══════════════════════════════════════════════
        function importJSON(input) {
            var file = input.files[0]; if (!file) return;
            input.value = "";
            var reader = new FileReader();
            reader.onload = function (e) {
                var data;
                try { data = JSON.parse(e.target.result); } catch (err) { toast("JSON invalide : " + err.message); return; }
                if (!data.decks || !Array.isArray(data.decks)) { toast("Format invalide — utilisez extract_apkg.py"); return; }

                var sid = Date.now();
                var sourceName = data.source || file.name.replace(/\.json$/, "");

                // Build index: group cards by deckId
                var cardsByDeck = {};
                data.decks.forEach(function (d) {
                    cardsByDeck[d.id] = d.cards || [];
                });

                // Source meta (lightweight — no card content)
                var decksMeta = data.decks.map(function (d) {
                    return { id: d.id, name: d.name, cardCount: (d.cards || []).length };
                });

                var sources = loadSources();
                sources.push({ id: sid, name: sourceName, decks: decksMeta });
                saveSources(sources);
                saveCards(sid, cardsByDeck);

                var total = data.decks.reduce(function (n, d) { return n + (d.cards || []).length; }, 0);
                toast("✓ " + total + " cartes importées (" + data.decks.length + " deck(s))");
                renderHome();
            };
            reader.readAsText(file);
        }

        // ═══════════════════════════════════════════════
        // DECK TREE HELPERS
        // ═══════════════════════════════════════════════
        function deckShortName(fullName) {
            var parts = fullName.split("::");
            return parts[parts.length - 1];
        }
        function deckDepth(fullName) {
            return fullName.split("::").length - 1;
        }
        function isChildOf(child, parent) {
            return child === parent || child.startsWith(parent + "::");
        }

        // Get all deck ids that are children of (or equal to) a given deck name
        function childDeckIds(decksMeta, deckName) {
            return decksMeta.filter(function (d) { return isChildOf(d.name, deckName); }).map(function (d) { return d.id; });
        }

        // SRS stats for a set of card ids
        function deckStats(cardIds, srs) {
            var newC = 0, due = 0, learned = 0;
            cardIds.forEach(function (cid) {
                var s = srs[cid];
                if (!s) newC++;
                else if (s.due <= TODAY) due++;
                else learned++;
            });
            return { new: Math.min(newC, NEW_LIMIT), due: due, learned: learned };
        }

        // Collect all card ids across a set of deck ids
        function allCardIds(cardsByDeck, deckIds) {
            var ids = [];
            deckIds.forEach(function (did) {
                (cardsByDeck[did] || []).forEach(function (c) { ids.push(c.id); });
            });
            return ids;
        }

        // ═══════════════════════════════════════════════
        // HOME
        // ═══════════════════════════════════════════════
        function renderHome() {
            var sources = loadSources();
            var el = document.getElementById("h-sources");
            if (!sources.length) {
                el.innerHTML = '<div class="h-empty">Aucun deck importé.<br>Pré-traitez votre .apkg avec <code>extract_apkg.py</code> puis importez le JSON.</div>';
                return;
            }

            el.innerHTML = sources.map(function (src, si) {
                var srs = loadSRS(src.id);
                var cardsByDeck = loadCards(src.id);
                var total = src.decks.reduce(function (n, d) { return n + d.cardCount; }, 0);

                // Detect "root" deck names (those that have children using ::)
                var rootNames = [];
                src.decks.forEach(function (d) {
                    var root = d.name.split("::")[0];
                    if (rootNames.indexOf(root) === -1) rootNames.push(root);
                });
                rootNames.sort();

                var rows = "";
                rootNames.forEach(function (root) {
                    var childIds = childDeckIds(src.decks, root);
                    var cardIds = allCardIds(cardsByDeck, childIds);
                    var stats = deckStats(cardIds, srs);

                    rows += '<div class="h-deckrow" onclick="startStudy(' + si + ',\'' + esc(root) + '\')">'
                        + '<div class="h-deckrow-name root-deck">' + esc(root) + '</div>'
                        + (stats.new ? '<span class="badge badge-new">' + stats.new + ' nvx</span>' : '')
                        + (stats.due ? '<span class="badge badge-due">' + stats.due + ' dus</span>' : '')
                        + (stats.learned ? '<span class="badge badge-done">' + stats.learned + ' ok</span>' : '')
                        + '</div>';

                    // Sub-decks
                    src.decks.filter(function (d) {
                        return d.name.startsWith(root + "::") && d.name.split("::").length === root.split("::").length + 1;
                    }).forEach(function (sub) {
                        var subChildIds = childDeckIds(src.decks, sub.name);
                        var subCardIds = allCardIds(cardsByDeck, subChildIds);
                        var subStats = deckStats(subCardIds, srs);
                        var depth = deckDepth(sub.name);
                        rows += '<div class="h-deckrow" style="padding-left:' + (16 + depth * 20) + 'px" onclick="startStudy(' + si + ',\'' + esc(sub.name) + '\')">'
                            + '<span style="color:#ddd;margin-right:6px;font-size:11px">└</span>'
                            + '<div class="h-deckrow-name">' + esc(deckShortName(sub.name)) + '</div>'
                            + (subStats.new ? '<span class="badge badge-new">' + subStats.new + ' nvx</span>' : '')
                            + (subStats.due ? '<span class="badge badge-due">' + subStats.due + ' dus</span>' : '')
                            + (subStats.learned ? '<span class="badge badge-done">' + subStats.learned + ' ok</span>' : '')
                            + '</div>';
                    });
                });

                return '<div class="h-source">'
                    + '<div class="h-source-header" onclick="toggleSource(this)">'
                    + '<div class="h-source-name">' + esc(src.name) + '</div>'
                    + '<div class="h-source-meta">' + total + ' cartes · ' + src.decks.length + ' deck(s)</div>'
                    + '<button class="h-source-del" onclick="deleteSource(event,' + si + ')">✕</button>'
                    + '<span class="h-source-arrow open">›</span>'
                    + '</div>'
                    + '<div class="h-decktree open">' + rows + '</div>'
                    + '</div>';
            }).join("");
        }

        function toggleSource(header) {
            var arrow = header.querySelector(".h-source-arrow");
            var tree = header.nextElementSibling;
            var open = tree.classList.toggle("open");
            arrow.classList.toggle("open", open);
        }

        function deleteSource(e, si) {
            e.stopPropagation();
            if (!confirm("Supprimer cette source et toute la progression ?")) return;
            var sources = loadSources();
            var id = sources[si].id;
            sources.splice(si, 1);
            saveSources(sources);
            try { localStorage.removeItem(LS_CARDS + id); } catch (e2) { }
            try { localStorage.removeItem(LS_SRS + id); } catch (e2) { }
            renderHome();
        }

        // ═══════════════════════════════════════════════
        // SESSION STATE
        // ═══════════════════════════════════════════════
        var sess = { sourceIdx: 0, sourceId: null, deckLabel: "", cards: [], queue: [], qIdx: 0, srs: {}, done: 0 };
        var wordRows = [];
        var cardErrors = 0;
        var advancing = false;

        function startStudy(si, deckName) {
            var sources = loadSources();
            var src = sources[si];
            var cardsByDeck = loadCards(src.id);
            var srs = loadSRS(src.id);

            // Collect all cards from deckName and its children
            var childIds = childDeckIds(src.decks, deckName);
            var allCards = [];
            childIds.forEach(function (did) {
                (cardsByDeck[did] || []).forEach(function (c) { allCards.push(c); });
            });

            // Split new vs due
            var newCards = [], dueCards = [];
            allCards.forEach(function (c) {
                var s = srs[c.id];
                if (!s) newCards.push(c);
                else if (s.due <= TODAY) dueCards.push(c);
            });
            shuffle(newCards); shuffle(dueCards);
            newCards = newCards.slice(0, NEW_LIMIT);
            var queue = dueCards.concat(newCards);

            if (!queue.length) { toast("Aucune carte à réviser aujourd'hui 🎉"); return; }

            sess.sourceIdx = si;
            sess.sourceId = src.id;
            sess.deckLabel = deckName.split("::").join(" › ");
            sess.cards = allCards;
            sess.queue = queue;
            sess.qIdx = 0;
            sess.srs = srs;
            sess.done = 0;

            document.getElementById("home").style.display = "none";
            document.getElementById("study").style.display = "flex";
            document.getElementById("s-deck-name").textContent = sess.deckLabel;
            showCard();
        }

        function goHome() {
            saveSRS(sess.sourceId, sess.srs);
            document.getElementById("study").style.display = "none";
            document.getElementById("home").style.display = "block";
            renderHome();
        }

        // ═══════════════════════════════════════════════
        // CARD DISPLAY
        // ═══════════════════════════════════════════════
        function showCard() {
            advancing = false; cardErrors = 0; wordRows = [];
            var card = sess.queue[sess.qIdx];
            if (!card) { showDone(); return; }
            updateProgress();

            if (!card.words || !card.words.length) { sess.qIdx++; showCard(); return; }

            var hasAudio = card.audioQuestion && card.audioQuestion.length;
            document.getElementById("s-content").innerHTML =
                '<div class="s-question">' + card.question
                + (hasAudio ? '<button class="s-audio-btn" onclick="playCardAudio(\'q\')">🔊 Écouter</button>' : '')
                + '</div>'
                + '<div class="t-words" id="t-words"></div>'
                + '<div class="t-actions">'
                + '<span class="t-show-ans" onclick="revealAll()">💡 Voir les réponses</span>'
                + '<span class="t-skip" onclick="skipCard()">Passer →</span>'
                + '</div>';

            buildRows(card.words);
            if (hasAudio) playAudioList(card.audioQuestion);
        }

        // ═══════════════════════════════════════════════
        // AUDIO
        // ═══════════════════════════════════════════════
        function playAudioList(urls) {
            if (!urls || !urls.length) return;
            var audio = document.getElementById("audio-player");
            var i = 0;
            audio.onended = function () {
                if (i < urls.length) { audio.src = urls[i++]; audio.play().catch(function () { }); }
            };
            audio.src = urls[i++];
            audio.play().catch(function () { });
        }
        function playCardAudio(which) {
            var card = sess.queue[sess.qIdx];
            if (!card) return;
            playAudioList(which === "a" ? card.audioAnswer : card.audioQuestion);
        }

        function updateProgress() {
            var total = sess.queue.length;
            var done = Math.min(sess.qIdx, total);
            document.getElementById("prog-label").textContent = done + " / " + total;
            document.getElementById("prog-fill").style.width = Math.round(done / total * 100) + "%";
        }

        // ═══════════════════════════════════════════════
        // WORD ROWS
        // ═══════════════════════════════════════════════
        function buildRows(words) {
            advancing = false;
            var section = document.getElementById("t-words"); if (!section) return;
            section.innerHTML = ""; wordRows = [];

            words.forEach(function (word, i) {
                var col = document.createElement("div"); col.className = "word-col";
                var lbl = document.createElement("div"); lbl.className = "wc-lbl";
                var inp = document.createElement("input"); inp.className = "wc-inp";
                inp.type = "text"; inp.placeholder = "···";
                inp.autocomplete = "off"; inp.autocorrect = "off"; inp.spellcheck = false;
                inp.style.width = Math.max(word.length * 14, 48) + "px";
                var hint = document.createElement("div"); hint.className = "wc-hint";
                col.append(lbl, inp, hint);
                section.appendChild(col);

                var entry = { word: word, expected: [word], inp: inp, lbl: lbl, hint: hint, solved: false, errors: 0, _errTimer: null };
                wordRows.push(entry);
                inp.addEventListener("input", makeCheck(entry, i));
                inp.addEventListener("keydown", makeKey(i));
            });

            setTimeout(function () { if (wordRows.length) wordRows[0].inp.focus(); }, 60);
        }

        function makeCheck(entry, i) { return function () { liveCheck(entry, i); }; }
        function makeKey(i) {
            return function (e) { if (e.key === "Enter") { e.preventDefault(); focusNext(i); } };
        }

        function norm(s) {
            return s.toLowerCase().trim()
                .replace(/^[¿¡!.,;:'"«»()\[\]\-–—]+|[¿¡!.,;:'"«»()\[\]\-–—]+$/g, "").trim();
        }
        function noAcc(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, ""); }
        function isMatch(input, expected) { var ni = norm(input), ne = norm(expected); return ni === ne || noAcc(ni) === noAcc(ne); }
        function check(entry) {
            if (!entry.inp.value.trim()) return null;
            return entry.expected.some(function (t) { return isMatch(entry.inp.value, t); });
        }

        function liveCheck(entry, i) {
            var r = check(entry);
            if (r === null) {
                clearTimeout(entry._errTimer);
                entry.inp.className = "wc-inp";
                if (!entry.inp.value.trim()) entry.solved = false;
                return;
            }
            if (r) {
                clearTimeout(entry._errTimer);
                entry.inp.className = "wc-inp ok";
                entry.solved = true;
                entry.lbl.textContent = entry.word;
                entry.lbl.style.color = "#16a34a";
                setTimeout(function () { if (!entry.inp.isConnected) return; focusNext(i); }, 220);
            } else {
                entry.inp.className = "wc-inp err";
                entry.solved = false;
                clearTimeout(entry._errTimer);
                entry._errTimer = setTimeout(function () {
                    if (!entry.inp.isConnected || entry.solved) return;
                    entry.errors++;
                    cardErrors = Math.max(cardErrors, entry.errors);
                    if (entry.errors >= 3) revealHint(entry);
                }, 1500);
            }
        }

        function focusNext(i) {
            for (var j = i + 1; j < wordRows.length; j++) { if (!wordRows[j].solved) { wordRows[j].inp.focus(); return; } }
            for (var j = 0; j < i && j < wordRows.length; j++) { if (!wordRows[j].solved) { wordRows[j].inp.focus(); return; } }
            tryComplete();
        }

        function revealHint(entry) { entry.hint.textContent = entry.expected[0]; entry.hint.style.display = "block"; }
        function revealAll() {
            wordRows.forEach(function (e) {
                if (!e.solved) { revealHint(e); e.lbl.textContent = e.word; e.lbl.style.color = "#ccc"; cardErrors = Math.max(cardErrors, 3); }
            });
            playCardAudio("a");
        }

        function tryComplete() {
            if (advancing) return;
            if (wordRows.every(function (e) { return e.solved; })) {
                playCardAudio("a");
                flash(function () { advanceCard(errorsToRating(cardErrors)); });
            }
        }

        function skipCard() { advanceCard(1); }

        function advanceCard(q) {
            if (advancing) return;
            advancing = true;
            var card = sess.queue[sess.qIdx];
            sess.srs[card.id] = applyRating(sess.srs[card.id] || defaultSRS(), q);
            sess.done++;
            sess.qIdx++;
            if (q === 1 && sess.queue.filter(function (c) { return c.id === card.id; }).length < 2) {
                sess.queue.push(card);
            }
            showPill(q);
            var content = document.getElementById("s-content");
            content.style.cssText = "opacity:0;transform:translateY(-10px);transition:opacity .22s,transform .22s";
            setTimeout(function () {
                content.style.cssText = "opacity:0;transform:translateY(10px);transition:none";
                content.offsetHeight;
                content.style.cssText = "opacity:1;transform:translateY(0);transition:opacity .22s,transform .22s";
                showCard();
            }, 240);
        }

        function flash(cb) {
            var f = document.getElementById("flash");
            f.classList.add("on");
            setTimeout(function () { f.classList.remove("on"); }, 350);
            setTimeout(cb, 400);
        }

        var _pillTimer;
        function showPill(q) {
            var p = document.getElementById("pill");
            p.className = "s-pill " + PILL_CLASS[q];
            p.textContent = PILL_LABEL[q];
            p.classList.add("show");
            clearTimeout(_pillTimer);
            _pillTimer = setTimeout(function () { p.classList.remove("show"); }, 1600);
        }

        function showDone() {
            saveSRS(sess.sourceId, sess.srs);
            document.getElementById("s-content").innerHTML =
                '<div class="s-done">'
                + '<div class="s-done-icon">🎉</div>'
                + '<div class="s-done-title">Session terminée !</div>'
                + '<div class="s-done-sub">' + sess.done + ' cartes révisées aujourd\'hui</div>'
                + '<button class="btn-home" onclick="goHome()">← Retour</button>'
                + '</div>';
            document.getElementById("prog-fill").style.width = "100%";
            document.getElementById("prog-label").textContent = sess.done + " / " + sess.done;
        }

        // ═══════════════════════════════════════════════
        // UTILS
        // ═══════════════════════════════════════════════
        function esc(s) { return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/'/g, "&#39;"); }
        function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

        var _toastTimer;
        function toast(msg) {
            var el = document.getElementById("toast");
            el.textContent = msg; el.classList.add("show");
            clearTimeout(_toastTimer);
            _toastTimer = setTimeout(function () { el.classList.remove("show"); }, 3500);
        }

        // ── INIT ──
        renderHome();
    </script>
</body>
